# Optional: x dev needs none of this. Use it when you want the real Postgres/NATS/MinIO locally.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: social-media-clone
      POSTGRES_DB: social-media-clone
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
  nats:
    image: nats:2-alpine
    command: ['-js']
    ports: ['4222:4222']
  s3:
    image: minio/minio
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: social-media-clone
      MINIO_ROOT_PASSWORD: social-media-clone-dev
    ports: ['9000:9000']
