<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1b1f3b">
    <title>Page not found · Docs Site</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0b0d1a;
        --fg: #e6e8f0;
        --muted: #9aa0b5;
        --accent: #8b93ff;
        --line: #262a45;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --fg: #1b1f3b;
          --muted: #5d6280;
          --accent: #3b46d6;
          --line: #dfe2ee;
        }
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { min-height: 100%; }
      body {
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.5;
      }
      main { max-width: 32rem; }
      .status {
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 { margin-top: 0.5rem; font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; }
      p { margin-top: 0.75rem; color: var(--muted); }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.6rem 1rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        color: var(--fg);
        text-decoration: none;
      }
      a:hover { border-color: var(--accent); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="status">404</p>
      <h1>Page not found</h1>
      <p>There is nothing at this address. The link may be old, or the page may have moved.</p>
      <a href="/">Back to Docs Site</a>
    </main>
  </body>
</html>
