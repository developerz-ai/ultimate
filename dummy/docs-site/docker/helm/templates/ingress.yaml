{{/* Standard ingress, no vendor edge primitives. Off by default: the host is yours to name. */}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "docs-site.fullname" . }}
  labels:
    {{- include "docs-site.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ include "docs-site.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- /* The path the sync node actually serves. Routing /_sync instead sends every
          websocket to the web role, which answers no upgrade. */}}
          {{- /* Only when the sync role runs: a rule naming a Service the chart did not render is an
          ingress that 503s every websocket instead of letting it reach nothing at all. */}}
          {{- if .Values.roles.sync.enabled }}
          - path: /_x/sync
            pathType: Prefix
            backend:
              service:
                name: {{ include "docs-site.fullname" . }}-sync
                port: { name: http }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "docs-site.fullname" . }}-web
                port: { name: http }
{{- end }}
