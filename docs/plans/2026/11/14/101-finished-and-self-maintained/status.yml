evidence:
  - "audit round 1 (2026-11-16, at 31.38.0): 4 read-only auditors (bug-hunter tiers 0–2, tiers 3–5 + scripts; concurrency; security authz + tenancy) + production evidence (demo pods/logs via ../infrastructure verbs) + open issues. Confirmed: P0 1 — live-query cross-tenant read on a tenant column not named orgId (realtime; #1188, reviewed CLOSED twice); P1 2 — parseAmount refused formatMoney output (de-AT, fr-CH, mr-IN, en-ZA code); release-due brief over the 10,000-char cap (#1170); P2 6 — robots non-ASCII Disallow; outbox staged row 60 s; sub-250 ms worker floor 60 s; repeatable-read stage (found in fix review); demo storage on emptyDir (→ 30 I13); CodeQL 7 real of 85 (78 dismissed with reasons). Not converged (P0+P1 > 0)."
  - "audit round 1 read ledger — READ: money, flags, time, i18n (part), cache (lru, codec, tags), storage (range, path, list, s3 listUploads), http (byte-range, forwarded, router, cookie, object-response, cache-policy), core (cookie, cursor, ids), schema (json-schema, url), entity (memory match, like, pg-sql predicates, arrays), db (statement-split, sql-scan, url), seo (xml, robots, feeds), auth (cbor, base64url, member-invite); jobs (wake, outbox, worker loop, webhook, cron, scheduler); realtime (tenancy, matcher-bridge, pg-replication row, live-replicator, record-publisher, offline-queue, client channels); action (meters, idempotency memory); query (matcher, download-token, read/cache); admin (gates, jobs resources, screen-system); mcp (exposed, tenant, server head); cli (shapes saas/realtime/api-keys/invite, sign-in, serve-retire/drain, runtime-jobs, schema wait, schema-diff); mail mime; ai cost; scraping robots/cookies; pwa route-rules; notify digest. UNREAD for round 2: policy; db migrate/pool/drift/generate/keyset/replica/row-security; entity pg-driver/write/upsert/history/partition; http pipeline/server/rate-limit/compress/csrf/cors; storage s3 body/upload/image/signed-url; cache tiers/redis-pubsub/invalidate/memo/semantic/cdn; core (rest); schema validators/coerce; auth sessions/OIDC/api keys/passkeys; cli dev/verify/deploy/upgrade/role-*/prerender/islands; testing; ui; manifest; scripts (most); jobs drivers/steps; realtime server/sync node/presence; admin (rest); mcp app-tool/transport-http; shapes content/blog/agent."
