notes: >-
  Source: eight read-only surveys on 2026-10-01 (a production SPA, a large admin-console app, an
  existing scraping system, an earlier service attempt, a downstream app on 22.15.0, a
  job system compatible with an established Ruby one, a schema-dump tool, this tree at dad6e086). Owner decisions taken:
  09 and 11 ship as BREAKING in the 23.0.0 major, no opt-out; no legacy shims. Still open: a
  job driver over an established Redis queue library (recorded verdict BUILD); recover: 'agent'.
  Slice 02 step 7 (x db reset and the test preload load the dump) is NOT shipped, by measurement:
  loading the dump saved 53–85 ms against a second embedded boot costing 177–224 ms; replay stays
  the one way to build a database, and loadSchemaDump ships for the drift step only.
  Slice 06's onDead was reshaped the same day into ONE onSettled (completed, dead-lettered,
  dropped, refused; at most once); onDead never shipped (docs/history/jobs.md).
  Slice 17: runEvent is a plain entity — no appendOnly exists in this tree (plan 2026/09/22/102
  slice 04 has not landed). The /v1 bearer mount first needed a 107-line app-side keys.ts (a memory
  ApiKeyStore, store selection, the resolver); @ultimat3/auth now ships apiKeyResolver(() => store)
  and the file is 69 lines.
  Slice 15/16: no island ships in the admin — row checkboxes join the batch form by their `form`
  attribute, "all matching" is a radio meaning the list URL, an action's input is its own page,
  confirmation is a server round trip; admin JS stays 0 B. The durable audit log is an AuditLog
  (it must be read for the history card), not a write-only AuditSink. The jobs dashboard is four
  ordinary admin resources plus one overview screen, not one file per screen; permissions are
  job:read / job:manage (the spec's job:list dropped: the admin already read job:read); tabs carry
  no counts, because stats() spans every tenant.
  Slice 17: the reference app keeps a `runs` table whose `status` is a projection of the run's last
  phase event, written only by repo.appendEvent, so the operator view's tabs and `when` read a
  column; `cancel` applies to queued or running. onSettled (not onDead) records how a run ended and
  what it used. browserCost is not stored: the recorded site rents no browser.
  Coverage floors measured 2026-10-01: examples/dummy 71 / 65 after slice 17 (68 / 62 before it, 59.87 / 44.78 at the start), the demo app
  68 / 72, scripts/ 80 / 88; a scaffold measures 100 / 100 (default and --no-example), 99.84 /
  99.39 after all thirteen generators.
  Typed client instantiations (tsc --extendedDiagnostics, 2026-10-01): 100 modules x 3 actions +
  50 x 2 queries 850,546, 0 errors (TS2589 before); 300 x 5 + 100 x 3 3,782,244, 0 errors; the
  committed pins move a narrow action+query tsc from 96,767 to 152,321.
