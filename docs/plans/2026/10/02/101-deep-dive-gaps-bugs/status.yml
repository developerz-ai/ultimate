notes: >-
  Audited at 2ea5eb17 (23.0.0) on 2026-10-02 by three read-only sweeps, 22 auditor runs, findings
  in findings/ (20 files). Sweep 1: seven auditors (four tier-scoped correctness hunts, concurrency,
  security, architecture). Sweep 2: ten auditors over the files sweep 1 listed as unread. Sweep 3:
  two falsification passes and a row-by-row re-read of the 2026-09-28 audit plan. Sweep 3 refuted
  two lows (manifest diff-routes, notify channel-mail), narrowed about a dozen rows and corrected
  about fifteen citations; its files win over sweeps 1-2. No live Postgres, Redis, NATS, S3 or
  browser was used by any sweep. Rows owned by docs/plans/2026/09/28/101-audit-bugs-and-gaps
  (slices 01, 02, 03, 05-09 still open there) are listed per slice under "Owned elsewhere" and are
  not re-planned here.
  Execution rules set by the owner on 2026-10-02: one PR at a time, at most ~100 changed files,
  several agents inside the PR, CI green then merge then the next; no legacy and no compatibility
  shims (a replaced path is deleted, never deprecated); docs move in the same PR as the code; the
  nine breaking rows of overview.md land as BREAKING in one major, released at the end. The
  2026-09-28 plan's slices 01-03 are folded into the matching PRs here (cursor secret in PR 1).
  PR 1 also carries the fix for the intermittent unit-shard hang seen on run 36970672608
  (X_VERIFY_STEP_TIMEOUT naming nothing in flight). That hang's root cause is UNPROVEN: the failing
  log named no file and 40 local iterations over the 254 candidate files never hung; three CI
  occurrences (runs 36970672608, 36961194579, 36959562383) each left exactly two processes. The
  timeout now names the file still running, so the next occurrence identifies it. Unverified lead,
  not changed: packages/cli/src/write-line.ts and scripts/lib/log.ts retry writeSync on EAGAIN in
  an unbounded busy loop.
  PR 1 merged as #616 (43a80b4f). Tier 1 is two PRs to stay under the cap. Local live suites run
  against Postgres 17 and NATS only: ports 6379, 5433 and 9000 on the build machine belong to other
  projects, so the Redis, logical-replication and S3 live suites are proven in CI alone.
  PR 2 merged as #617 (ee692a08). The unit-shard hang named itself on its CI run:
  packages/cli/src/templates/emitted-contract.test.ts, a worker blocked in Bun.spawnSync of Biome.
  The stall did not reproduce in about 200 starved runs, so the cause stays unproven; every
  synchronous spawn in a test (14 sites) now awaits its child. main went red once on ee692a08 from
  packages/cli/e2e/client-navigation-cache.e2e.test.ts: the test slept 400 ms and assumed a 65 ms
  hover timer had fired; under a renderer stall the prefetch left after the write and rightly
  answered the click. The test now waits on events; PR 3 carries it.
  Carried forward: three drift fix lines (changedColumn, missingCheck, changedForeignKey) still
  pair SQL with a shell comment and are duplicated in entity - PR 4. One unexplained single failure
  of packages/scraping/src/session-seal.test.ts in a batch run - tier-5 PR. A guard refusing an
  un-timed spawnSync in a test - scripts PR.
  X_STORAGE_NOT_FOUND's fix names the driver kind, not the registered disk, on all three drivers
  (pre-existing; the s3 and memory drivers do not know their registered name) - unify PR, slice 14.
  PR 4 limits /healthz and /readyz detail to healthDetailPeers on the web role only. The sync role
  (packages/realtime/src/sync-upgrade.ts:86-88) still answers the full report to any caller and has
  no http import. Decided for the realtime PR (slice 08): the body rule and the peer-list match move
  to core (which owns the health payloads), http and realtime both call it, cli passes
  healthDetailPeers into createSyncNode (packages/cli/src/role-sync.ts:198), and the sync node
  answers the reduced body to any request carrying a Forwarded / X-Forwarded-For header, so a
  same-box proxy cannot make every caller loopback. No new import edge.
  PR 3 merged as #618 (b698a3d9). main's CI went red on it from a third, unrelated flake:
  scaffold-smoke (demoapp), X_CDP_LAUNCH_FAILED - Chrome started on the runner and did not announce
  a DevTools endpoint before the launcher's deadline (run 37007059251). Re-run requested. The
  launcher (packages/testing/src/cdp-launch.ts:200) is in the tier-5 PR's scope: establish its
  deadline against a cold runner and whether a failed launch may be relaunched once.
  Tier 2 is three PRs: 4a entity, policy and the db drift fixes; 4b http plus the browser launcher
  (that flake was fixed at once: a 60 s launch deadline, one relaunch after a full reap, Chrome in
  its own process group, one awaited close()); 5 auth.
  Review of 4a established that a fix: must be a command naming the real object. About 26 more
  fixes in packages/entity/src splice the entity name into code written against a variable the
  author never named (bulk-write, batch, aggregate, count-by, plan, errors, feature-errors,
  memory-match) and the same shape exists in other packages. Repo-wide sweep plus a guard that
  refuses a fix that is code rather than a command - its own PR beside slice 13.
  Two test files leave state in a shared registry and break others when run in one process
  (packages/cli/src/n-plus-one-detector.test.ts; packages/query beside packages/admin). The gate
  isolates files, so it is green; fix in the cli and query PRs.
  examples/dummy's own per-package typecheck script reports 351 errors (rootDir, @postly/mcp);
  root tsc -b and the app gate are clean. Diagnose in the dev-experience PR.
  Nothing in the build flags an unawaited promise - scripts PR.
  PR 4b merged as #620 (3b76f7ba). developerz-ai[bot] published Releases v23.0.1 and v23.0.2 with
  lightweight tags on the 4a and 4b merge commits; release.yml's check refused both, nothing
  reached npm, and both were deleted with their tags. Check gh release list after every merge.
  main went red once on 3b76f7ba from examples/dummy's stale-build e2e: a DevTools call unanswered
  for 30 s (X_CDP_TIMEOUT). Not a regression from #620 - that page learns of a build over the sync
  socket, and every response in every traced run was 200. The stall did not reproduce in 60 runs.
  PR 5 carries what was found beside it: the network fixture restored the cable without awaiting
  (the next test's page read navigator.onLine false in 9 of 15 runs), freePort could hand out a
  port Chromium refuses, and X_CDP_TIMEOUT now reports what the wire did.
  For the realtime PR, with a trace: one like, one idempotency key, four POSTs - the 200 landed in
  a document being replaced and the next /feed boot re-sent it (packages/realtime/src/
  page-outbox.ts:104, :153-155, :262). Settle whether that is at-least-once as designed. The
  'like taken offline' e2e is satisfied by the optimistic count before the server confirms.
  For the cli PR: nothing checks that x auth seal-mfa has run except x doctor when someone runs
  it - a boot-time warning with the unsealed count would enforce the operator step.
  PR 5 merged as #622 (f8fa90bf). PR 6 found that entity's own comparison rule - the one the plan
  told query to adopt - disagreed with Postgres 17 on 9 rows (decimal equality by string identity,
  uuid order as written); entity's memory driver, invariants and query's matcher now share one rule,
  numericOrder, proven on memory, PGlite and Postgres 17.
  For the admin PR (slice 11): 22 admin test files call defineAdmin() at module scope
  (describe.test.ts:38, routes.test.ts:42, ...), so `bun test ./packages/admin ./packages/query`
  in one process still fails 165 query tests in that order. The source is fixed in PR 6 (importing
  admin declares nothing); move those calls into beforeAll. Also there: nothing tells an app its
  closed permission set leaned on the admin import - a boot check that every can() literal is
  declared would.
  developerz-ai[bot] published v23.0.1 again, on PR 5's merge commit; deleted with its tag.
  For the cli PR: configureIdempotency({ scope: 'shared' }) on more than one replica is an
  instruction with no check - x doctor or boot should refuse the default scope there.
  Also for the cli PR: packages/cli/src/role-start.test.ts 'the sync node answers the upgrade on
  the web role's own port' failed once in a batch and passed alone three times - cause unknown.
  For the testing PR: a custom JobDriver.claim that ignores onExhausted / dropExhausted compiles
  and re-claims forever - a driver conformance suite in @ultimat3/testing would enforce the burial.
  PR 6b merged as #624 (880bbd87); the bot's v23.0.1 on it was deleted again. PR 7 merged as #625
  (0afde8d4); the bot's v23.0.1 on it was deleted too - five times in one day.
  For the cli PR, from slice 08: the drift step does not see replica identity, so an existing app
  with a params channel is not told it needs the FULL-identity migration; a dedicated replicator
  container serves no /readyz (the metrics endpoint could answer it, with a probe in both helm
  templates); nothing refuses a mixed-major replicator / sync fleet at boot (a version on the bus
  envelope would); x doctor could probe APP_URL on the sync role.
  For the admin PR, also: move 22 module-scope defineAdmin() calls (see above). Section A of slice 15 holds 21 owner decisions; five were first asked on
  2026-09-28. Unaudited areas are listed at the end of each findings file.
