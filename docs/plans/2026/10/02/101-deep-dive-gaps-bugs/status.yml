notes: >-
  Audited at 2ea5eb17 (23.0.0) on 2026-10-02 by three read-only sweeps, 22 auditor runs, findings
  in findings/ (20 files). Sweep 1: seven auditors (four tier-scoped correctness hunts, concurrency,
  security, architecture). Sweep 2: ten auditors over the files sweep 1 listed as unread. Sweep 3:
  two falsification passes and a row-by-row re-read of the 2026-09-28 audit plan. Sweep 3 refuted
  two lows (manifest diff-routes, notify channel-mail), narrowed about a dozen rows and corrected
  about fifteen citations; its files win over sweeps 1-2. No live Postgres, Redis, NATS, S3 or
  browser was used by any sweep. Rows owned by docs/plans/2026/09/28/101-audit-bugs-and-gaps
  (slices 01, 02, 03, 05-09 still open there) are listed per slice under "Owned elsewhere" and are
  not re-planned here.
  Execution rules set by the owner on 2026-10-02: one PR at a time, at most ~100 changed files,
  several agents inside the PR, CI green then merge then the next; no legacy and no compatibility
  shims (a replaced path is deleted, never deprecated); docs move in the same PR as the code; the
  nine breaking rows of overview.md land as BREAKING in one major, released at the end. The
  2026-09-28 plan's slices 01-03 are folded into the matching PRs here (cursor secret in PR 1).
  PR 1 also carries the fix for the intermittent unit-shard hang seen on run 36970672608
  (X_VERIFY_STEP_TIMEOUT naming nothing in flight). That hang's root cause is UNPROVEN: the failing
  log named no file and 40 local iterations over the 254 candidate files never hung; three CI
  occurrences (runs 36970672608, 36961194579, 36959562383) each left exactly two processes. The
  timeout now names the file still running, so the next occurrence identifies it. Unverified lead,
  not changed: packages/cli/src/write-line.ts and scripts/lib/log.ts retry writeSync on EAGAIN in
  an unbounded busy loop.
  PR 1 merged as #616 (43a80b4f). Tier 1 is two PRs to stay under the cap. Local live suites run
  against Postgres 17 and NATS only: ports 6379, 5433 and 9000 on the build machine belong to other
  projects, so the Redis, logical-replication and S3 live suites are proven in CI alone. Section A of slice 15 holds 21 owner decisions; five were first asked on
  2026-09-28. Unaudited areas are listed at the end of each findings file.
