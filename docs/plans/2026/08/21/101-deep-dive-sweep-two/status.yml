notes: >
  Written 2026-08-21 from eight read-only audits (bug hunts tiers 0-1 / 2-3 / 4-5, concurrency,
  security, architecture, gate+CI+docs, scaffold DX against published 7.0.0). 13 findings proven by
  execution are tabled in overview.md. The ask named `x deps`; it is `x affected`. Prior sweep
  (2026/08/16/101) deferred items re-verified and carried where still open.

  DECISIONS, recorded 2026-08-22 (12-decisions.md rows):
  D1: ONE major, 8.0.0, AND IT SHIPS. All four breaking changes batched; CHANGELOG gains one
      `BREAKING —` row per change under an `8.0.0` heading and `wiki/Upgrading.md` gains the
      section with a count of 4 that `changelog-check` pins. Revised 2026-08-22 on the user's
      instruction ("cleaned released all green"): the release IS in scope — every slice merged and
      green on main, then `scripts/release.ts` stamps 8.0.0 across all 30 workspaces, an ANNOTATED
      `git tag -a v8.0.0` is pushed, a GitHub Release is published (the Release is the workflow's
      trigger; a lightweight tag is not), the `npm-publish` environment gate is approved by its
      named reviewer — the operator, or the agent holding `workflow` scope, which is what that
      scope means and what `.claude/commands/feature.md` documents — on a green run and on THIS
      ask, and `scripts/registry-audit.ts --json` must then answer 30/30 at 8.0.0, every one
      attested. The ask is the authorisation; the credential is only the reach.
  D2: WIRE @ultimat3/seo. `x new` scaffolds `site/sitemap.xml/route.ts` and `site/robots.txt/route.ts`
      over `buildSitemap`/`buildRobots`. Lands in the scaffold slice (08), not in slice 02.
  D3: DELETE `PwaConfig.installPrompt`, `AuthConfig.afterSignInPath`, `AiConfig.modelEnv`.
      Breaking; one-line migration each; slice 09's `config-readers` check keeps the class out.
  D4: SHIP `postgresRateLimitStore` + `postgresAuthLimiter` over a `PgExecutor` seam, wired from
      `startWeb`. The interim warning (slice 07) ships too, for the un-wired case.
  D5: DECLARED FLOOR with a written reason (`FLOOR_ABOVE` in scripts/lib/tiers.ts) for all five
      packages above their floor — `render`, `ui`, `scraping`, `policy`, `pwa`. DEVIATION from the
      plan's recommendation: NO package is moved. Moving `pwa` 4 -> 2 is legal but orthogonal to
      making the rule enforceable, and it risks a real regression inside a sweep that is already
      landing four breaking changes. Write `policy`'s and `pwa`'s sentences; move nothing.
  D6: ADD `x verify --only <step>`; header and `--json` both carry `NOT A GATE RUN`; the no-flag
      run is still the gate.
  D7: DEFER `updateSignal` / `x deploy --critical`. Not this plan's call — filed as #289 (wire
      it behind a real `--critical`, or delete the export; #161 closed the flag's promise only).
  D8: DELETE render's `matchRoute`/`RouteMatch` (`registry.ts:337-370`). http's trie is the live one.
  D9: DELETE `invalidateWireTags` now (restore with `x cache`). `recentTierFailures` stays deferred
      by #117.
  D10: REFUSE `arrayOf(json(...))` / `arrayOf(bytes())` at declaration. Neither tracked app uses one.
  D11: YES, `x new` runs `git init`, `--no-git` opts out.
  D12: YES, `scaffold-smoke` follows the printed `fix:` lines. Accept the extra ~40s.
