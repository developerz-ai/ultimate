evidence:
  - pr: 101
    merged: 290dd96
    slices: [05, 10]
    gate: "14 of 17 passed, 3 skipped (drift, contract-diff, budgets)"
    falsified:
      - "10-1: `bun run test` was NOT red by shard byte-packing. Every shard already runs
         --isolate, which fully prevents the render-plugin leak; sharding by package would
         have fixed nothing and cost ~30% on the biggest bin. The divergence was one missing
         flag on root package.json's `test` script."
      - "05-5: packages/cli/src/source-files.ts:11 ALREADY contained scripts/**. The narrow
         list was scripts/boundaries.ts's own SOURCE_PATTERNS."
      - "10-L: '/e2e/' is not an expressible bun filter (bun 1.3.14: 'had no matches').
         The working form is 'e2e/'."
    deferred:
      - "282 typecheck errors in .test.ts across 110 files / 24 packages — every package
         tsconfig excludes src/**/*.test.ts. Measured, not fixed. Known-Gaps row landed."
      - "serial live/e2e steps still run without --isolate; measured 28s -> 56s. Recorded."
      - "X_PACKAGE_UNREFERENCED fail-opens on a JSONC root tsconfig (comment => parse
         returns undefined => rule reads it as 'no project references')."
    new_codes: [X_REFERENCE_APP_NO_FLOOR, X_SCAFFOLD_GATE_RED, X_PACKAGE_UNREFERENCED]
  - pr: 110
    slices: [02, 06]
    gate: "14 of 17 passed, 3 skipped (drift, contract-diff, budgets); app gate green, every pin
           holds — examples/dummy 10/17 (7 red, 7 pinned), social-media-clone 14/17 (3 red, 3 pinned)"
    falsified:
      - "02-3b: 'reverse the Redis set ordering' is HALF a fix and worse alone. SADD-then-SET with
         no re-check lets the bust SREM the membership and the later SET publish a row unreachable
         by ANY tag — permanently uninvalidatable. Ships with an SISMEMBER re-check."
      - "02-cursor: fixing `queryHash` alone was too narrow. `fingerprint` also backs
         `cacheKeyFor`, so the 32-bit hash over client-chosen input was ALSO the shared cache
         entry key — strictly worse than the cursor case the sweep named."
      - "06-attempt: repeated suspensions cannot drive `attempt` negative. `nack` is fenced on
         state === 'running', which only `claim` sets, and `claim` increments."
      - "06-deadline: `configureLifecycle({deadlineMs})` is NOT unused — http/src/server.ts:97
         declares one on every createServer. And X_SHUTDOWN_TIMEOUT already existed."
      - "02-dates: the bare-Date.now() list in the cache package is EMPTY — fixed in #105/#106/#107.
         Only `remember` bypassing assertTtl was real."
    decided:
      - "The drain deadline flipped from opt-in to bounded-by-default (25s). Built opt-in as
         briefed, but `jobs` and `realtime` declare no budget, so the proven symptom — a worker pod
         SIGKILLed mid-job — stayed unfixed. A mechanism that does not fix the symptom while
         claiming the deadline works is a claim wider than what is enforced."
      - "Colocated test fakes ship in the tarball. Four now do; a one-off `files` negation in one
         package invents a convention nothing else follows. If it matters it is one sweep over all
         29 package.json, and it belongs to the dead-code slice."
    deferred:
      - "The cache fill fence is PER PROCESS — two pods still interleave a load on one with a write
         and bust on the other. Cross-node needs a Redis-side epoch and a wire change. Known-Gaps
         row landed."
      - "`createCacheStack` has zero production callers, so its copy of the fence is dormant. The
         live fenced path is runQuery -> readRows -> readThrough -> fill."
      - "`recentTierFailures()` has no reader outside cache, and /_x's invalidations source is
         `unwired` — routed to slice 03."
      - "`invalidateWireTags` has zero callers but is the wire-form door `x cache bust` will call.
         Not dead; recorded for slice 15 to weigh."
      - "`cache.scope` is auditable by grep, not by `x queries describe` — publishing it on
         QueryDescriptor ripples into both tracked apps' manifests."
    new_codes: [X_JOB_SLOT_LOST, X_QUERY_CACHE_TTL_INVALID]
  - pr: 112
    slices: [02, 06]
    gate: "14 of 17 passed, 3 skipped; app gate every pin holds — examples/dummy 10/17 (7 red,
           7 pinned), social-media-clone 14/17 (3 red, 3 pinned)"
    falsified:
      - "02-H4 said ELEVEN caller-caused codes; it is TEN. X_QUERY_NOT_PAGEABLE is a developer bug
         by its own fix: (an edit to the read's own SQL — nothing the caller sends changes it), and
         X_IDEMPOTENCY_REPLAYED_FAILURE surfaces as itself only when the first attempt carried no
         code. Both got explicit 500 rows so the new check sees a decision, not an omission."
      - "02-H1's 'follow the shape scheduler.ts:153 uses' would have made it WORSE: that line is a
         colon-joined string over framework-controlled values with no actor in it — exactly the
         ambiguous encoding the fix had to avoid. A JSON tuple was used instead."
      - "02-L3's 'SQL_ACK/SQL_NACK in the same file' — they are in jobs/driver-pg-sql.ts, and they
         fence on id AND state because jobs' settle API carries the job id. Idempotency's does not,
         so only the state half was available."
      - "02-M7's prototype description was wrong: pollution fires on the FIRST occurrence, not the
         second, and Object.prototype is never mutated — out['__proto__'] reads a non-undefined
         inherited value, so the repeated-key branch assigns an ARRAY as the object's prototype."
      - "auth and entity were listed as in scope and are FULLY CLOSED — 02-M1 by #104, 02-M6 and
         02-L4 by #106. Remaining entity mentions are pattern citations inside other findings."
    decided:
      - "The completeness step is a RATCHET, not the audit's literal rule. 'Every tier <= 4 code
         needs a row' flags 237 of 394 — a step an agent disables in week one — and reachability is
         not derivable (same tier, same shape, and blanket re-exports collapse the import graph).
         226 codes pinned with a reason per group; the list may only shrink."
      - "It is a fourth rule on the existing `errors` step, not an eighteenth step: VerifyStepName
         is a closed union a generated app inherits, and an app cannot run a check only this repo
         can. Precedent already written at scripts/verify.ts:126-129."
      - "X_LIFECYCLE_DRAINED got a 500 ROW rather than a backlog pin. 500 asserts no reachability
         the way 503 would, and a row records a decision where a pin records indecision. Precedent:
         X_CORS_CONFIG_INVALID, X_RATE_LIMIT_NOT_SHARED."
    deferred:
      - "action's stableStringify still folds -0/NaN/Infinity and CANNOT take query's fix: it is
         also the OpenAPI document serializer, so emitting the bare token NaN would make a published
         spec invalid JSON. Needs the spec serializer split from the hash canonicalizer."
      - "invoke()'s cache bust is not transaction-aware — a real design change and a db seam tier-3
         action deliberately does not import. No tracked app calls transaction( in apps/."
      - "admin (tier 5) is outside the completeness check although X_ADMIN_DENIED reaches a browser;
         the dashboard is dev-only and refused in prod, so ~80 more pins would buy no signal."
      - "The last idempotency race (a straggler landing while the REPLACEMENT reservation is in
         flight) needs the reservation id in settle — a public IdempotencyStore signature change."
      - "reference-app-gate.ts drops the failing shard's stdout, so an app-gate failure names no
         test. Diagnosing one flake cost a standalone re-run plus reading the app's test sources."
    new_codes: [X_IDEMPOTENCY_KEY_INVALID, X_LIFECYCLE_DRAINED, X_ERROR_STATUS_MISSING,
                X_ERROR_STATUS_BACKLOG_STALE, X_ERROR_STATUS_UNKNOWN_CODE]
  - pr: 113
    slices: ['03']
    gate: "14 of 17 passed, 3 skipped; app gate every pin holds — examples/dummy 10/17 (7 red,
           7 pinned), social-media-clone 14/17 (3 red, 3 pinned)"
    falsified:
      - "Unifying render's JSON-LD escaping with seo's would have made it WEAKER: seo handles `</`
         but not `<!--<script>`, which moves the tokenizer into double-escaped state where the
         element's own `</script>` no longer closes it — and it applies the CODE rule to a JSON body
         where the total \\uXXXX rule is strictly safer."
      - "admin -> mcp is NOT a sideways import. admin is tier 5, mcp is tier 4 — downward, and mcp
         was already a runtime dependency of admin. The shared SQL guard needed no new home."
      - "The admin catalog was missing 69 keys, not 27. Twenty travel as DATA (titleKey, labelKey,
         reason literals reached through t(variable)) and are invisible to any extractor that reads
         only t() arguments."
      - "ROLE=migrate was never broken. runRole reads options.env and nothing reads argv, so every
         documented release-phase promise holds; only appended argv is silently discarded."
      - "The budgets pins CANNOT go green from this slice: cmd-verify reads .x/build-stats.json and
         never produces it, .x/ is gitignored, and the app gate never runs `x build`. No gate event."
      - "`lines` being absent from the --json payload IS the contract, obeyed by 23 of 24 call
         sites. The violator was cmd-build.ts, which put the builder's output only there — so CI got
         X_BUILD_FAILED and nothing to act on."
      - "docker/docker-compose.prod.yml does NOT carry the scaffold's bug. The framework image's
         ENTRYPOINT is the CLI binary itself, so `command:` arrives correctly; only the scaffolded
         app's entrypoint reads ROLE and ignores argv. Verified before editing; no change made."
      - "The routed `invalidations: unwired` finding is FALSE: the stub is real text but provably
         overridden by dev-dashboard.ts, the only path x dev takes. A real line, a wrong claim."
      - "Two slice-03 findings were already fixed by #101 — testing/harness.ts's close() and
         template-db.ts's unconditional migrate."
    decided:
      - "pwa's four findings are NOT fixed. It is 3,407 LOC with only planIcons reachable and stays
         unwired by decision, so fixing internals of code with no callers is dead work."
      - "The two new tier-4 codes were PINNED, not given status rows, and the repo's own prior
         answers decided it: X_MAIL_ADDRESS_INVALID beside X_MAIL_HEADER_INVALID (the CR/LF gate on
         headers vs the envelope — same class), X_MCP_RESOURCE_DUPLICATE beside
         X_MCP_TOOL_DUPLICATE (both registration-time, never per-request)."
      - "seo's renderHeadTags DELETED rather than made to delegate: seo is tier 1 and render tier 4,
         and the two doctrines are opposites — xml.ts escapes INTO entities, which is exactly wrong
         inside a raw-text element. A tier-1 export named 'escape script content' would invite the
         very trap being removed."
      - "admin's local SQL guard deleted rather than extended: it covered three of five forms, so it
         produced two explanations for one failure mode, and its message called a $tag$ body and a
         block comment 'a quote'. It was shadowing a BETTER message with a vaguer one."
    deferred:
      - "The inline mail path never runs mailMessageSchema. One call closes it, but it would newly
         reject every send whose locale/tz/url fails validation — blast radius is both tracked apps
         and every scaffold."
      - "LCP is never measured for ANY render mode, so an lcp-only budget passes silently once a
         route has a stats row. Needs a browser, i.e. the e2e step's domain."
      - "runRole is not argv-aware. The complete fix spans the CLI and both tracked apps' generated
         server.ts, so it cannot land in one file set."
      - "seo's renderLd is a third uncalled export, but it returns data and escapes nothing, so it
         carries no vulnerability. Dead-code slice."
      - "TEST_EXCLUSION lacks .tsx — latent; zero .test.tsx files exist, and changing it fails
         package-shape for all 28 published packages until every files array is edited."
    new_codes: [X_CATALOG_KEY_UNREACHABLE, X_MAIL_ADDRESS_INVALID, X_MCP_RESOURCE_DUPLICATE]
  - pr: 114
    slices: ['11', '14']
    gate: "14 of 17 passed, 3 skipped; app gate every pin holds. CodeRabbit reviewed for real —
           25 comments, first unthrottled in four PRs — and a second commit answers them"
    falsified:
      - "The two worst defects were in NEITHER slice doc, and both needed EXECUTION not reading:
         the shipped image was dead on arrival (musl binary on a glibc runtime, every container
         exiting `exec: no such file or directory`) while the build stayed green because the
         --version guard ran on the BUILD image; and RENDER.app = 'stream' meant every generated
         app/ route threw X_ROUTE_MODE_INVALID at import and registered NO ROUTE AT ALL."
      - "`lint` was red from ONE TRAILING BLANK LINE in an emitted test file. Both named causes
         (Bun.env['SITE_ORIGIN'], the biome $schema pin) are Biome INFOS — `biome check` exits 0
         with all three present."
      - "docker/Dockerfile has NO HEALTHCHECK at all and never had; the four byte-identical /readyz
         ones are in the scaffold template and the two apps."
      - "The grace periods ALREADY satisfied the 25s drain deadline — 45s in the chart, 30s in
         compose. No value changed."
      - "ROLE=migrate was never broken: runRole reads options.env and nothing reads argv, so every
         documented release-phase promise held. Only appended argv was discarded."
      - "The budgets pins CANNOT go green from this slice, and measuring inside the step would make
         it worse: social-media-clone prerenders in 8.2s but examples/dummy FAILS in 5.9s
         (X_PRERENDER_FAILED on /offline), so the step would report a build failure under the name
         'budgets'. Skipping was rejected too — the code documents that as the false green an
         earlier wave closed."
      - "`x docs` works, X_DB_DRIFT is not circular, the `Declared` alias does not exist, `✗` on
         success was fixed long ago, and the introspection-command noise does not reproduce in
         either tracked app. Five findings dropped."
      - "helm pullPolicy: IfNotPresent is not a defect. The real bug behind it was appVersion 0.0.1
         naming a tag that has never existed."
    decided:
      - "Eight claims the repo made about itself are now build errors. Two are shaped by what a
         NAIVE version would have broken: the table checker splits on UNESCAPED pipes only (36 rows
         across 16 wiki pages carry an escaped one), and the image rule checks libc FAMILY, not
         base-image version, because a tag->glibc table fails on a correct Dockerfile the day the
         base rebases."
      - "X_IMAGE_GUARD_MISSING is deliberately NOT 'the file contains a guard' — the Dockerfile that
         shipped the dead image HAD one, in the wrong stage, which is how it survived review. The
         rule is that the final stage's ENTRYPOINT must be executed by a RUN in THAT stage."
      - "TWO proposed gate rules were KILLED BY MEASUREMENT. An invented-verb rule flags 21 fix
         lines, 20 of them false positives — including `open the route to <host>:<port>, then:
         x doctor db`, the same word in the same position, correct. A helm render assertion would
         reproduce the fail-open shape at a seam with no skip accounting, and its assertions are
         snapshot counts."
      - "A shared helper for the policy-missing message was argued down: it saves 24 characters,
         adds an import to three packages, and prevents nothing, because the next author still has
         a name in scope and a hole in the sentence."
    deferred:
      - "ENFORCEMENT GAP: all 29 packages/*/tsconfig.json exclude src/**/*.test.ts and typecheck is
         tsc -b, so THE GATE'S FIRST STEP READS ZERO TEST FILES. Same gap as #101's carried '282
         typecheck errors across 110 test files', now corroborated from the other end."
      - "ENFORCEMENT GAP: citedCommandProblem judges the next BARE WORD as a subcommand and never
         inspects FLAGS, so X_PRERENDER_FAILED's `x build --route <path>` passes while --route does
         not exist."
      - "ENFORCEMENT GAP: a fix: containing can('…')/allow('…') whose argument is neither a literal
         resource:verb nor a placeholder. The same mistake occurred in action, query AND admin."
      - "A helm .live. suite with its step in x.verify.json is the honest home for chart coverage —
         branch-shaped assertions only, never the 19-object count."
      - "examples/dummy's /offline page calls useMutationQueue() at prerender, so x build --target
         static cannot complete on the reference app."
      - "x deploy --method compose ignores --image entirely; closing it spans docker/ and templates."
    human_steps_owed:
      - "npm publish -w @ultimat3/flags --access public, BEFORE the next release. The workflow
         publishes tier by tier under set -e and flags is tier 1, so core and schema land on the
         registry at the new version before the run dies: an IRREVERSIBLE PARTIAL RELEASE, 2 of 29
         packages ahead, unpublishable."
      - "Create the npm-publish environment with required reviewers. A workflow referencing an
         environment that does not exist AUTO-CREATES an empty one with no protection rules and
         publishes ungated, while the YAML still reads as gated."
      - "Add the v* deployment tag rule."
      - "Set Trusted Publisher Environment = npm-publish on npmjs.com, per package. Blank today,
         which means a token from ANY run of release.yml is accepted."
    new_codes: [X_PUBLISH_LIST_INCOMPLETE, X_PUBLISH_LIST_UNKNOWN, X_BENCH_CLAIM_STALE,
                X_WIKI_TABLE_MALFORMED, X_FRAME_DOCS_STALE, X_CHART_VERSION_STALE,
                X_IMAGE_LIBC_MISMATCH, X_IMAGE_GUARD_MISSING]
notes: >
  Slice order in this file is execution order, not tier order — 05 and 10 land first because the gate
  does not yet mean what it says, and 08 lands late because it is mostly deletions that would collide
  with patches from 01-03. Findings reached by more than one sweep are cross-linked in overview.md
  under "PR shape": fix once, cite both. Two design decisions must be made explicitly before their
  slices can land — job-surface tenancy (07) and MoneyValue.scale (09).
