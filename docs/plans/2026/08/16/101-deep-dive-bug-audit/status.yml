evidence:
  - pr: 101
    merged: 290dd96
    slices: [05, 10]
    gate: "14 of 17 passed, 3 skipped (drift, contract-diff, budgets)"
    falsified:
      - "10-1: `bun run test` was NOT red by shard byte-packing. Every shard already runs
         --isolate, which fully prevents the render-plugin leak; sharding by package would
         have fixed nothing and cost ~30% on the biggest bin. The divergence was one missing
         flag on root package.json's `test` script."
      - "05-5: packages/cli/src/source-files.ts:11 ALREADY contained scripts/**. The narrow
         list was scripts/boundaries.ts's own SOURCE_PATTERNS."
      - "10-L: '/e2e/' is not an expressible bun filter (bun 1.3.14: 'had no matches').
         The working form is 'e2e/'."
    deferred:
      - "282 typecheck errors in .test.ts across 110 files / 24 packages — every package
         tsconfig excludes src/**/*.test.ts. Measured, not fixed. Known-Gaps row landed."
      - "serial live/e2e steps still run without --isolate; measured 28s -> 56s. Recorded."
      - "X_PACKAGE_UNREFERENCED fail-opens on a JSONC root tsconfig (comment => parse
         returns undefined => rule reads it as 'no project references')."
    new_codes: [X_REFERENCE_APP_NO_FLOOR, X_SCAFFOLD_GATE_RED, X_PACKAGE_UNREFERENCED]
  - pr: 108
    slices: [02, 06]
    gate: "17 of 17 passed, 3 skipped (drift, contract-diff, budgets)"
    falsified:
      - "02-3b: 'reverse the Redis set ordering' is HALF a fix and worse alone. SADD-then-SET with
         no re-check lets the bust SREM the membership and the later SET publish a row unreachable
         by ANY tag — permanently uninvalidatable. Ships with an SISMEMBER re-check."
      - "02-cursor: fixing `queryHash` alone was too narrow. `fingerprint` also backs
         `cacheKeyFor`, so the 32-bit hash over client-chosen input was ALSO the shared cache
         entry key — strictly worse than the cursor case the sweep named."
      - "06-attempt: repeated suspensions cannot drive `attempt` negative. `nack` is fenced on
         state === 'running', which only `claim` sets, and `claim` increments."
      - "06-deadline: `configureLifecycle({deadlineMs})` is NOT unused — http/src/server.ts:97
         declares one on every createServer. And X_SHUTDOWN_TIMEOUT already existed."
      - "02-dates: the bare-Date.now() list in the cache package is EMPTY — fixed in #105/#106/#107.
         Only `remember` bypassing assertTtl was real."
    decided:
      - "The drain deadline flipped from opt-in to bounded-by-default (25s). Built opt-in as
         briefed, but `jobs` and `realtime` declare no budget, so the proven symptom — a worker pod
         SIGKILLed mid-job — stayed unfixed. A mechanism that does not fix the symptom while
         claiming the deadline works is a claim wider than what is enforced."
      - "Colocated test fakes ship in the tarball. Four now do; a one-off `files` negation in one
         package invents a convention nothing else follows. If it matters it is one sweep over all
         29 package.json, and it belongs to the dead-code slice."
    deferred:
      - "The cache fill fence is PER PROCESS — two pods still interleave a load on one with a write
         and bust on the other. Cross-node needs a Redis-side epoch and a wire change. Known-Gaps
         row landed."
      - "`createCacheStack` has zero production callers, so its copy of the fence is dormant. The
         live fenced path is runQuery -> readRows -> readThrough -> fill."
      - "`recentTierFailures()` has no reader outside cache, and /_x's invalidations source is
         `unwired` — routed to slice 03."
      - "`invalidateWireTags` has zero callers but is the wire-form door `x cache bust` will call.
         Not dead; recorded for slice 15 to weigh."
      - "`cache.scope` is auditable by grep, not by `x queries describe` — publishing it on
         QueryDescriptor ripples into both tracked apps' manifests."
    new_codes: [X_JOB_SLOT_LOST, X_QUERY_CACHE_TTL_INVALID]
notes: >
  Slice order in this file is execution order, not tier order — 05 and 10 land first because the gate
  does not yet mean what it says, and 08 lands late because it is mostly deletions that would collide
  with patches from 01-03. Findings reached by more than one sweep are cross-linked in overview.md
  under "PR shape": fix once, cite both. Two design decisions must be made explicitly before their
  slices can land — job-surface tenancy (07) and MoneyValue.scale (09).
