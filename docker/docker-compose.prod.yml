# The same image, once per role. This file IS the production topology: scale a role by scaling its
# service, and nothing about the code changes.
#
#   IMAGE=ghcr.io/you/app:1.2.3 docker compose -f docker/docker-compose.prod.yml run --rm migrate
#   IMAGE=ghcr.io/you/app:1.2.3 docker compose -f docker/docker-compose.prod.yml up -d web sync worker scheduler
#
# `IMAGE` must name an APP image and the commands above show it for that reason. The `Dockerfile`
# beside this file builds the framework's CLI (`/app/x` and nothing else) and cannot serve any of
# these roles — `ROLE` is read by `runRole()`, which an app's `apps/web/server.ts` calls. An app
# image is `x build --target docker` over the app's OWN `docker/Dockerfile`, which `x new` writes.
# The `ultimate-app:latest` default below is a placeholder, not a buildable reference here.
#
# In an app, this file is a specimen of the one `x new` scaffolds and `x deploy --method compose`
# runs — `planDeploy` resolves `docker/docker-compose.prod.yml` from the APP root
# (packages/cli/src/cmd-deploy.ts:125), never from the framework.
#
# A published host port has exactly one binder, so the two roles that publish one run at
# `replicas: 1` here. That is the rung, not a defect: Compose is one box (docs/ops/README.md), and
# the horizontal scaling of `web` and `sync` lives in docker/helm with an HPA per role. To scale
# them on one box anyway, delete the `ports:` line and put your own proxy on this network — the
# service name resolves to every replica over the compose DNS round robin.

name: ultimate

x-image: &image ${IMAGE:-ultimate-app:latest}

x-common: &common
  image: *image
  restart: unless-stopped
  env_file: [../.env.production]
  # SIGTERM drains in-flight work before the process exits. At least `DEFAULT_DEADLINE_MS`
  # (packages/core/src/lifecycle.ts, 25s) — the drain abandons a hook at its own deadline, so a
  # value below that is Docker SIGKILLing a process that was about to exit cleanly, and the twin of
  # `terminationGracePeriodSeconds` in docker/helm/templates/deployments.yaml. Raise this WITH
  # `configureLifecycle({ deadlineMs })`, never instead of it.
  stop_grace_period: 30s

# The image's own HEALTHCHECK fetches `/readyz` on $PORT, and only `web` and `sync` open an HTTP
# socket — `startRoles` (packages/cli/src/dev-roles.ts) gives every role the scrape listener and
# those two a server. So every other service INHERITS a probe for a port it never binds, reports
# `unhealthy` for its whole life, and anything gated on it never starts. Probes follow the role
# here for the same reason `docker/helm/templates/_helpers.tpl` makes them follow it there.
x-metrics-probe: &metrics-probe
  test: ['CMD', 'bun', '--eval', "fetch('http://127.0.0.1:'+(process.env.METRICS_PORT||9090)+'/metrics').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
  interval: 10s
  timeout: 3s
  start_period: 30s
  retries: 3

# Run-once services exit. A probe against an exited container reports `unhealthy` forever, and
# nothing waits on their health anyway — `service_completed_successfully` is what the others gate on.
x-run-once-probe: &run-once-probe
  disable: true

services:
  # Run-once, before anything serves traffic. Refuses to run concurrently with another version.
  migrate:
    <<: *common
    environment: { ROLE: migrate }
    restart: 'no'
    healthcheck: *run-once-probe

  # Run-once, AFTER the new pods serve. Not a gate: a slow UPDATE inside the release step would
  # hold the deploy open against a database still serving the previous version, so backfills are
  # triggered by the deploy and never block it. Dry run is the default, so `--write` is explicit.
  backfill:
    <<: *common
    # The image's ENTRYPOINT is `bun apps/web/server.ts`, and that entry reads ROLE and PORT and
    # NOTHING ELSE — argv never reaches a parser. A bare `command:` is appended to it and silently
    # discarded, so this service served HTTP as ROLE=web under a name that said otherwise: a second
    # web replica, sharing the port-less half of the topology, sweeping nothing. Overriding the
    # entrypoint is what makes the words below a command. The file path, not `node_modules/.bin/x`:
    # it needs no bin symlink and no executable bit inside the image.
    entrypoint: ['bun', 'node_modules/@ultimat3/cli/src/bin.ts']
    command: ['db', 'backfill', '--all', '--write', '--json']
    restart: 'no'
    healthcheck: *run-once-probe
    # The barrier, not the ordering. `docker compose up -d` returns when a container STARTS, so
    # listing this step last would only look like "after". `service_healthy` is what makes it true,
    # and the image's own HEALTHCHECK — `/readyz`, on the port the role binds — is what answers it.
    depends_on:
      migrate: { condition: service_completed_successfully }
      web: { condition: service_healthy }

  # Scales on RPS. Stateless, behind a CDN — and pinned to 1 because it publishes 3000, which a
  # second replica cannot also bind. See the header for the two ways to scale it.
  web:
    <<: *common
    environment: { ROLE: web, PORT: 3000 }
    ports: ['3000:3000']
    depends_on: { migrate: { condition: service_completed_successfully } }
    # No `healthcheck:` here on purpose. The app image declares its own — `/readyz` on $PORT, which
    # this role does serve — and this file used to override it with `['CMD', '/app/x', 'doctor']`.
    # `/app/x` exists ONLY in the framework's distroless CLI image, which the header above says
    # serves no role, so in the app image the probe was a missing file: `web` never reported
    # healthy and `backfill`, which waits on `service_healthy`, never ran at all.
    deploy:
      replicas: 1

  # Scales on concurrent websockets. No sticky sessions, and pinned to 1 for the same reason as web.
  # PORT is the WEB port even here: the sync role binds PORT + 1, so 3000 is a listener on 3001.
  # Naming 3001 would bind 3002 and publish a port nothing in the container ever opened.
  sync:
    <<: *common
    environment: { ROLE: sync, PORT: 3000 }
    depends_on: { migrate: { condition: service_completed_successfully } }
    ports: ['3001:3001']
    # ...which is why the image's own HEALTHCHECK cannot be inherited here. It fetches $PORT —
    # 3000 — and this role never binds it, so the container reports `unhealthy` from
    # `start_period` onward and never recovers, and anything gated on `sync: service_healthy`
    # never starts. Literal 3001 rather than an expression, for the same reason `ports:` above
    # is literal: two ways of saying one number drift.
    # `docker/helm/templates/_helpers.tpl` states the same rule there as `PORT = .port - 1`.
    healthcheck:
      test: ['CMD', 'bun', '--eval', "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    deploy:
      replicas: 1

  # Scales on queue depth.
  worker:
    <<: *common
    environment: { ROLE: worker }
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: *metrics-probe
    deploy:
      replicas: 2

  # Exactly one. Leader election is an expiring lease row in x_scheduler_leader (NOT an advisory
  # lock, which is session-scoped and dies with a pooled connection), so a second instance is
  # harmless but idle.
  scheduler:
    <<: *common
    environment: { ROLE: scheduler }
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: *metrics-probe
    deploy:
      replicas: 1

  # One per database: logical replication into the change feed.
  replicator:
    <<: *common
    environment: { ROLE: replicator }
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: *metrics-probe
    deploy:
      replicas: 1
