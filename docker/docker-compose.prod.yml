# The same image, once per role. This file IS the production topology: scale a role by scaling its
# service, and nothing about the code changes.
#
#   IMAGE=ghcr.io/you/app:1.2.3 docker compose --env-file .env.production -f docker/docker-compose.prod.yml run --rm migrate
#   IMAGE=ghcr.io/you/app:1.2.3 docker compose --env-file .env.production -f docker/docker-compose.prod.yml up -d web sync worker scheduler
#
# Always with `--env-file .env.production`, before `-f`: Compose fills `${SYNC_URL:?…}` and
# `${APP_URL:?…}` (where a page dials the socket, and where the pages are served) below from the
# shell and `--env-file` only, NEVER from `env_file:`, so a value set only in that file reads as
# missing and the parse fails. `x deploy` passes it on every step (packages/cli/src/cmd-deploy.ts).
#
# `IMAGE` must name an APP image and the commands above show it for that reason. The `Dockerfile`
# beside this file builds the framework's CLI (`/app/x` and nothing else) and cannot serve any of
# these roles — `ROLE` is read by `runRole()`, which an app's `apps/web/server.ts` calls. An app
# image is `x build --target docker` over the app's OWN `docker/Dockerfile`, which `x new` writes.
# The `ultimate-app:latest` default below is a placeholder, not a buildable reference here.
#
# In an app, this file is a specimen of the one `x new` scaffolds and `x deploy --method compose`
# runs — `planDeploy` resolves `docker/docker-compose.prod.yml` from the APP root
# (packages/cli/src/cmd-deploy.ts:125), never from the framework.
#
# A published host port has exactly one binder, so the two roles that publish one run at
# `replicas: 1` here. That is the rung, not a defect: Compose is one box (docs/ops/README.md), and
# the horizontal scaling of `web` and `sync` lives in docker/helm with an HPA per role. To scale
# them on one box anyway, delete the `ports:` line and put your own proxy on this network — the
# service name resolves to every replica over the compose DNS round robin.
#
# `cpus:` is the knob `ULTIMATE_PROCESSES=auto` (the default) reads: a container with a CPU budget
# of K whole cores runs K processes of its role on one port (wiki/Deployment.md, "Processes per
# container"); a service with no `cpus:` runs one, whatever the host has. Most of a request's wall
# time is I/O wait, so one process already holds many requests at once and the budgets below are
# modest: raise a role's `cpus` when its process sits above ~70% of one core. Memory is sized at
# 256 MiB per process plus headroom; `jobs.concurrency`, `jobs.maxInFlight` and `DATABASE_POOL_MAX`
# are per CONTAINER and split across its processes, so raising `cpus` multiplies neither.
# `net.ipv4.tcp_migrate_req` is a commented opt-in on web and sync, never active: a kernel older
# than Linux 5.14 has no such knob, and Docker then refuses to create the container at all.

name: ultimate

x-image: &image ${IMAGE:-ultimate-app:latest}

# Every service's logs, rotated. Docker's default `json-file` driver never rotates, so a chatty
# role on a long-lived box filled the disk the database lives on; 3 × 10 MB per container is the
# ceiling, and a real aggregator reads the stream long before the oldest file is dropped.
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }

x-common: &common
  image: *image
  restart: unless-stopped
  env_file: [../.env.production]
  logging: *logging
  # An init as PID 1 (Docker's tini): Bun as PID 1 never reaps an orphaned grandchild, and ignores
  # SIGTERM until a handler is installed, so `docker stop` waited out the grace and SIGKILLed.
  init: true
  # SIGTERM drains in-flight work before the process exits, and it is spent in two halves: the
  # readiness grace (`drain.readinessGraceMs`, packages/core — /readyz at 503 with the listener still
  # open, 5s outside local environments) and then the drain itself, bounded by `drain.deadlineMs`
  # in app.config.ts (25s by default). 5 + 25 = 30s, so 40s leaves 10s before Docker SIGKILLs a
  # process that was about to exit cleanly. Nothing derives it on this rung — the chart derives its
  # `terminationGracePeriodSeconds` from the same budget — so raise this WITH `drain.deadlineMs`,
  # never instead of it.
  stop_grace_period: 40s
  # The hardening the chart's `securityContext` already applies, on the rung that had none: a
  # read-only root filesystem (an exploited role cannot drop a binary or rewrite the app), every
  # Linux capability dropped (a Bun server binding ports above 1024 needs none), and no privilege
  # escalation through a setuid binary. The two writable paths are tmpfs, so nothing written there
  # outlives the container: `/tmp`, and `/app/.x`, where any binding still embedded keeps its state
  # — which is why production names a real DATABASE_URL and object store, and never relies on it.
  # A tmpfs mounts root-owned and hides any chown in the image, so `.x/` names the image's user:
  # 65532, distroless `nonroot`, the `runAsUser` in docker/helm/values.yaml.
  read_only: true
  tmpfs: [/tmp, '/app/.x:uid=65532,gid=65532']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  # A leak or a runaway island build takes one container down, never the box. The chart's largest
  # per-role limit; lower it per service once a role's working set is measured.
  mem_limit: 1g

# The image's own HEALTHCHECK fetches `/readyz` on $PORT, and only `web` and `sync` open an HTTP
# socket — `startRoles` (packages/cli/src/dev-roles.ts) gives every role the scrape listener and
# those two a server. So every other service INHERITS a probe for a port it never binds, reports
# `unhealthy` for its whole life, and anything gated on it never starts. Probes follow the role
# here for the same reason `docker/helm/templates/_helpers.tpl` makes them follow it there.
# `/healthz`, not `/metrics`: the one path on the scrape listener that reads the loops' heartbeats.
x-metrics-probe: &metrics-probe
  test: ['CMD', 'bun', '--eval', "fetch('http://127.0.0.1:'+(process.env.METRICS_PORT||9090)+'/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
  interval: 10s
  timeout: 3s
  start_period: 30s
  retries: 3

# Run-once services exit. A probe against an exited container reports `unhealthy` forever, and
# nothing waits on their health anyway — `service_completed_successfully` is what the others gate on.
x-run-once-probe: &run-once-probe
  disable: true

services:
  # Run-once, before anything serves traffic. Refuses to run concurrently with another version.
  migrate:
    <<: *common
    environment: { ROLE: migrate }
    restart: 'no'
    healthcheck: *run-once-probe

  # Run-once, AFTER the new pods serve. Not a gate: a slow UPDATE inside the release step would
  # hold the deploy open against a database still serving the previous version, so backfills are
  # triggered by the deploy and never block it. Dry run is the default, so `--write` is explicit.
  backfill:
    <<: *common
    # The image's ENTRYPOINT is `bun apps/web/server.ts`, and that entry reads ROLE and PORT and
    # NOTHING ELSE — argv never reaches a parser. A bare `command:` is appended to it and silently
    # discarded, so this service served HTTP as ROLE=web under a name that said otherwise: a second
    # web replica, sharing the port-less half of the topology, sweeping nothing. Overriding the
    # entrypoint is what makes the words below a command. The file path, not `node_modules/.bin/x`:
    # it needs no bin symlink and no executable bit inside the image.
    entrypoint: ['bun', 'node_modules/@ultimat3/cli/src/bin.ts']
    command: ['db', 'backfill', '--all', '--write', '--json']
    restart: 'no'
    healthcheck: *run-once-probe
    # The barrier, not the ordering. `docker compose up -d` returns when a container STARTS, so
    # listing this step last would only look like "after". `service_healthy` is what makes it true,
    # and the image's own HEALTHCHECK — `/readyz`, on the port the role binds — is what answers it.
    depends_on:
      migrate: { condition: service_completed_successfully }
      web: { condition: service_healthy }

  # Scales on RPS. Stateless, behind a CDN — and pinned to 1 because it publishes 3000, which a
  # second replica cannot also bind. See the header for the two ways to scale it.
  web:
    <<: *common
    # A page dials SYNC_URL. Unset, it dials /_x/sync on its own origin — :3000, which `web` does not
    # serve on this rung (`sync` publishes 3001 and no proxy joins them), so it is required here.
    environment: { ROLE: web, PORT: 3000, SYNC_URL: '${SYNC_URL:?set SYNC_URL=ws://<host>:3001/_x/sync, see wiki/Deployment.md}' }
    ports: ['3000:3000']
    depends_on: { migrate: { condition: service_completed_successfully } }
    # Two processes on one port: 2 × 256 MiB per process, plus headroom, fits in x-common's 1g.
    cpus: '2'
    # Opt-in, Linux ≥ 5.14 only: on an older kernel (RHEL 8, Ubuntu 20.04, Amazon Linux 2) the knob
    # does not exist and Docker refuses to create the container. With more than one process here,
    # a stopping process's queued connections move to a sibling instead of being reset (measured:
    # 93–109 of 200 reset without it, 0 with it). `x doctor` warns when it exists, reads 0, N > 1.
    # sysctls: { net.ipv4.tcp_migrate_req: 1 }
    # No `healthcheck:` here on purpose. The app image declares its own — `/readyz` on $PORT, which
    # this role does serve — and this file used to override it with `['CMD', '/app/x', 'doctor']`.
    # `/app/x` exists ONLY in the framework's distroless CLI image, which the header above says
    # serves no role, so in the app image the probe was a missing file: `web` never reported
    # healthy and `backfill`, which waits on `service_healthy`, never ran at all.
    deploy:
      replicas: 1

  # Scales on concurrent websockets. No sticky sessions, and pinned to 1 for the same reason as web.
  # PORT is the WEB port even here: the sync role binds PORT + 1, so 3000 is a listener on 3001.
  # Naming 3001 would bind 3002 and publish a port nothing in the container ever opened.
  sync:
    <<: *common
    # The page is :3000 and this socket :3001 — two origins — and the node admits an upgrade from
    # APP_URL's origin and no other once declared (scheme, host and port, exactly); undeclared, from
    # the origin it was reached on. Unset, every websocket is 403 X_SOCKET_ORIGIN_REFUSED, so it is
    # required: the same value web builds its links from.
    environment: { ROLE: sync, PORT: 3000, APP_URL: '${APP_URL:?set APP_URL=http://<host>:3000 — the origin the pages are served on, see wiki/Deployment.md}' }
    depends_on: { migrate: { condition: service_completed_successfully } }
    ports: ['3001:3001']
    # One process. A second needs NATS_URL (fan-out and presence must cross processes); raise
    # `cpus` with it, and the opt-in below (Linux ≥ 5.14 only, as on web) keeps a stopping
    # process's queued sockets instead of resetting them.
    cpus: '1'
    # sysctls: { net.ipv4.tcp_migrate_req: 1 }
    # ...which is why the image's own HEALTHCHECK cannot be inherited here. It fetches $PORT —
    # 3000 — and this role never binds it, so the container reports `unhealthy` from
    # `start_period` onward and never recovers, and anything gated on `sync: service_healthy`
    # never starts. Literal 3001 rather than an expression, for the same reason `ports:` above
    # is literal: two ways of saying one number drift.
    # `docker/helm/templates/_helpers.tpl` states the same rule there as `PORT = .port - 1`.
    healthcheck:
      test: ['CMD', 'bun', '--eval', "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    # OFF by default (zero replicas). A sync node on this database hears committed changes only
    # from a replicator it can reach, and this file runs none (the replicator below is at zero too): booted anyway it is refused
    # (X_REALTIME_TOPOLOGY). To turn live queries and channels on: declare realtime: { enabled:
    # true, transport: 'nats', urlEnv: 'NATS_URL' } in app.config.ts, add a NATS service and set the
    # SAME NATS_URL for web, sync and a replicator service (ROLE=replicator, exactly one), start
    # Postgres with wal_level=logical and a REPLICATION role on a cluster dedicated to this app (the replicator creates its publication at boot), then set replicas: 1.
    # A NATS_URL under transport 'memory' refuses the boot (X_CONFIG_INVALID), and so does 'nats'
    # without one.
    deploy:
      replicas: 0

  # Scales on queue depth.
  worker:
    <<: *common
    environment: { ROLE: worker }
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: *metrics-probe
    # One process per replica. CPU-heavy queues raise it: a synchronous handler blocks every job in
    # its process and their lease renewals, and each core here is one more process to contain it.
    cpus: '1'
    deploy:
      replicas: 2

  # Exactly one. Leader election is an expiring lease row in x_scheduler_leader (NOT an advisory
  # lock, which is session-scoped and dies with a pooled connection), so a second instance is
  # harmless but idle.
  scheduler:
    <<: *common
    environment: { ROLE: scheduler }
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: *metrics-probe
    # Always one process (a lease row has one holder): a small budget.
    cpus: '0.5'
    deploy:
      replicas: 1

  # One per database: logical replication into the change feed. OFF by default (zero replicas),
  # like sync and the chart's `replicator.enabled: false`: it needs wal_level=logical and a
  # REPLICATION role a stock Postgres lacks, so ON here it crash-loops. Turn it on with sync (the
  # steps above): set replicas: 1, never more.
  replicator:
    <<: *common
    environment: { ROLE: replicator }
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: *metrics-probe
    # Always one process (a replication slot has one reader): a small budget.
    cpus: '0.5'
    deploy:
      replicas: 0
