# The backing services the test suites measure against — in RAM, and silent.
#
#   docker compose -f docker/docker-compose.test.yml up -d --wait
#   set -a; . docker/test-services.env; set +a
#   bun run verify
#
# `--wait` returns when every healthcheck passes, so there is no readiness loop to write. Name the
# services to start fewer: `up -d --wait postgres` is all the `unit` step reads. CI runs these same
# two lines (.github/workflows/ci.yml), so a suite cannot be green there against a server a laptop
# cannot start. Nothing here is required: with no `TEST_*_URL` set, every live suite skips.
#
# Three rules, on every service:
#
#   * RAM. The data directory is a tmpfs, so a run writes no block device and `down` leaves nothing
#     behind — no volume to prune, and no state one run can leave for the next.
#   * NO DURABILITY. A test database that survives a crash is a database nobody asked for:
#     `fsync`, `synchronous_commit` and `full_page_writes` are off on every Postgres server, and
#     Redis keeps no RDB snapshot and no AOF.
#   * SILENT. Each server is told to log nothing it can be told not to, and the container's log
#     driver is `none`, so `docker logs` has nothing to read and the daemon keeps no JSON file. To
#     watch a server that will not start, run it attached: `docker compose -f
#     docker/docker-compose.test.yml up postgres`.
#
# Every published port binds loopback (127.0.0.1; `postgres-tls` adds 127.0.0.2) — the credentials
# are in this file.

name: ultimate-test

x-silent: &silent
  logging: { driver: none }

# What both Postgres servers are initialised with. `initdb -c` (Postgres 16+) writes each setting
# into the new cluster's postgresql.conf, so the server needs no command of its own. `--no-sync`
# is initdb's own fsync of a cluster that lives on a tmpfs; the next three are the durability
# Postgres pays for on every commit; the next five are everything the server would write to
# stderr — an ERROR is below FATAL, so a failing statement is not logged either. Then throughput,
# measured 2026-11-07 (docs/history/test-services.md): JIT compiles plans a millisecond query
# never earns back; autovacuum is a worker per churned database, and an autoanalyze racing a
# suite's own `analyze` changes the plan under its assertion; the stock 100 connections ran out
# under 12 parallel test processes; and the WAL is a tmpfs, so every segment kept is RAM — every
# `DROP DATABASE` checkpoints, so the floor is what the server holds between runs.
x-postgres-initdb: &postgres-initdb >-
  --no-sync
  -c fsync=off
  -c synchronous_commit=off
  -c full_page_writes=off
  -c log_min_messages=fatal
  -c log_statement=none
  -c log_checkpoints=off
  -c log_connections=off
  -c log_disconnections=off
  -c jit=off
  -c autovacuum=off
  -c max_connections=400
  -c min_wal_size=32MB
  -c max_wal_size=256MB

x-postgres: &postgres
  <<: *silent
  environment:
    POSTGRES_USER: ultimate
    POSTGRES_PASSWORD: ultimate
    POSTGRES_DB: postgres
    POSTGRES_INITDB_ARGS: *postgres-initdb
  tmpfs: [/var/lib/postgresql/data]
  healthcheck:
    # `-h 127.0.0.1`, never the unix socket: the entrypoint boots a TEMPORARY server to run initdb,
    # and that one listens on the socket only. A socket probe answers "accepting connections" for a
    # server that is about to be replaced; TCP is up only once the real one is.
    test: ['CMD-SHELL', 'pg_isready -U ultimate -h 127.0.0.1 -p 5432']
    interval: 1s
    timeout: 3s
    retries: 60

# Each image is its tag — the series, for the reader — pinned to that series' multi-arch index
# digest, which is what runs: a tag is a pointer its publisher can move. Held by
# scripts/test-services-shape.test.ts; Dependabot's docker-compose ecosystem moves tag and digest.
services:
  # pgvector, not stock postgres: `@ultimat3/ai`'s postgresVectorStore() is the only production vector
  # path, and `pg-vector.live.test.ts` refuses to skip when the extension is missing.
  #
  # The one hba line the stock entrypoint never writes — `host all all all` does not match the
  # `replication` pseudo-database — so `postgres-standby` could not take its base backup. Appended
  # by an init script the wrapper drops in before handing over, so it lands in the cluster initdb
  # just wrote and the real server reads it on its first start: `samenet`, the compose network only.
  postgres:
    <<: *postgres
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    entrypoint:
      - sh
      - -c
      - >-
        echo 'echo "host replication all samenet scram-sha-256" >> "$$PGDATA/pg_hba.conf"'
        > /docker-entrypoint-initdb.d/replication.sh && exec docker-entrypoint.sh "$$@"
      - postgres
    command: ['postgres']
    ports: ['127.0.0.1:5432:5432']

  # A PHYSICAL standby of `postgres`, streaming, for the suites that pause its replay
  # (`pg_wal_replay_pause()`) and read behind the primary: `replica-position.live.test.ts`, the
  # CLI's write-redirect-read round trip. `pg_basebackup -R` clones the primary and writes the
  # standby signal and `primary_conninfo`, so the copied postgresql.conf — no fsync, nothing logged
  # below FATAL — is the primary's own. No replication slot: a slot pins WAL on a tmpfs for a
  # standby that may be gone. The cluster is a subdirectory, which `pg_basebackup` creates 0700.
  postgres-standby:
    <<: *silent
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    depends_on:
      postgres:
        condition: service_healthy
    user: postgres
    environment:
      PGPASSWORD: ultimate
      PGDATA: /var/lib/postgresql/data/standby
    entrypoint:
      - sh
      - -euc
      - |
        pg_basebackup -h postgres -U ultimate -D "$$PGDATA" -X stream -R --no-sync
        exec postgres -D "$$PGDATA"
    tmpfs: [/var/lib/postgresql/data]
    ports: ['127.0.0.1:5434:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ultimate -h 127.0.0.1 -p 5432']
      interval: 1s
      timeout: 3s
      retries: 60

  # The ONE logical server: `wal_level` is a server argument, so the replication feed's live tests
  # — which decode a real WAL stream — need a server apart from `postgres`, whose template-database
  # clones must not share a cluster with a slot that pins a database open. Every suite that opens
  # a slot here names its own slot, publication and tables, and the live step runs them serially.
  #
  # Two URLs, one process (2026-11-07; it was two servers): TEST_REPLICATION_URL is cleartext
  # (`sslmode=disable` — `host all all all` admits it), and TEST_TLS_REPLICATION_URL is the
  # replicator's wire client over REAL TLS (`packages/realtime/src/pg-tls.live.test.ts`, #519):
  # `sslmode=verify-full` against a private CA — the shape of every CNPG cluster — and the
  # CopyBoth stream read through the upgraded socket.
  #
  # The ONE exception to "mounts no volume", and only for the certificate: the suite on the host
  # has to read the CA the server's certificate chains to. `postgres-tls-certs` writes it, and the
  # server's own pair, into docker/.tls/ (gitignored); the data directory is still a tmpfs. The
  # key is copied to /tmp because Postgres refuses one that is not 0600 and owned by it, and a
  # read-only bind can be neither.
  postgres-tls:
    <<: *postgres
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    depends_on:
      postgres-tls-certs:
        condition: service_completed_successfully
    volumes: ['./.tls:/tls:ro']
    entrypoint:
      - sh
      - -c
      - install -o postgres -g postgres -m 600 /tls/server.crt /tls/server.key /tmp/ && exec docker-entrypoint.sh "$$@"
      - postgres-tls
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tmp/server.crt
      - -c
      - ssl_key_file=/tmp/server.key
    # 127.0.0.2 as well, still loopback: the suite's verify-full case dials a host the certificate
    # does not name, and on Linux every 127/8 address is this machine — but only a bound one answers.
    ports: ['127.0.0.1:5440:5432', '127.0.0.2:5440:5432']

  # One shot, then exits 0 — `postgres-tls` starts only after it has. A CA and a server certificate
  # for `localhost` and 127.0.0.1, the recipe in pg-tls.live.test.ts's header: two RSA keys, about
  # a second, and an image of ~6 MB. The CA's KEY never leaves this container's tmpfs, so what
  # lands on the host is two certificates and a test server's key. Kept while they still verify,
  # because a second `up` must not re-key a server that is already running on the first pair;
  # `rm -rf docker/.tls` starts over. Owned by whoever owns docker/, so a laptop can delete them.
  postgres-tls-certs:
    <<: *silent
    image: alpine/openssl:3.5.9@sha256:59c5cb51e536d40587667229468b007a2a6cae1705397e59e5f7774c08b74029
    volumes: ['.:/docker:ro', './.tls:/docker/.tls']
    tmpfs: [/work]
    working_dir: /work
    entrypoint:
      - sh
      - -euc
      - |
        out=/docker/.tls
        if [ -s "$$out/server.key" ] \
          && openssl verify -CAfile "$$out/ca.crt" "$$out/server.crt" >/dev/null 2>&1 \
          && [ "$$(openssl x509 -noout -pubkey -in "$$out/server.crt")" = "$$(openssl pkey -pubout -in "$$out/server.key")" ]; then
          exit 0
        fi
        openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 3650 \
          -subj /CN=ultimate-test-ca 2>/dev/null
        openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj /CN=localhost \
          2>/dev/null
        printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > san.ext
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
          -out server.crt -days 3650 -extfile san.ext 2>/dev/null
        install -m 644 ca.crt server.crt "$$out/"
        install -m 600 server.key "$$out/"
        chown -R "$$(stat -c %u:%g /docker)" "$$out"
    # `up --wait` reads no health from a container that has exited; this is what one that is still
    # running reports, and it is true exactly when the server can start.
    healthcheck:
      test: ['CMD', 'test', '-s', '/docker/.tls/server.key']
      interval: 1s
      timeout: 3s
      retries: 30

  # A connection pooler in its STOCK transaction mode, between the suites and `postgres`, because the
  # failure it stands for is its stock config: `ignore_startup_parameters` does not name
  # `statement_timeout`, so a bare `DATABASE_URL` is refused at startup with `08P01`. Adding the
  # parameter there would hide what `pooler.live.test.ts` proves. `auth_query` over the server's
  # own `pg_shadow`, so a role a suite creates logs in with no line in a userlist. The tmpfs holds
  # the config the image's entrypoint writes on start, and the one thing this service keeps.
  pooler:
    <<: *silent
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: ultimate
      DB_PASSWORD: ultimate
      AUTH_TYPE: scram-sha-256
      AUTH_USER: ultimate
      AUTH_QUERY: select usename, passwd from pg_shadow where usename = $$1
      POOL_MODE: transaction
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      LOG_POOLER_ERRORS: 0
      LOG_STATS: 0
    tmpfs: ['/etc/pgbouncer:uid=70,gid=70']
    ports: ['127.0.0.1:6432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ultimate -h 127.0.0.1 -p 5432']
      interval: 1s
      timeout: 3s
      retries: 60

  # The shared cache tier's two Lua scripts are the only thing a real Redis answers differently
  # from a fake. No snapshot, no append-only file, and a log level that prints nothing.
  redis:
    <<: *silent
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--loglevel', 'nothing']
    tmpfs: [/data]
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 30

  # JetStream is what presence is built on — the KV bucket, its per-message TTL and its batch
  # direct reads. 2.11 is the floor (docker-compose.dev.yml says why). The stream store is the
  # tmpfs; `-l /dev/null` is the only quiet a nats-server has.
  nats:
    <<: *silent
    image: nats:2.15-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    command: ['-js', '-sd', '/data', '-m', '8222', '-l', '/dev/null']
    tmpfs: [/data]
    ports: ['127.0.0.1:4222:4222']
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8222/healthz']
      interval: 1s
      timeout: 3s
      retries: 30

  # The S3 endpoint `packages/storage/src/driver-s3.live.test.ts` drives. Versity S3 Gateway over a
  # POSIX directory: every directory under /data is a bucket, so mounting the tmpfs AT the bucket's
  # path is the whole bootstrap — no CreateBucket call, no init container, no admin client. Why
  # this server and not the four it was measured against: docs/history/test-services.md.
  s3:
    <<: *silent
    image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      VGW_PORT: ':9000'
      VGW_QUIET: 'true'
      # What `Bun.S3Client` signs for when no region is set. The gateway checks the scope, so
      # its default (us-east-1) would refuse every request from a disk that names no region.
      VGW_REGION: auto
      ROOT_ACCESS_KEY: ultimate
      ROOT_SECRET_KEY: ultimate-test
    tmpfs: [/data/ultimate-test]
    ports: ['127.0.0.1:9000:9000']
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '9000']
      interval: 1s
      timeout: 3s
      retries: 30
