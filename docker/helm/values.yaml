# One image for every role; `role` is the only difference between the workloads below.
image:
  repository: ghcr.io/developerz-ai/ultimate-app
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Non-secret configuration. Secrets come from an existing Secret, never from this file.
env:
  NODE_ENV: production
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

existingSecret: ultimate-secrets   # DATABASE_URL, NATS_URL, S3_*, AUTH_SECRET, SENTRY_DSN

# The scrape listener every serving role opens, on its own port and never the app's: the ingress
# below routes `/` to web, so `/metrics` beside `/healthz` on 3000 is `/metrics` on the internet.
# This is `METRICS_PORT` in the container; move one and the other follows.
metricsPort: 9090

# Prometheus-operator discovery for that port. OFF by default: a cluster without the operator has
# no ServiceMonitor CRD at all, and a chart that always rendered one could not install there.
# Leave it off and the roles still serve /metrics — nothing is scraping them.
serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  labels: {}         # what your operator's `serviceMonitorSelector` matches, if it uses one

# Read by `ultimate.serviceAccountName` (_helpers.tpl), which BOTH workloads and the optional
# ServiceAccount resource go through. `helm create`'s semantics:
#
#   create: true,  name: ""          the chart creates `<release>-ultimate` and the pods use it
#   create: true,  name: my-sa       the chart creates `my-sa` and the pods use it
#   create: false, name: app-irsa    the chart creates nothing; the pods use your `app-irsa`
#   create: false, name: ""          the chart creates nothing; the pods use the namespace `default`
#
# `create: false` with a name you annotate for IRSA / Workload Identity is why these exist, and
# until 2026-08 nothing read either key: the ServiceAccount was emitted unconditionally and both
# workloads hardcoded the chart's own name, so an operator who set them got the chart's account
# anyway and the pods had no cloud identity.
#
# `automountServiceAccountToken: false` on the pods stays either way. It suppresses the DEFAULT
# kube-apiserver credential, which no role in this image uses; a cloud identity webhook projects
# its own token volume and is unaffected.
serviceAccount:
  create: true
  name: ""

# Read by `ultimate.name` (_helpers.tpl) and declared here since 2026-08 — it was the mirror of the
# `serviceAccount` defect: a knob the templates read that this file never mentioned, so the only way
# to discover it was to open the chart.
nameOverride: ""

# A voluntary-eviction budget per role that has more than one pod (pdb.yaml). On by default: a node
# drain takes every pod of a role at once without it, and the chart's `maxUnavailable: 0` rolling
# update only covers a deploy.
podDisruptionBudget:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

# Pre-deploy hook. Runs to completion before any serving role starts.
migrate:
  enabled: true
  backoffLimit: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

# Each role scales on the signal that actually predicts its saturation.
#
# `port` is the port the role LISTENS on, not the value of `PORT`. They differ for `sync`, which
# binds `PORT + 1`; the chart derives the env from this number so there is only ever one to move.
roles:
  web:
    enabled: true
    replicas: 3
    port: 3000
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { memory: 512Mi }
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 30
      metric: rps               # requests per second, via the ingress metric adapter
      targetAverageValue: "50"

  sync:
    enabled: true
    replicas: 2
    port: 3001
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 40
      metric: connections       # concurrent websockets per pod
      targetAverageValue: "2000"

  worker:
    enabled: true
    replicas: 2
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { memory: 1Gi }
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 50
      metric: queue_depth       # jobs waiting, exported by the worker role
      targetAverageValue: "100"

  scheduler:
    enabled: true
    # Fixed 1. Leader election is an expiring row in x_scheduler_leader, NOT an advisory lock: that
    # grant is session-scoped and the executor is a pool, so it dies when the connection returns and
    # every replica reads itself as leader. A second replica here is safe but pointless — it stands by.
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }

  replicator:
    enabled: false              # one per database, enable when the change feed is in use
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }

ingress:
  enabled: false
  className: nginx
  host: app.example.com
  tls: true
