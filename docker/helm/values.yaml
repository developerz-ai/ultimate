# One image for every role; `role` is the only difference between the workloads below.
#
# `repository` is a PLACEHOLDER: the framework publishes no app image, so set the registry path your
# CI pushes YOUR app to — `x deploy --method helm --image <repository>:<tag>` sets both keys with
# `--set-string`. An empty repository is a render error naming this key, never a pod pulling `:<tag>`.
image:
  repository: registry.example.com/your-app
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Non-secret configuration. Secrets come from an existing Secret, never from this file.
#
# APP_URL — the pages' public origin — is what the sync node admits a websocket from. With the
# ingress below enabled the chart SETS it on the sync role from ingress.host (https when
# ingress.tls), because an undeclared node behind a TLS ingress also admits the plain-http page.
# Set it here when the pages are served from another host or port than that (a CDN domain, a
# SYNC_URL of its own): this value wins, and without it every websocket from those pages is
# 403 X_SOCKET_ORIGIN_REFUSED.
env:
  NODE_ENV: production
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

existingSecret: ultimate-secrets   # DATABASE_URL, NATS_URL, S3_*, AUTH_SECRET, SENTRY_DSN, ULTIMATE_CURSOR_SECRET

# The release-wide Secret above is every role's DEFAULT, not its only option: `existingSecret` under
# a role (roles.web.existingSecret, migrate.existingSecret) names that role's own. Split them so a
# role holds only what it reads — the migrate Job's DDL-owning DATABASE_URL never on a web pod, the
# signing secrets never on a worker:
#
#   migrate:  { existingSecret: app-migrate-secrets }   # the schema owner's DATABASE_URL
#   roles:
#     web:    { existingSecret: app-web-secrets }       # AUTH_SECRET, ULTIMATE_CURSOR_SECRET, …
#     worker: { existingSecret: app-worker-secrets }

# The /tmp every pod mounts (the root filesystem is read-only), bounded: past this the kubelet
# evicts the pod that filled it, never its neighbours for node disk pressure. It holds the
# embedded-state directory when ULTIMATE_STATE_DIR points there (docs/ops/01-kubernetes.md).
tmp:
  sizeLimit: 512Mi

# One NetworkPolicy per serving role (networkpolicy.yaml): a pod accepts its `http` port from
# `httpFrom` and its `metrics` port from `metricsFrom`, and nothing else on any port. Kubelet probes
# are node traffic, which a NetworkPolicy never blocks. Inert on a CNI that does not enforce
# NetworkPolicy; nothing to install either way.
#
#   httpFrom     who reaches web and sync. Empty = any source, because the ingress controller lives
#                in a namespace this chart cannot know; narrow it to that namespace, e.g.
#                [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
#   metricsFrom  who scrapes /metrics. Default: any pod in the cluster and no address outside it.
#   egress       OFF while empty. A list turns on egress filtering with exactly those rules — the
#                database, NATS, the object store and DNS are your addresses, not the chart's, so
#                write all of them: a list that omits DNS resolves nothing.
networkPolicy:
  enabled: true
  httpFrom: []
  metricsFrom:
    - namespaceSelector: {}
  egress: []

# The scrape listener every serving role opens, on its own port and never the app's: the ingress
# below routes `/` to web, so `/metrics` beside `/healthz` on 3000 is `/metrics` on the internet.
# This is `METRICS_PORT` in the container; move one and the other follows.
metricsPort: 9090

# Prometheus-operator discovery for that port. OFF by default: a cluster without the operator has
# no ServiceMonitor CRD at all, and a chart that always rendered one could not install there.
# Leave it off and the roles still serve /metrics — nothing is scraping them.
serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  labels: {}         # what your operator's `serviceMonitorSelector` matches, if it uses one

# Read by `ultimate.serviceAccountName` (_helpers.tpl), which BOTH workloads and the optional
# ServiceAccount resource go through. `helm create`'s semantics:
#
#   create: true,  name: ""          the chart creates `<release>-ultimate` and the pods use it
#   create: true,  name: my-sa       the chart creates `my-sa` and the pods use it
#   create: false, name: app-irsa    the chart creates nothing; the pods use your `app-irsa`
#   create: false, name: ""          the chart creates nothing; the pods use the namespace `default`
#
# `create: false` with a name you annotate for IRSA / Workload Identity is why these exist, and
# until 2026-08 nothing read either key: the ServiceAccount was emitted unconditionally and both
# workloads hardcoded the chart's own name, so an operator who set them got the chart's account
# anyway and the pods had no cloud identity.
#
# `automountServiceAccountToken: false` on the pods stays either way. It suppresses the DEFAULT
# kube-apiserver credential, which no role in this image uses; a cloud identity webhook projects
# its own token volume and is unaffected.
serviceAccount:
  create: true
  name: ""

# Read by `ultimate.name` (_helpers.tpl) and declared here since 2026-08 — it was the mirror of the
# `serviceAccount` defect: a knob the templates read that this file never mentioned, so the only way
# to discover it was to open the chart.
nameOverride: ""

# A voluntary-eviction budget per role that has more than one pod (pdb.yaml). On by default: a node
# drain takes every pod of a role at once without it, and the chart's `maxUnavailable: 0` rolling
# update only covers a deploy.
podDisruptionBudget:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

# The stop sequence. The kubelet removes the pod from its Service, then runs the `preStop` sleep,
# then sends SIGTERM; the framework then answers 503 on /readyz for its own readiness grace before
# closing the listener and draining. The sleep renders only on Kubernetes 1.30+, where
# `lifecycle.preStop.sleep` exists (_helpers.tpl).
#
# Each Deployment's terminationGracePeriodSeconds is DERIVED from this block, per role
# (`ultimate.terminationGracePeriodSeconds`): preStop + readiness grace for the roles something
# routes to (web, sync), then deadline + teardown margin for every role. Never set it by hand.
#
#   readinessGraceSeconds  app.config.ts `drain.readinessGraceMs` / 1000 (core's default: 5)
#   deadlineSeconds        app.config.ts `drain.deadlineMs` / 1000 (core's default: 25) — the time
#                          a running job has to finish on a deploy. `x deploy --method helm` sets
#                          both from app.config.ts, so the chart cannot fall behind a raised budget
#   teardownMarginSeconds  what runs after the deadline: the release floor (5s, cli's
#                          MIN_RELEASE_MS), the OTel flush and the pool close, plus headroom
drain:
  preStopSleepSeconds: 5
  readinessGraceSeconds: 5
  deadlineSeconds: 25
  teardownMarginSeconds: 10

# How long a new pod must stay Ready before a rollout counts it and stops an old one, on every
# Deployment. Catches a role that passes its first probe and crashes seconds later.
minReadySeconds: 10

# Pre-deploy hook. Runs to completion before any serving role starts.
migrate:
  enabled: true
  backoffLimit: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

# Each role scales on the signal that actually predicts its saturation.
#
# `autoscaling.type` is `Pods` (the default, a per-pod series averaged across pods) or `External`
# (one series for the whole Deployment, divided by the replica count). hpa.yaml refuses anything
# else at render time.
#
# `port` is the port the role LISTENS on, not the value of `PORT`. They differ for `sync`, which
# binds `PORT + 1`; the chart derives the env from this number so there is only ever one to move.
roles:
  web:
    enabled: true
    replicas: 3
    port: 3000
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { memory: 512Mi }
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 30
      metric: rps               # requests per second, via the ingress metric adapter
      targetAverageValue: "50"

  sync:
    # OFF by default. A sync pod on a real database hears committed changes only from a replicator
    # it can reach, and a fresh deploy has none: booted anyway it is refused (X_REALTIME_TOPOLOGY).
    # To turn live queries and channels on: declare realtime: { enabled: true, transport: 'nats',
    # urlEnv: 'NATS_URL' } in app.config.ts (a NATS_URL under transport 'memory' is refused, and
    # 'nats' without it is too); run NATS and set the SAME NATS_URL for web, sync and the
    # replicator; enable exactly one replicator (below) against a Postgres started with
    # wal_level=logical (the replicator creates its publication at boot) and a role with REPLICATION on a cluster dedicated to this app; then set this to true.
    enabled: false
    replicas: 2
    port: 3001
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 40
      metric: connections       # concurrent websockets per pod
      targetAverageValue: "2000"

  worker:
    enabled: true
    replicas: 2
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { memory: 1Gi }
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 50
      # External, never Pods. `queue_depth` is the QUEUE's fact: every worker pod publishes the
      # same global number (packages/jobs/src/worker.ts), so a Pods metric averaged it as if each
      # pod held that backlog alone and asked for N× the workers the queue needed, every sync.
      # An External metric with an AverageValue target divides the one global value by the
      # replica count, which is the question an autoscaler is asking. Your metrics adapter must
      # expose it DEDUPLICATED — `max(queue_depth)` (or `max by (queue)` with a selector), never
      # `sum`, which would re-multiply it by the pod count.
      type: External
      metric: queue_depth       # jobs waiting, exported by the worker role
      targetAverageValue: "100"

  scheduler:
    enabled: true
    # Fixed 1. Leader election is an expiring row in x_scheduler_leader, NOT an advisory lock: that
    # grant is session-scoped and the executor is a pool, so it dies when the connection returns and
    # every replica reads itself as leader. A second replica here is safe but pointless — it stands by.
    replicas: 1
    # 512Mi, not 256Mi: a scaffolded app measured ~325 MiB at boot as ROLE=scheduler on the kind
    # deploy proof (docker/deploy-proof/run.sh, 2026-09-23), when every role still built the app's
    # islands first; at 256Mi the pod was OOMKilled on every boot. Only web builds islands now
    # (packages/cli/src/serve-boot.ts), so the peak is lower — unmeasured, so the limit stays.
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

  replicator:
    enabled: false              # one per database, enable when the change feed is in use
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }

ingress:
  enabled: false
  className: nginx
  host: app.example.com
  tls: true
