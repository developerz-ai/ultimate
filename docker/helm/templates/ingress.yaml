{{/* Standard ingress. No vendor edge primitives: the CDN gets headers and a purge webhook. */}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ultimate.fullname" . }}
  labels:
    {{- include "ultimate.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ include "ultimate.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- /*
          The path the sync node actually serves — `/_x/sync`, the one `createSyncNode` matches on
          and 404s off. `/_sync` routed a path no client ever requests, so every websocket fell
          through to the `/` rule below and reached `web`, which answers no upgrade.
          */}}
          - path: /_x/sync
            pathType: Prefix
            backend:
              service:
                name: {{ include "ultimate.fullname" . }}-sync
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ultimate.fullname" . }}-web
                port: { name: http }
{{- end }}
