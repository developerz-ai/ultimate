{{/*
One Deployment per enabled role, from one image. terminationGracePeriodSeconds covers the preStop
sleep, the framework's readiness grace and its SIGTERM drain — in-flight requests, open websockets
and running job steps finish — derived per role from `drain` in values.yaml
(`ultimate.terminationGracePeriodSeconds`, _helpers.tpl).
*/}}
{{- range $role, $cfg := .Values.roles }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ultimate.fullname" $ }}-{{ $role }}
  labels:
    {{- include "ultimate.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  {{/*
  `scheduler` and `replicator` declare no `autoscaling` block at all — they are pinned to one
  replica by design — so this must ask whether the block exists before reading through it, exactly
  as hpa.yaml already does. Without the guard the whole chart fails to render, which is why
  `helm lint` never passed.
  */}}
  {{- if not (and $cfg.autoscaling $cfg.autoscaling.enabled) }}
  replicas: {{ $cfg.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $role }}
  {{/*
  The replicator is Recreate, never a rolling update: one pod per database holds the replication
  slot's advisory lock, so a surged pod can only stand by, unready, and maxUnavailable: 0 never
  terminates the holder it is waiting on — every rollout stalled. Recreate lets the holder go first.
  */}}
  {{/*
  A new pod must stay Ready this long before the rollout counts it available and terminates an old
  one. Readiness alone flips green the moment `/readyz` first answers; a role that crashes a few
  seconds later (a job handler failing at import, a pool that cannot hold its connection) would
  otherwise have already replaced the pod that was working.
  */}}
  minReadySeconds: {{ $.Values.minReadySeconds | int }}
  strategy:
    {{- if eq $role "replicator" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "ultimate.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
    spec:
      serviceAccountName: {{ include "ultimate.serviceAccountName" $ }}
      # No role in this image ever calls the Kubernetes API — `ROLE` is read from the env and
      # everything else comes from app.config.ts. Mounting the token anyway hands a JWT for this
      # namespace's ServiceAccount to any code that reaches the filesystem, which for a web role is
      # the blast radius of one path traversal.
      automountServiceAccountToken: false
      securityContext: {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      # The kubelet's whole budget from the moment it decides to stop the pod, per role — see
      # `ultimate.terminationGracePeriodSeconds` in _helpers.tpl for the sum. The container job in
      # .github/workflows/ci.yml renders this and refuses a value below the default sum.
      terminationGracePeriodSeconds: {{ include "ultimate.terminationGracePeriodSeconds" (dict "role" $role "cfg" $cfg "root" $) }}
      containers:
        {{- include "ultimate.container" (dict "role" $role "cfg" $cfg "root" $) | nindent 8 }}
      volumes:
        {{- include "ultimate.tmpVolume" $ | nindent 8 }}
{{- end }}
{{- end }}
