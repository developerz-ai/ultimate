{{/*
One Deployment per enabled role, from one image. terminationGracePeriodSeconds covers the preStop
sleep, the framework's readiness grace and its SIGTERM drain: in-flight requests, open websockets
and running job steps finish.
*/}}
{{- range $role, $cfg := .Values.roles }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ultimate.fullname" $ }}-{{ $role }}
  labels:
    {{- include "ultimate.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  {{/*
  `scheduler` and `replicator` declare no `autoscaling` block at all — they are pinned to one
  replica by design — so this must ask whether the block exists before reading through it, exactly
  as hpa.yaml already does. Without the guard the whole chart fails to render, which is why
  `helm lint` never passed.
  */}}
  {{- if not (and $cfg.autoscaling $cfg.autoscaling.enabled) }}
  replicas: {{ $cfg.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $role }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "ultimate.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
    spec:
      serviceAccountName: {{ include "ultimate.serviceAccountName" $ }}
      # No role in this image ever calls the Kubernetes API — `ROLE` is read from the env and
      # everything else comes from app.config.ts. Mounting the token anyway hands a JWT for this
      # namespace's ServiceAccount to any code that reaches the filesystem, which for a web role is
      # the blast radius of one path traversal.
      automountServiceAccountToken: false
      securityContext: {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      # The kubelet's whole budget from the moment it decides to stop the pod, and three things
      # spend it in order: the `preStop` sleep (`drain.preStopSleepSeconds`, 1.30+ only), then the
      # framework's readiness grace — `/readyz` answering 503 with the listener still open,
      # `drain.readinessGraceMs` in packages/core, 5s by default outside local environments — then
      # the drain itself, bounded by `drainDeadlineMs()` (packages/core/src/lifecycle.ts, 25s by
      # default). 5 + 5 + 25 = 35s on 1.30+, and 0 + 5 + 25 = 30s below it where no preStop renders, so
      # 45 leaves at least 10s of headroom before SIGKILL on every version this chart supports.
      #
      # Raise this WITH `configureLifecycle({ deadlineMs })` or a larger readiness grace, never
      # instead of them: the drain abandons its hooks at its own deadline, so a larger grace period
      # alone buys nothing. The container job in .github/workflows/ci.yml renders this and refuses
      # a value below the sum.
      terminationGracePeriodSeconds: 45
      containers:
        {{- include "ultimate.container" (dict "role" $role "cfg" $cfg "root" $) | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
