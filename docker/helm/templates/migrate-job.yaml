{{/*
Pre-install / pre-upgrade hook: ROLE=migrate runs to completion before any serving role starts,
and refuses to run concurrently with a different version.
*/}}
{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ultimate.fullname" . }}-migrate
  labels:
    {{- include "ultimate.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "ultimate.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "ultimate.fullname" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        {{- include "ultimate.container" (dict "role" "migrate" "cfg" .Values.migrate "root" .) | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
