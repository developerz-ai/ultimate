{{/*
ROLE=migrate runs to completion before any serving role starts, and refuses to run concurrently
with a different version. ONE Job, ordered by whichever applier renders it:

  helm (and Flux's helm-controller)  a pre-install / pre-upgrade / pre-rollback hook: no role is
                                     touched until it has succeeded. On a rollback it is the OLDER
                                     build's migrate, which refuses a ledger a newer build left
                                     destructive rows in (X_MIGRATION_ROLLBACK_DESTRUCTIVE) before
                                     any role is rolled back onto it
  Argo CD                            a Sync hook in wave -1. Its own annotation wins over the Helm
                                     one Argo would otherwise map to PreSync — the phase that runs
                                     before EVERY wave, so a database the same sync creates was
                                     waited on forever. Put that database and the Secret the Job
                                     reads in wave -2 or lower; every role sits in wave 0
  an applier that ignores both       an ordinary object, applied beside the roles. Its name is its
  (kubectl apply, a rendered tree)   spec's hash, so a new image is a new Job rather than an
                                     immutable-field refusal of the whole apply; the roles wait for
                                     the stamp it leaves, unready, and `maxUnavailable: 0` keeps
                                     the old pods serving meanwhile

No init container on any role: a per-pod migrate is the second mechanism, run once per pod, and it
only ever ordered the Deployment that carried it (docs/ops/01-kubernetes.md#migrations).
Deleted once it succeeds (`hook-succeeded`, which Argo CD honours too); a failed one stays for
`kubectl logs` until the next attempt replaces it.
*/}}
{{- if .Values.migrate.enabled }}
{{/*
The Job's own ServiceAccount, and it has to be a hook. A `pre-install` hook runs BEFORE Helm
creates any of the chart's ordinary resources, so a Job naming the chart's ServiceAccount
(service.yaml) was refused by admission — `serviceaccount "…" not found` — and a first
`helm install` waited on a Job that could never make a pod until its timeout. Upgrades worked,
because the account already existed from the install that never finished, which is how it hid.

A SEPARATE account rather than turning service.yaml's into a hook: Helm deletes on upgrade every
resource that was in the previous release's manifest and is not in the new one, and hooks are not
in the manifest — so moving the serving roles' account into a hook would delete it at the end of
the first upgrade, and the next pod any Deployment scheduled would be refused for want of it.
Deleted again once the hooks succeed, so it outlives nothing it was made for.

With `serviceAccount.create: false` the operator's account already exists before the chart runs,
so the Job uses it (IRSA / Workload Identity reaches the migration too) and nothing is created.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ultimate.fullname" . }}-migrate
  labels:
    {{- include "ultimate.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
{{- end }}
{{- $pod := include "ultimate.migratePod" . }}
apiVersion: batch/v1
kind: Job
metadata:
  {{- /* 46 + "-migrate-" + 8 = 63, the ceiling of the `job-name` label every pod of it carries. */}}
  name: {{ printf "%s-migrate-%s" (include "ultimate.fullname" . | trunc 46 | trimSuffix "-") ($pod | sha256sum | trunc 8) }}
  labels:
    {{- include "ultimate.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    {{- $pod | nindent 4 }}
{{- end }}

{{- define "ultimate.migratePod" -}}
metadata:
  labels:
    {{- include "ultimate.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  restartPolicy: Never
  serviceAccountName: {{ if .Values.serviceAccount.create }}{{ include "ultimate.fullname" . }}-migrate{{ else }}{{ include "ultimate.serviceAccountName" . }}{{ end }}
  # Same reason as the Deployments: ROLE=migrate applies SQL and exits, and calls no API server.
  automountServiceAccountToken: false
  securityContext: {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    {{- include "ultimate.container" (dict "role" "migrate" "cfg" .Values.migrate "root" .) | nindent 4 }}
  volumes:
    {{- include "ultimate.tmpVolume" . | nindent 4 }}
{{- end -}}
