apiVersion: v2
name: ultimate
description: One image, N roles. Per-role deployments and autoscalers for an Ultimate app.
type: application
# Both track the framework's lockstep version. `appVersion` is the default image TAG
# (values.yaml `image.tag: ""`) of the repository the operator sets in `image.repository` — the
# framework publishes no app image, so the shipped repository is a placeholder and an install
# names its own registry path (`x deploy --method helm --image` sets both keys).
#
# `scripts/release.ts` rewrites both on every release through `setChartVersions` — a chart is not a
# workspace, so the manifest loop cannot reach it and the script writes it by path instead. Never
# hand-edit them: the chart moving on its own is how `appVersion` named an image tag nobody pushed.
version: 27.6.0
appVersion: "27.6.0"
kubeVersion: ">=1.27.0-0"
keywords: [bun, postgres, solidjs, ultimate]
home: https://github.com/developerz-ai/ultimate
sources:
  - https://github.com/developerz-ai/ultimate
