# The optional local stack. `x dev` needs NONE of this — it runs embedded Postgres (PGlite),
# in-process events and S3-to-a-local-dir. Use this when you want the real services.
#
#   docker compose -f docker/docker-compose.dev.yml up -d

name: ultimate-dev

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ROLE: web
      PORT: 3000
      DATABASE_URL: postgres://ultimate:ultimate@db:5432/ultimate
      NATS_URL: nats://events:4222
      S3_ENDPOINT: http://storage:9000
    ports: ['3000:3000']
    depends_on:
      db: { condition: service_healthy }
      events: { condition: service_started }
      storage: { condition: service_started }

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ultimate
      POSTGRES_PASSWORD: ultimate
      POSTGRES_DB: ultimate
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ultimate']
      interval: 5s
      timeout: 3s
      retries: 20

  events:
    image: nats:2-alpine
    command: ['-js', '-m', '8222']
    ports: ['4222:4222', '8222:8222']

  storage:
    image: minio/minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ultimate
      MINIO_ROOT_PASSWORD: ultimate-dev
    ports: ['9000:9000', '9001:9001']
    volumes: ['s3data:/data']

volumes:
  pgdata:
  s3data:
