# The optional local stack. `x dev` needs NONE of this — it runs embedded Postgres (PGlite),
# in-process events and S3-to-a-local-dir. Use this when you want the real services.
#
#   docker compose -f docker/docker-compose.dev.yml up -d
#
# Every published port binds 127.0.0.1, not 0.0.0.0. This stack ships the credentials in the file —
# `ultimate:ultimate` on Postgres, `ultimate:ultimate-dev` on MinIO — so the short form `'5432:5432'`
# put an open database and an open object store on every interface the laptop has, including the
# café wifi. Docker publishes ports by writing DNAT rules, so a host firewall does not stop it. To
# reach this stack from another machine, put a tunnel in front of it (`ssh -L`) rather than widening
# the bind; production topology is docker-compose.prod.yml, and it is a different file for a reason.

name: ultimate-dev

# Three backing services and NO `app` service, which is the whole point of the file. This stack had
# one: it built `docker/Dockerfile`, which is the framework's CLI image (`/app/x` and nothing else),
# and set `ROLE: web` on it — an image that reads no ROLE. `x` with no arguments prints the command
# catalogue and exits 0, so the service printed help, exited, was restarted by compose and bound
# nothing on the 3000 it published. The app in development is `x dev`, on the host, against these
# three:
#
#   docker compose -f docker/docker-compose.dev.yml up -d
#   DATABASE_URL=postgres://ultimate:ultimate@127.0.0.1:5432/ultimate \
#   NATS_URL=nats://127.0.0.1:4222 S3_ENDPOINT=http://127.0.0.1:9000 x dev
services:
  db:
    image: postgres:17-alpine
    # wal_level=logical is what the replicator decodes; a server started on the default `replica`
    # answers ROLE=replicator with X_REPLICATION_FAILED at preflight, not at the first change.
    command: >
      postgres -c wal_level=logical -c max_replication_slots=8 -c max_wal_senders=8
    environment:
      POSTGRES_USER: ultimate
      POSTGRES_PASSWORD: ultimate
      POSTGRES_DB: ultimate
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ultimate']
      interval: 5s
      timeout: 3s
      retries: 20

  events:
    # 2.11 is the floor, not a preference: presence is a JetStream KV bucket, and batch direct get
    # plus per-message TTL landed there. An older server is X_TRANSPORT_PROTOCOL on the first dial.
    image: nats:2.11-alpine
    command: ['-js', '-m', '8222']
    ports: ['127.0.0.1:4222:4222', '127.0.0.1:8222:8222']

  storage:
    image: minio/minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ultimate
      MINIO_ROOT_PASSWORD: ultimate-dev
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['s3data:/data']

volumes:
  pgdata:
  s3data:
