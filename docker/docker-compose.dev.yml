# The optional local stack. `x dev` needs NONE of this — it runs embedded Postgres (PGlite),
# in-process events and S3-to-a-local-dir. Use this when you want the real services.
#
#   docker compose -f docker/docker-compose.dev.yml up -d
#
# Every published port binds 127.0.0.1, not 0.0.0.0. This stack ships the credentials in the file —
# `ultimate:ultimate` on Postgres, `ultimate:ultimate-dev` on the S3 gateway — so the short form
# `'5432:5432'` put an open database and an open object store on every interface the laptop has,
# including the café wifi. Docker publishes ports by writing DNAT rules, so a host firewall does not
# stop it. To reach this stack from another machine, put a tunnel in front of it (`ssh -L`) rather
# than widening the bind; production topology is docker-compose.prod.yml, and it is a different
# file for a reason.

name: ultimate-dev

# Three backing services and NO `app` service, which is the whole point of the file. This stack had
# one: it built `docker/Dockerfile`, which is the framework's CLI image (`/app/x` and nothing else),
# and set `ROLE: web` on it — an image that reads no ROLE. `x` with no arguments prints the command
# catalogue and exits 0, so the service printed help, exited, was restarted by compose and bound
# nothing on the 3000 it published. The app in development is `x dev`, on the host, against these
# three:
#
#   docker compose -f docker/docker-compose.dev.yml up -d
#   DATABASE_URL=postgres://ultimate:ultimate@127.0.0.1:5432/ultimate \
#   NATS_URL=nats://127.0.0.1:4222 \
#   S3_ENDPOINT=http://127.0.0.1:9000 S3_BUCKET=ultimate S3_FORCE_PATH_STYLE=1 \
#   S3_ACCESS_KEY_ID=ultimate S3_SECRET_ACCESS_KEY=ultimate-dev x dev
#
# The suites' own services are a different file — docker-compose.test.yml, the same servers in RAM
# with nothing kept. This one keeps a volume per service, because a dev stack that forgets its
# rows on `down` is one nobody leaves running.
#
# Each image is its tag — the series, for the reader — pinned to that series' multi-arch index
# digest, which is what runs: a tag is a pointer its publisher can move. Held by
# scripts/test-services-shape.test.ts; Dependabot's docker-compose ecosystem moves tag and digest.
services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    # wal_level=logical is what the replicator decodes; a server started on the default `replica`
    # answers ROLE=replicator with X_REPLICATION_FAILED at preflight, not at the first change.
    command: >
      postgres -c wal_level=logical -c max_replication_slots=8 -c max_wal_senders=8
    environment:
      POSTGRES_USER: ultimate
      POSTGRES_PASSWORD: ultimate
      POSTGRES_DB: ultimate
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ultimate']
      interval: 5s
      timeout: 3s
      retries: 20

  events:
    # 2.11 is the floor, not a preference: presence is a JetStream KV bucket, and batch direct get
    # plus per-message TTL landed there. An older server is X_TRANSPORT_PROTOCOL on the first dial.
    image: nats:2.11-alpine@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
    command: ['-js', '-m', '8222']
    ports: ['127.0.0.1:4222:4222', '127.0.0.1:8222:8222']

  # Versity S3 Gateway over a POSIX directory (Apache-2.0) — the server the test stack runs, here
  # with a volume. Every directory under /data is a bucket, so the volume mounted AT /data/ultimate
  # IS the bucket `ultimate`: it exists on the first `up`, with no CreateBucket call and no admin
  # client to install. The gateway checks the region a request was signed for, and Bun signs for
  # `auto` unless told — so the gateway's region IS `auto`, and an app that sets no S3_REGION
  # works. :9001 is its web console. Why this server: docs/history/test-services.md.
  storage:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      VGW_PORT: ':9000'
      VGW_WEBUI_PORT: ':9001'
      VGW_REGION: auto
      ROOT_ACCESS_KEY: ultimate
      ROOT_SECRET_KEY: ultimate-dev
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['s3bucket:/data/ultimate']

volumes:
  pgdata:
  s3bucket:
