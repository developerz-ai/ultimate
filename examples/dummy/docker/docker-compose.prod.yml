# One image, one process per role. Each service differs only by ROLE and replica count.
# `migrate` runs to completion before the rest start, and every other service says so in its own
# `depends_on`; concurrent migrators serialise on the ledger's lock rather than racing.
#
# A published host port has exactly one binder, so `web` and `sync` run at 1 here. Compose is one
# box; horizontal scaling of those two is the orchestrator's job (`docker/helm` in the framework
# repo). To scale them on one box anyway, drop `ports:` and put your own proxy on this network.
name: postly

# `IMAGE`, because that is the variable `x deploy --image` sets when it runs this file
# (`planDeploy`, packages/cli/src/cmd-deploy.ts — `env: { IMAGE: image }`). It was
# `:${BUILD_ID:?…}`, which no deploy command sets: every one of the six steps failed on a variable
# the operator had to export by hand, and `--image` decided nothing.
#
# `.env.production`, not `.env`: `.env` is the development file `x dev` reads on this box, and an
# image is deployed with the environment of the deployment, never with a developer's.
x-image: &image
  image: ${IMAGE:-ghcr.io/developerz-ai/postly:dev}
  env_file: [../.env.production]
  restart: unless-stopped
  stop_grace_period: 30s # SIGTERM → drain in-flight requests, jobs, and sockets

# The image's own HEALTHCHECK fetches `/readyz` on $PORT, and only `web` and `sync` open an HTTP
# socket — every other role gets the scrape listener and nothing else. A service that inherits that
# probe is fetching a port it never binds: it reports `unhealthy` for its whole life and anything
# gated on it never starts. Probes follow the role here, exactly as they do in the Helm chart.
x-metrics-probe: &metrics-probe
  test: ['CMD', 'bun', '--eval', "fetch('http://127.0.0.1:'+(process.env.METRICS_PORT||9090)+'/metrics').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
  interval: 10s
  timeout: 3s
  start_period: 30s
  retries: 3

# Run-once services exit. A probe against an exited container reports `unhealthy` forever, and
# nothing waits on their health — `service_completed_successfully` is what the others gate on.
x-run-once-probe: &run-once-probe
  disable: true

services:
  migrate:
    <<: *image
    environment: [ROLE=migrate]
    restart: 'no'
    healthcheck: *run-once-probe

  # Run-once, AFTER the new version serves — the last of `x deploy`'s six steps, and the one this
  # file had no service for: the deploy rolled four roles and then exited X_DEPLOY_FAILED on
  # `no such service: backfill`, having already restarted web, sync, worker and scheduler.
  #
  # The image's ENTRYPOINT is `bun apps/web/server.ts`, which reads ROLE and PORT and NOTHING ELSE
  # — argv appended to it is discarded, so a bare `command:` here would serve HTTP as ROLE=web.
  # Overriding the entrypoint is what makes the words below a command.
  backfill:
    <<: *image
    entrypoint: ['bun', 'node_modules/@ultimat3/cli/src/bin.ts']
    command: ['db', 'backfill', '--all', '--write', '--json']
    depends_on:
      migrate: { condition: service_completed_successfully }
      # The barrier, not the ordering: `docker compose up -d` returns when a container STARTS. The
      # image's own HEALTHCHECK (`/readyz`) is what makes "after the new version serves" true.
      web: { condition: service_healthy }
    restart: 'no'
    healthcheck: *run-once-probe

  web:
    <<: *image
    environment: [ROLE=web]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy: { replicas: 1 } # scales on RPS, stateless, behind the CDN — pinned by the published port
    ports: ['3000:3000']

  sync:
    <<: *image
    environment: [ROLE=sync]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy: { replicas: 1 } # scales on concurrent WS, no sticky sessions — pinned by the published port
    # The sync role listens on PORT + 1; mapping to :3000 would route to a listener it never opens.
    # PORT is unset here, so it is 3000 and this container listens on 3001.
    ports: ['3001:3001']
    # ...which is why the image's own HEALTHCHECK cannot be inherited here. It fetches $PORT —
    # 3000 — and this role never binds it, so the container reports `unhealthy` from
    # `start_period` onward and never recovers, and anything gated on `sync: service_healthy`
    # never starts. Literal 3001 rather than an expression, for the same reason `ports:` above
    # is literal: PORT is unset in this file, and two ways of saying one number drift.
    # `docker/helm` states the same rule as `PORT = .port - 1`.
    healthcheck:
      test: ['CMD', 'bun', '--eval', "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

  worker:
    <<: *image
    # `ROLE` and nothing else. `QUEUES=default,mail,digest` was here and NOTHING in `packages/*/src`
    # reads a `QUEUES` variable — a queue list that looked like configuration, was never parsed, and
    # would have read as a promise that this worker skips the queues it omits.
    environment: [ROLE=worker]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: *metrics-probe
    deploy: { replicas: 2 } # scales on queue depth

  scheduler:
    <<: *image
    environment: [ROLE=scheduler]
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Fixed 1. Leadership is an EXPIRING LEASE ROW in `x_scheduler_leader`, not an advisory lock:
    # that grant belongs to the session, not to this process — it outlives every transaction and no
    # pooled node can renew it or prove it still holds one. A second instance is harmless but idle.
    healthcheck: *metrics-probe
    deploy: { replicas: 1 }

  replicator:
    <<: *image
    environment: [ROLE=replicator]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: *metrics-probe
    deploy: { replicas: 1 } # exactly 1 per database — it owns the replication slot
