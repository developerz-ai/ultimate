# Optional. `x dev` runs embedded Postgres and in-process NATS, so this file exists only for
# the case where you want the real services locally (replication testing, multi-instance cache).
name: postly-dev

services:
  postgres:
    image: postgres:18-alpine
    # wal_level=logical is what live queries decode; without it tier 2 cannot start.
    command: >
      postgres -c wal_level=logical -c max_replication_slots=8 -c max_wal_senders=8
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postly_dev
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postly_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    # 2.11 or newer: presence lives in a JetStream KV bucket, which needs batch direct get and
    # per-message TTL. An older server refuses at boot rather than losing members silently.
    image: nats:2.11-alpine
    command: ['-js']
    ports: ['4222:4222']

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['6379:6379']

volumes:
  postgres-data:
