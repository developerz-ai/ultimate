<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="logo-title">
  <title id="logo-title">Ultimate</title>
  <!-- Self-contained and theme-aware: the internal stylesheet follows the viewer's
       colour scheme, so the same file works as a favicon in light and dark UI. -->
  <style>
    .frame { fill: none; stroke: #c5cad6; stroke-width: 4; }
    .mark  { fill: none; stroke: #4338ca; stroke-width: 6.5;
             stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #3f4555; }
      .mark  { stroke: #a5acff; }
    }
  </style>
  <rect class="frame" x="4" y="4" width="56" height="56" rx="16" />
  <path class="mark" d="M19 18 L32 46 L45 18" />
</svg>
