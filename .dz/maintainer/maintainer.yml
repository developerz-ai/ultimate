# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy for developerz-ai/ultimate.
#
# Ultimate is feature-complete and fully AI-maintained: the platform bot looks after it the way a
# human OSS maintainer would. Owner ruling 2026-10-23, "wurk and ultimate should be full ai
# maintained", reverses the 2026-10-14 split that left org members' work to its authors:
#
#   everyone          outside users, org members and collaborators alike: issues are triaged, junk
#                     is closed, real bugs are fixed by the fleet, and pull requests are driven to
#                     green and merged
#   Dependabot        driven to green and merged, majors included — CI is the verdict
#   breaking changes  the bot's call too (`escalate.ask_before_acting: []`); only the platform's
#                     hardcoded asks (security, license, CLA) reach a human
#   releases          cut when due: `scripts/release-due.ts` decides, the bot opens the bump PR,
#                     merging it IS the release (`.github/workflows/release-tag.yml`)
#
# Every pull request is reviewed, whoever wrote it — `review.force` below.
#
# Read from here first; the root `.maintainer.yml` this replaces is only the platform's legacy
# fallback, and two files would be two answers. Docs: https://developerz.ai/docs/maintainer-yml
version: 1

# No `services:` — this repo brings its own. `docker/docker-compose.test.yml` starts pgvector Postgres
# (and the second and TLS servers, Redis, NATS, S3) on 127.0.0.1, `docker/test-services.env` points
# the live suites at them, and CI's `verify` job starts them itself. Declaring `postgres` made the
# platform hold this repo's work for a box with something already accepting on 127.0.0.1:5432 —
# exactly the port the compose `postgres` service publishes, so on such a box the two collide (and
# the platform's server has neither this repo's `ultimate` user nor pgvector). A box needs `docker`,
# which developerz-ai fleet guests have.

tone:
  voice: friendly
  language: en

triage:
  # No `skip_project_members` (schema default false; owner ruling 2026-10-23: "wurk and ultimate
  # should be full ai maintained"). An issue opened by an org member or an invited collaborator is
  # triaged, picked up from the backlog and stale-swept like anyone's; the 2026-10-14 rule that left
  # it to its author is reversed.
  ask_for_repro: true
  required_fields: [steps, expected, actual, version]
  qualify_into: [bug, feature, dupe, question, docs]
  # The design axioms, in the words the bot quotes when it declines (CLAUDE.md, docs/idea/).
  # This list is the ONLY thing that lets it decline a request as out of scope.
  non_goals:
    - Bun only — no Node.js or Deno runtime support
    - Postgres only — no other database
    - SolidJS only — no React, Vue or Svelte renderer
    - No second way to do something the framework already does one way
    - No ninth primitive — a feature that fits none of the eight does not ship
    - Containers only — no platform-specific deploy primitives (Vercel, Lambda, Workers)
    - No plugin API — an app wraps a primitive instead
    - Outside human contributors' changes to CI, release or publish automation (.github/, scripts/release*, PUBLISHING.md) — members maintain that pipeline
  close_unanswered_repro_after_days: 14
  stale_after_days: 60
  stale_action: comment_then_close

handoff:
  # A qualified bug becomes coding work on the account's own boxes; no webhook.
  mode: fleet
  ask_reporter_first: false

pr:
  wait_for_other_bots: [coderabbit]
  # The verdict job; `ci.yml`'s header says why it is the one that answers for the run.
  required_checks: [verify]
  auto_merge: true
  # WHOSE pull requests the bot merges and babysits: every author's (owner ruling 2026-10-23: "wurk
  # and ultimate should be full ai maintained"; it reverses the 2026-10-14 `not_project` scope that
  # left members' PRs to their authors). `any`: its own, the dependency bots', outside
  # contributors', and org members' and collaborators' alike — reviewed, babysat, merged on green.
  # An OUTSIDE PR that changes CI, release or publish automation is still declined by the
  # `non_goals` line above (security audit, 2026-10-14): with no branch protection and no publish
  # reviewer, an auto-merged workflow edit would run beside the job holding `id-token: write`.
  # Whether an author is outside is the platform's read of their real repo permission, never
  # `author_association` (developerz.ai #6363).
  auto_merge_scope: any
  require_review: true
  # No `human_merge` lane: the owner's ruling is no human in the loop (2026-10-14). The risk is
  # stated, not hidden (security audit, 2026-10-14): `main` has no branch protection and
  # `npm-publish` no reviewers, so an auto-merged PR (the bot's own, a member's, or a Dependabot
  # action bump to a compromised SHA) can change what runs in the job holding `id-token: write`.
  # What stands in for a person: Dependabot's 14-day cooldown (most upstream compromises are caught
  # inside it), actions pinned by SHA, the release lane's shape pinned by tests the gate runs
  # (scripts/release-workflow-shape.test.ts, scripts/release-tag-workflow-shape.test.ts), and two
  # reviewers on every PR. The 2026-10-23 ruling ("full ai maintained") keeps it that way.
  close_awaiting_author_after_days: 21

review:
  # Run alongside CodeRabbit rather than standing down for it. Measured on prod 2026-08-31: with the
  # default `force: false` the platform deferred every PR to CodeRabbit (202 of 202 swept), while
  # CodeRabbit reviewed 73 — the other ~129 were reviewed by nobody.
  force: true

release:
  # `.github/workflows/release.yml` is the ONE publish path (axiom 1). The platform's own cut
  # (`release-please`, lightweight-tag Releases) made a second one: v23.0.1, v24.0.1 and v24.0.2
  # were Releases with no bump behind them, one left marked Latest while npm served 24.0.0. The bot
  # releases the way a member does — the bump PR — so its release manager stays off.
  manager: none
  channels: []

escalate:
  # Nothing held (owner ruling 2026-10-23: "wurk and ultimate should be full ai maintained"; it
  # empties the 2026-10-14 `[breaking_change]`). A breaking change is the bot's call too: a major
  # is a migration for every app (wiki/Upgrading.md), so the bot weighs that cost itself rather than
  # parking the PR for a member who looks in once or twice a year. Also not held: a first-time
  # contributor's PR (CodeRabbit + this bot's review + the full gate decide it, as for anyone), a
  # large PR, and a major dependency bump (CI is the verdict; `bun run verify` covers every package
  # that imports it). The platform's hardcoded asks (security, license, CLA) still apply; this list
  # cannot remove them.
  ask_before_acting: []

schedules:
  - name: release-due
    days: [mon, tue, wed, thu, fri]
    hours_utc: [6]
    brief_file: .dz/briefs/release-due.md
  # The failures nothing announces: a red `main`, a publish that did not land, npm drift, a stuck
  # Dependabot PR. Bot-authored alarm issues never pass intake, so this is how they reach the bot.
  - name: health
    days: [mon, tue, wed, thu, fri, sat, sun]
    hours_utc: [7]
    brief_file: .dz/briefs/health.md
  # Leave it measurably better and one step ahead of the next Bun release: at most three small,
  # evidenced PRs, never a version bump, never a breaking change (narrower than `escalate:` on
  # purpose: an improvement nobody asked for is not worth a migration for every app, so the brief
  # files an issue for the owner instead). Fires EVERY Monday because the schema has weekdays, not
  # days of the month; the brief acts only on the first Monday of the month (UTC day 1-7) and stops
  # on the others.
  - name: improve
    days: [mon]
    hours_utc: [8]
    brief_file: .dz/briefs/improve.md
