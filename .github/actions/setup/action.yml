name: setup
description: Bun, the dependency cache and a frozen install — the three steps every job here starts with.

# Checkout stays in the caller: this file has to be on disk before it can run.
#
# Pinning rule for this repo, and it is one rule with one boundary: an action from the `actions/`
# org follows its major tag (GitHub owns the runner and the tag together), and EVERY action from
# anywhere else is pinned by commit SHA with its version in the trailing comment. `@v2` is a tag a
# third party can move, and this composite runs first in every job in the repository — including the
# publish job, which holds `id-token: write`. Dependabot's `github-actions` ecosystem updates a SHA
# pin and rewrites the comment with it, so the pin does not rot.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        # The 1.4 series, not `latest`. `latest` let a Bun major or minor land unannounced in every
        # job in the repo — a runtime change nobody chose, arriving first in whatever ran next.
        # `1.4.x` is the same series `docker/Dockerfile` builds on (`oven/bun:1.4-slim`) and the same
        # series a scaffolded app's image runs (`oven/bun:1.4-alpine`, written by
        # packages/cli/src/templates/scaffold-container.ts), so CI, the framework image and the app
        # image cannot disagree; patch releases still arrive, which is the point of a series and not
        # an exact pin nothing in this repo would ever bump (Dependabot ignores `bun`).
        #
        # `.github/workflows/release.yml` pins this same series and has to move with this line — it
        # is the job that publishes, so a runtime skew there ships rather than fails.
        #
        # It moved 1.3 → 1.4 on 2026-08-20 because the pin had become worse than a wrong number: dev
        # boxes were on 1.4 and CI on 1.3, so a green local `bun run verify` was not evidence of a
        # green CI, and a PR merged red on a bundling difference between the two.
        #
        # **The reversal was tried on 2026-08-27 and REFUSED on evidence, and the evidence is the
        # point of this block** — the arguments for going back to 1.3 are good ones and will be made
        # again. `engines.bun` is `>=1.4.0` in all 42 manifests, which bars every Bun 1.3 user from
        # installing `@ultimat3/*`, and the only thing here that needs a modern Bun is `x test`
        # emitting `bun test --isolate` (`--parallel` with it) — BOTH 1.3.13 features. Nothing in
        # the tree calls a 1.4-only API: `bun run typecheck` is clean against `@types/bun@1.3.14`,
        # measured. Two of the three arguments that put CI on 1.4 do not survive re-reading either:
        #
        #   1. The **bundling skew** was real — Bun 1.3 refused `bun build --compile` with
        #      `Could not resolve: "@babel/preset-typescript/package.json"` where 1.4 bundled the
        #      unresolvable `require` as a runtime throw — but `COMPILE_EXTERNALS` marks that
        #      specifier external on EITHER Bun and says so in its own header. The version pin had
        #      been protecting nothing since the day the external landed.
        #   2. **"Dev boxes and CI must agree" is a skew argument, not a 1.4 argument.** It says the
        #      two must name ONE series; agreeing on 1.3 satisfies it exactly as well. What enforces
        #      it now is `scripts/bun-pin.test.ts`, which did not exist on 2026-08-20.
        #
        # **The shutdown hang that used to hold this line is FIXED, and it was ours** (#394,
        # 2026-08-27). `dev-runtime.live.test.ts` drops the probe database out from under a running
        # web role, and its teardown never returned on 1.3.14. The MECHANISM was never the version:
        # reduced to a repro with no `@ultimat3/*` and run three times per case, `Bun.SQL`'s `end()`
        # waits on an outstanding RESERVED connection identically on both runtimes — unreleased, it
        # hangs on 1.3.14 and on 1.4.0 alike, with the database perfectly healthy. Only once that
        # connection's backend had been terminated did the two diverge, and there it was a RACE that
        # 1.3.14 lost 3 times out of 3 and 1.4.0 lost 1 time out of 3. So 1.4.0 was never correct
        # here, it was lucky, and the same hang was latent in what this repo shipped.
        #
        # `PoolProfile.drainTimeoutMs` is the repair: `close()` passes the driver's OWN `{ timeout }`
        # — declared in this repo's `Bun.SQL` slice since it was written and passed by nobody — and
        # a drain that used its whole budget raises `X_DB_DRAIN_TIMEOUT` rather than resolving as if
        # it were clean. That file now passes on 1.3.14 and on 1.4.0 with no flags.
        #
        # **So the only argument left for 1.4 is the gate's WALL CLOCK**, which is the last bullet
        # below: CI's `verify` job ran 6m14s on 1.3.x against 3m36s here, past this repo's own
        # five-minute target. That is a real reason and a much smaller one than a hang, and it is
        # the number a future attempt has to move.
        #
        # Two other differences were measured and neither blocks anything, recorded so the next
        # attempt does not re-measure them:
        #
        #   * `Bun.Glob` matches nothing under a dot-directory on 1.3.14 without `dot: true`, even
        #     when the pattern spells the dot — `.github/workflows/*.yml` selects 0 files where
        #     1.4.0 selects 5. That one reached the framework and is FIXED at the shared reader
        #     (`scripts/lib/doc-citations.ts`): `gate-steps` had never read this file on Bun 1.3.
        #   * The gate is ~2.3x slower: `bun run verify` is 144s on 1.4.0 and 337s on 1.3.14, green
        #     on both once the timeout budgets were sized against contention rather than against one
        #     fast runtime (`REPO_SCAN_TIMEOUT_MS`, 90s -> 180s, same commit). CI's `verify` job ran
        #     6m14s on 1.3.x against 3m36s here, past the repo's five-minute target.
        #
        # `scripts/bun-pin.test.ts` reads every `engines.bun`, both `REQUIRED_BUN` constants,
        # `@types/bun`, every `FROM oven/bun:` and both workflow pins, and fails when any two name
        # different series — so this line cannot move alone, in either direction.
        # THE EXACT PATCH, `As of 2026-09-05`, and the paragraphs above are why the SERIES was the
        # pin until this morning. Bun 1.4.2 was published at 05:55 UTC on 2026-09-05, `1.4.x`
        # admitted it on the next run, and its bundler retains MORE of a re-export barrel than
        # 1.4.0's: `packages/ui/src/barrel-bytes.test.ts` — three pins that measure what a browser
        # chunk pays for the `@ultimat3/ui` barrel — fails on `main` (b557be65) under 1.4.2 with
        # nothing changed (`<= 1024` bytes measured 10,653; `useUi` and `moneyText` retain 31 lines
        # the module path does not) and passes under 1.4.0; `examples/dummy`'s like island grew from
        # under 50,426 bytes to 51,381 on the same runner for the same reason. A patch that changes
        # what ships to a browser is a change this repository measures, so the pin names the patch
        # somebody measured. Move it forward the way 1.3 → 1.4 moved: run the gate on the candidate
        # and write the numbers here. 1.4.1 is untested and is not the pin for that reason alone.
        bun-version: '1.4.0'
    - uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - run: bun install --frozen-lockfile
      shell: bash
