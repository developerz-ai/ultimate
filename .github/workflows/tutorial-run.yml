name: tutorial-run

# Does a stranger following tutorials 1–4 on this commit see what the pages show? Every ```bash
# fence, in order, on a scaffold built from this checkout (`scripts/tutorial-run.ts`). Its own
# workflow, never a `ci` job: it installs and gates a scaffold several times, and `ci`'s clock and
# push count must not pay for that. On a push to `main` AND a pull request, filtered to the files
# that can move a tutorial's output — the generators, `x new`, `x db` and the CLI's message
# catalog — so a change touching none of them starts nothing. Main-only, it went red on the merge
# of a green pull request (#1272: `x db gen`'s success line gained its tables); on a pull request
# the red lands before the merge. Not a required check: `verify` is the one
# (docs/history/ci-split.md), and a path-filtered workflow never leaves a check pending.
# `scripts/ci-workflow-main-only.test.ts` holds the two path lists equal. AND weekly: the paths
# cannot list every package whose printed line a tutorial quotes (`x routes`, `x policy`, `x tasks`,
# `x build`, `create-ultimate`, …), so a filter alone let tutorials rot unseen while the health row
# (`scripts/lib/health-tutorials.ts`) kept reading the last green; a newest run over eight days old
# is stale there.
# The same job RUNS `wiki/Building-Your-Own-Base.md`'s recipes: each `## Recipe:` fence written to
# the path it names in a scratch app and driven by `scripts/base-recipes/` — seconds, no scaffold.

on:
  push:
    branches: [main]
    paths:
      - 'wiki/Tutorial-0[1-4]*'
      - 'packages/cli/src/templates/**'
      - 'packages/cli/src/cmd-generate*'
      - 'packages/cli/src/cmd-new*'
      - 'packages/cli/src/cmd-db*'
      - 'packages/cli/src/db-*'
      - 'packages/cli/src/messages*'
      - 'packages/cli/src/verify-*'
      - 'scripts/tutorial-run.ts'
      - 'scripts/lib/tutorial-steps.ts'
      - 'wiki/Building-Your-Own-Base.md'
      - 'scripts/base-recipes/**'
      - 'scripts/lib/base-recipes.ts'
      - '.github/workflows/tutorial-run.yml'
  pull_request:
    paths:
      - 'wiki/Tutorial-0[1-4]*'
      - 'packages/cli/src/templates/**'
      - 'packages/cli/src/cmd-generate*'
      - 'packages/cli/src/cmd-new*'
      - 'packages/cli/src/cmd-db*'
      - 'packages/cli/src/db-*'
      - 'packages/cli/src/messages*'
      - 'packages/cli/src/verify-*'
      - 'scripts/tutorial-run.ts'
      - 'scripts/lib/tutorial-steps.ts'
      - 'wiki/Building-Your-Own-Base.md'
      - 'scripts/base-recipes/**'
      - 'scripts/lib/base-recipes.ts'
      - '.github/workflows/tutorial-run.yml'
  schedule:
    # Weekly, Sunday early UTC — clear of the nightly flake hunt (02:23), Saturday's compat (03:41)
    # and Monday's bench and next-sync (04:41).
    - cron: '29 5 * * 0'
  workflow_dispatch:

# One group per ref: a newer push to main supersedes the run before it, as it always did, and a pull
# request's run is superseded only by its own next push — never by main's, nor main's by it.
concurrency:
  group: tutorial-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tutorials:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: the Building-Your-Own-Base recipes, run
        run: bun test ./scripts/base-recipes/
      - name: tutorials 1–4, fence by fence
        run: bun run scripts/tutorial-run.ts
