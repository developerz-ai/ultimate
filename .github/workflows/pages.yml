name: pages

# Builds the documentation site from site/ and deploys it to GitHub Pages. The site is a static
# Ultimate surface: 0kb JS by default, so the build output is HTML plus assets.

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # site/build.ts is the one builder — zero dependencies, so no install step. It renders
      # site/pages/*.md into site/dist/ and emits CNAME, .nojekyll, sitemap, robots and feed
      # itself. A missing or broken site is a red build, not a placeholder: the site is part of
      # the repo, and a deploy that silently published raw markdown is worse than a failure.
      - name: build site
        run: bun run site/build.ts

      # enablement: true makes the workflow provision Pages on a repo where it is off (a fresh
      # fork, a restored repo), instead of dying on "Get Pages site failed".
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
