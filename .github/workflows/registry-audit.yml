# Asks npm what it actually holds, and opens an issue when it disagrees with this tree.
#
# NOT a step of `x verify`, and it must never become one. The gate is the shippability contract and
# runs on free runners; a step that resolves the network makes green depend on something the runner
# does not control. More to the point, a gate step could not do this job anyway: the three states
# this catches all appear BETWEEN commits, not at one.
#
# The state it exists for: a package added after a release run is unpublished until a human
# bootstraps it, and nothing says so until the next release reaches it and aborts with everything
# ahead of it already published irreversibly. `@ultimat3/flags` sat that way until 2.0.0 and
# `@ultimat3/scraping` until 2026-08-19, each while the docs described the other.

name: registry-audit

on:
  schedule:
    # Daily, well away from the hour a release is likely to be cut by hand.
    - cron: '17 6 * * *'
  workflow_dispatch:

# Resolves npm and may open an issue, provisioning its own `registry-drift` label first. It never
# publishes, and it holds no `id-token`, so it cannot be a path to the registry even if compromised.
permissions:
  contents: read
  issues: write

concurrency:
  group: registry-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    # One npm round trip per package, measured well under a minute. Without a bound a hung registry
    # call holds the runner for GitHub's default of 6 hours, every morning it hangs.
    timeout-minutes: 10
    steps:
      # `persist-credentials: false`: the checkout would otherwise leave the job's `issues: write`
      # token in .git/config through `bun install`, readable by every dependency's install script.
      # The issue step below passes its own `GH_TOKEN` and needs nothing from the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: audit the registry
        id: audit
        # `pipefail` is load-bearing: without it `tee` decides the step's exit status, the audit's
        # non-zero is discarded, `outcome` is always `success`, and every step below that keys on
        # `failure` never runs — a workflow that reports clean whatever npm says.
        shell: bash
        run: |
          set -o pipefail
          bun run scripts/registry-audit.ts --json | tee audit.json
        # Not a swallowed failure: the two steps below key on this `outcome`, file the alarm, then
        # fail the run themselves. Without it a red audit would skip the issue it exists to open.
        continue-on-error: true

      - name: open an issue when the registry disagrees
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        # One open issue at a time: a daily job that files a duplicate every morning trains everyone
        # to ignore it, which is the failure mode this audit exists to correct.
        run: |
          # `gh issue create --label` refuses a label the repository does not have, so a repo that
          # never had (or has lost) `registry-drift` gets no alarm at all. Provision it first:
          # create-first, not lookup-first, so the daily repeat and any race both resolve green —
          # a failed create is fatal only when an exact-label lookup cannot confirm it exists.
          # gh has no `label view` (list/create/delete/edit/clone only), so the lookup is the REST
          # label endpoint — the same `gh api` existence probe release-tag.yml makes against a tag.
          if ! err="$(gh label create registry-drift --color d73a4a --description 'npm does not serve what this tree stamps' 2>&1)"; then
            gh api "repos/${GITHUB_REPOSITORY}/labels/registry-drift" >/dev/null 2>&1 || { printf '%s\n' "$err" >&2; exit 1; }
          fi
          existing="$(gh issue list --label registry-drift --state open --limit 1 --json number --jq '.[0].number // empty')"
          summary="$(jq -r '.summary' audit.json)"
          body="$(jq -r '"**" + .summary + "**\n\n" + ([.findings[] | "- `" + .code + "` " + (.at // "") + " — " + .cause + "\n  - fix: `" + .fix + "`"] | join("\n"))' audit.json)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label registry-drift --title "registry: $summary" --body "$body"
          fi

      - name: fail the run so the badge is honest
        if: steps.audit.outcome == 'failure'
        run: exit 1
