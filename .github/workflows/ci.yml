name: ci

# The gate. Same steps a contributor runs locally with `bin/check` — a check that lives only in CI
# is a check developers cannot run. Free GitHub-hosted runners only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run: CI is a signal, not an archive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Deterministic tests: frozen clock, seeded RNG, sealed network (scripts/test-setup.ts).
  ULTIMATE_TEST_SEED: '20260101'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: biome
        run: bunx biome check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: tsc
        run: bun run typecheck

  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # No install needed: the checker reads source and uses Bun's own transpiler.
      - name: import tiers
        run: bun run scripts/boundaries.ts --json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: bun test
        # No opt-in exclusions: the framework's e2e/contract/live/job/eval suites all run, every
        # time. The reference app's suites are not here — they run in `reference-app-verify`,
        # against the app's own preload and fixtures.
        run: bun run test

  # The whole gate, exactly as `x verify` runs it. Green here means shippable.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [lint, typecheck, boundaries, test]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: x verify
        run: bun run scripts/verify.ts --json

  # The reference app runs the same 15-step gate a generated app would. Not in `verify`'s
  # `needs`: the framework gate and the app gate are two different contracts, checked
  # independently — a red app doesn't hide a green framework or vice versa. That is also why
  # the app is absent from the `typecheck` and `test` jobs above: its typecheck and its suites
  # are steps 1 and 6-11 of the gate below, so running them twice only decides which job's
  # redness you notice first.
  #
  # Advisory, not blocking. As of 2026-08 Postly is written against the finished API — the fluent
  # `action` surface, `defineMail`/`defineService`, the `page`/`subscribe`/`evaluate` fixtures —
  # and the framework has not shipped it yet, so every failure here is drift the roadmap already
  # owns rather than a regression this PR introduced. Blocking on it would make red the resting
  # state, which is how a gate stops being read. `continue-on-error` comes off at milestone 9 in
  # docs/idea/14-roadmap.md — the last of those surfaces to land — when app and framework agree.
  reference-app-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: x verify (examples/dummy)
        # `continue-on-error` on the STEP, not the job: on the job it leaves the check itself red
        # for as long as the drift above lasts, and a check that is always red is a check nobody
        # reads — the exact failure mode this PR exists to remove. On the step the run is marked
        # with a warning, and the whole 15-step table, every failing step and every fix line stay
        # in the log. Human render, not `--json`: the reader of an advisory result is a person or
        # an agent scanning for which step went red, not a parser.
        continue-on-error: true
        working-directory: examples/dummy
        run: bun run ../../packages/cli/src/bin.ts verify
