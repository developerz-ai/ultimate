name: ci

# The gate. Same steps a contributor runs locally with `bin/check` — a check that lives only in CI
# is a check developers cannot run. Free GitHub-hosted runners only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run: CI is a signal, not an archive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Deterministic tests: frozen clock, seeded RNG, sealed network (scripts/test-setup.ts).
  ULTIMATE_TEST_SEED: '20260101'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: biome
        run: bunx biome check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: tsc
        run: bun run typecheck

  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # No install needed: the checker reads source and uses Bun's own transpiler.
      - name: import tiers
        run: bun run scripts/boundaries.ts --json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: bun test
        # `bun run test`, not bare `bun test`: the package script carries
        # `--path-ignore-patterns='**/e2e/**'`, and the e2e suite is opt-in
        # because it binds a real socket and needs `ULTIMATE_TEST_ALLOW_NET=1`.
        # Running it bare here is why `test` fails on main — every e2e case dies
        # on X_TEST_NETWORK_SEALED, which is the harness working as designed.
        run: bun run test

  # The whole gate, exactly as `x verify` runs it. Green here means shippable.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [lint, typecheck, boundaries, test]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: x verify
        run: bun run scripts/verify.ts --json
