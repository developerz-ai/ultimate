name: ci

# The gate. Same steps a contributor runs locally with `bun run verify` — a check that lives only
# in CI is a check developers cannot run. Free GitHub-hosted runners only.
#
# Three jobs, and each answers a question no other job answers: does the framework ship, does the
# reference app still gate, and can a stranger scaffold an app that gates. There is deliberately no
# separate `lint`, `typecheck`, `boundaries` or `test` job — those are steps 1, 2, 3 and 7-12 of
# `x verify`, and running them again beside the gate is the second path axiom 1 forbids. It also
# cost what it duplicated: the four jobs took ~2.2 runner-minutes and, because `verify` waited on
# them through `needs`, added their slowest (~1.6 min) to the critical path before the gate could
# start. `x verify` reports per step, so a red lint still names itself on its own line.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run: CI is a signal, not an archive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Deterministic tests: frozen clock, seeded RNG, sealed network (scripts/test-setup.ts).
  ULTIMATE_TEST_SEED: '20260101'

jobs:
  # The whole gate, exactly as `x verify` runs it. Green here means shippable.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # A real Postgres, not a fake driver — packages/testing/src/template-db.ts clones a database
    # off it per worker, so client.ts/introspect.ts/branch.ts get exercised against a live server
    # instead of a recording client. No admin URL means those tests skip, so `bun test` still
    # passes on a laptop with nothing installed.
    #
    # pgvector/pgvector:pg17 rather than stock postgres:17: @ultimat3/ai's PgVectorStore is the
    # only production vector path, and pg-vector.live.test.ts REFUSES to skip when the extension
    # is missing. Asserting the statement text a store compiles to cannot catch a statement
    # Postgres rejects — this image is what makes that suite a measurement instead of a skip.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ultimate
          POSTGRES_PASSWORD: ultimate
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ultimate"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      # The shared cache tier's two Lua scripts are the only thing in the framework a real Redis
      # answers differently from a fake: `EVAL` enforces the KEYS declaration, and the invalidation
      # script `DEL`d keys it never declared. Asserting the script TEXT cannot catch a script the
      # server rejects, so without this container that path is proved by nothing.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_DATABASE_URL: postgres://ultimate:ultimate@localhost:5432/postgres
      TEST_REPLICATION_URL: postgres://ultimate:ultimate@localhost:5433/postgres
      TEST_NATS_URL: nats://localhost:4222
      # Absent on a laptop, so `packages/cache/src/redis.live.test.ts` skips there and measures here.
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # `wal_level = logical` is a server argument, and a service container takes none —
      # so the replication server is started by hand. Without it the logical-replication
      # feed's live tests skip, and a decoder nothing exercises is a decoder nobody trusts.
      #
      # JetStream is a server argument too, and it is what presence is built on — the KV bucket,
      # its per-message TTL and its batch direct reads. Without a real one the bus client is only
      # ever proved against the in-memory server in nats-fake.ts, which is the thing being checked.
      #
      # Both are started before either is waited on: they are independent servers, and starting
      # them in sequence pays each one's readiness wait end to end for no reason.
      - name: start the logical-replication postgres and the JetStream nats-server
        run: |
          docker run -d --name pg-logical \
            -e POSTGRES_USER=ultimate -e POSTGRES_PASSWORD=ultimate -e POSTGRES_DB=postgres \
            -p 5433:5432 postgres:17-alpine -c wal_level=logical
          docker run -d --name nats-js -p 4222:4222 nats:2.11-alpine -js
          # `-h 127.0.0.1`, not the default unix socket, and that is the whole point: the
          # postgres entrypoint boots a TEMPORARY server to run initdb, and that one listens on
          # the socket ONLY. A socket probe therefore answers "accepting connections" for a
          # server that is about to shut down and be replaced — this step went red on main
          # having logged "accepting connections" and "no response" two lines apart. TCP is up
          # only once the real server is, so it cannot see the bootstrap one at all.
          for _ in $(seq 1 30); do
            docker exec pg-logical pg_isready -U ultimate -h 127.0.0.1 -p 5432 && break
            sleep 2
          done
          docker exec pg-logical pg_isready -U ultimate -h 127.0.0.1 -p 5432 \
            || { echo 'postgres with wal_level=logical never became ready' >&2; exit 1; }
          for _ in $(seq 1 30); do
            docker logs nats-js 2>&1 | grep -q 'Server is ready' && break
            sleep 2
          done
          docker logs nats-js 2>&1 | grep -q 'Server is ready' \
            || { echo 'nats-server never became ready' >&2; exit 1; }
      - name: x verify
        run: bun run scripts/verify.ts --json

  # Both tracked apps — `examples/dummy` and the deployed `dummy/social-media-clone` — run the
  # same 17-step gate a generated app would, and this job BLOCKS on both. Independent of `verify`:
  # the framework gate and the app gate are two different contracts, checked separately — a red app
  # doesn't hide a green framework or vice versa. One job, not two, because they answer the same
  # question about two directories; the script names the app in every finding.
  #
  # Neither app is green yet, so blocking on a bare `x verify` would make red the resting state,
  # which is how a gate stops being read. `scripts/reference-app-gate.ts` blocks on the ratchet
  # instead: every step passing today must keep passing, every step pinned in that app's
  # `expectedRed` table (scripts/lib/gated-apps.ts) must still be failing, and the moment an app's
  # `typecheck` comes off the pin it has to join the root `tsc -b` solution. The pin can only ever
  # shrink, and when it empties the job is asserting a plain 17 of 17. Human render, not `--json`:
  # the whole step table, every failing step and every fix line belong in the log for the person
  # reading a red run.
  #
  # Job id unchanged from when it gated one app: it is a required status check.
  reference-app-verify:
    runs-on: ubuntu-latest
    # Covers BOTH apps, which the gate runs sequentially — and it is a runaway kill-switch, not a
    # budget. Measured `As of 2026-08` over four runs of this job with both apps wired in: 53s, 29s,
    # 28s, 24s wall-clock end to end, so 15 minutes is ~17× the worst one. A gate whose steps fail
    # fast is dominated by install and boot, not by the second app; the number moves when a
    # measurement moves it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: x verify (every tracked app), against the ratchet
        run: bun run scripts/reference-app-gate.ts

  # The end-to-end promise, proved for real: a stranger with nothing but `bun` runs `x new`,
  # `bun install`, `x verify` and gets a green gate. Distinct from scaffold-typecheck.ts (which
  # compiles every generated file set in-process, in the workspace, against source packages, and
  # tolerates a short list of pinned KNOWN_GAPS) — this job runs the real CLI-produced files
  # through a real, separate `bun install` and a real `x verify` subprocess, catching whatever
  # only shows up once an app is actually assembled and installed (a missing package-shape file,
  # a dependency range with no matching release, a preload path that only resolves inside this
  # workspace). It runs outside the checkout so nothing here can quietly depend on this repo's own
  # workspace linking.
  #
  # No `needs`: it was gated on lint/typecheck/boundaries to avoid scaffolding from a tree that
  # could not compile, but those jobs are gone and waiting on the whole gate would serialise a
  # 20-second job behind a two-minute one to save a runner-minute it usually does not save.
  #
  # `@ultimat3/*` isn't published to npm this early in the pipeline (that happens on release, from
  # a tag — see PUBLISHING.md), so a plain `bun install` in the scaffolded app can't resolve it
  # from the registry. `scripts/scaffold-smoke-overrides.ts` rewrites those ranges to `file:`
  # overrides pointing at this repo's own `packages/*` first — the same source a release would
  # publish, installed the same way `bun install` installs anything. `--linker=hoisted`: Bun's
  # default isolated linker races on identical `file:` targets shared by many dependents (such as
  # `@ultimat3/core`) and intermittently fails to link a few — hoisted does not.
  scaffold-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: x new demoapp
        run: bun run x -- new demoapp --dir "${{ runner.temp }}"
      - name: point demoapp's @ultimat3/* ranges at this repo's own packages
        run: bun run scripts/scaffold-smoke-overrides.ts "${{ runner.temp }}/demoapp"
      - name: bun install (demoapp)
        working-directory: ${{ runner.temp }}/demoapp
        # Retried once: the race above is intermittent, and a clean second install is always
        # idempotent — see the job comment for why the first can fail even on a good scaffold.
        run: bun install --linker=hoisted || bun install --linker=hoisted
      # What the job could not see until 2026-08: it ran `x new` → `bun install` → `x verify` and
      # NOTHING else, so it never invoked a generator and never opened the database. Three defects
      # shipped inside that blind spot and were found by a human scaffolding an app, not by CI —
      # which is the reason this step exists at all: the corrections had been made before, and the
      # gap let them come back.
      #
      # `scripts/scaffold-first-run.ts` is the first ten minutes after `x new`, run as a check, in
      # the order `bin/setup` documents: `x db migrate` over the empty migrations directory, then
      # `x db gen "initial"` and the apply that follows it, then EVERY generator projected from the
      # CLI's own `GENERATORS` registry (never a sample — the failure was 4 of 13, and a fourteenth
      # generator is covered the day it lands), then the `x db gen` those generators earn and its
      # apply. The `"initial"` spelling is pinned against `templates/scaffold-docs.ts`'s own bytes,
      # so this job cannot keep running a first command the scaffold no longer documents.
      #
      # It names the step, its exit code and its `--json` verdict per failure, and it does not stop
      # at the first one: four broken generators are four findings in one run, not four CI rounds.
      #
      # LOAD-BEARING for the step below, not just additive. `x db gen` is now the ONE writer of
      # `packages/db/migrations` and a scaffold ships none, so `x verify`'s `drift` step is red
      # until `x db gen "initial"` has run — measured: 15 of 17 with `drift` red and no db command,
      # 16 of 17 with only `budgets` red after this step. The fix is to RUN the documented command,
      # never to add `drift` to `--allow-red`, which would waive the step this issue exists to make
      # honest.
      #
      # No service container. `resolveServices` (packages/cli/src/dev-services.ts) answers
      # `embedded` when `DATABASE_URL` is unset, which is PGlite on disk under `.x/` — so the whole
      # database half costs a `bun install` this job already paid for, and a postgres service on a
      # free runner would buy nothing this app can tell apart.
      - name: first run (demoapp) — db gen, db migrate, every generator
        run: bun run scripts/scaffold-first-run.ts "${{ runner.temp }}/demoapp"
      # BLOCKING, on a ratchet that can only shrink. `continue-on-error: true` used to make all 17
      # steps advisory over a waiver written for exactly one of them, and the first blocking run
      # proved that waiver was both stale and covering three unrelated reds. Two of the three are
      # now fixed and off this list; ONE name is left, and it is the only step a scaffolded app is
      # allowed to fail:
      #
      #   budgets — every generated route declares a `budget:`, and `x verify`'s budgets step reads
      #             the measurement out of `.x/build-stats.json` (packages/cli/src/cmd-verify.ts,
      #             `readBuildStats(...) ?? { routes: [] }`). NOTHING in the gate produces that file,
      #             so on a fresh app it is absent, every declared budget is unmeasured, and the step
      #             is X_BUDGET_UNMEASURED per route. The one thing that writes it is
      #             `apps/web/prerender.ts`, which only `x build --target static` runs
      #             (packages/cli/src/cmd-build.ts, `BUILD_ENTRY.static` / `staticArgs`) — and a
      #             bare `x build` defaults to `docker`, builds an image and writes no stats at all.
      #             So this is NOT a scaffold defect and no template change can close it: closing it
      #             is a change to the budgets step itself (packages/cli/src/budgets.ts,
      #             packages/cli/src/cmd-verify.ts) — either the gate builds before it weighs, or an
      #             app with no stats file is a skip rather than a red. Until one of those lands,
      #             running the build here instead would be this job measuring the gate's homework
      #             for it.
      #
      # What the two departed names were, so nobody re-adds them from the old text:
      #   lint    — the previous comment blamed `Bun.env['SITE_ORIGIN']` and a biome `$schema` pin.
      #             Both are Biome *infos* and `biome check .` exits 0 with them present. The single
      #             real error was a trailing blank line in an emitted test file — one byte, fixed.
      #   errors  — templates/action.ts emitted a fix: citing `x db studio`, which is in
      #             PLANNED_SUBCOMMANDS and exits X_NOT_IMPLEMENTED, so every scaffold wrote a fresh
      #             X_ERROR_FIX_INVALID. Fixed.
      #
      # The list may never grow: a second red step fails this job, and so does a name here that
      # starts passing — `scripts/scaffold-gate.ts` reports that as `stale` with a fix line pointing
      # at this very step (`WAIVER_FILE`). It runs the app's own `verify` script and reads its
      # `--json` step table; the pins for the tracked apps live in scripts/lib/gated-apps.ts, and a
      # scaffolded app has nowhere to keep one because it is built fresh on every run.
      #
      # It runs AFTER the first-run step and over its output, and that is what turns the sweep into
      # a check: all thirteen generators exit 0 even when what they emit cannot resolve an import,
      # so the catch is `typecheck` and `lint` over the files they wrote — `TS2307: Cannot find
      # module '../repo'` was invisible to every exit code in this job. It also needs the first-run
      # step's `x db gen "initial"` to have happened, or `drift` is red before it starts.
      - name: x verify (demoapp, generated into), against the ratchet
        run: >-
          bun run scripts/scaffold-gate.ts "${{ runner.temp }}/demoapp"
          --allow-red budgets
