name: ci

# The gate. Same steps a contributor runs locally with `bin/check` — a check that lives only in CI
# is a check developers cannot run. Free GitHub-hosted runners only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run: CI is a signal, not an archive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Deterministic tests: frozen clock, seeded RNG, sealed network (scripts/test-setup.ts).
  ULTIMATE_TEST_SEED: '20260101'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: biome
        run: bunx biome check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: tsc
        run: bun run typecheck

  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # No install needed: the checker reads source and uses Bun's own transpiler.
      - name: import tiers
        run: bun run scripts/boundaries.ts --json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A real Postgres, not a fake driver — packages/testing/src/template-db.ts clones a database
    # off it per worker, so client.ts/introspect.ts/branch.ts get exercised against a live server
    # instead of a recording client. No admin URL means those tests skip, so `bun test` still
    # passes on a laptop with nothing installed.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ultimate
          POSTGRES_PASSWORD: ultimate
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ultimate"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_DATABASE_URL: postgres://ultimate:ultimate@localhost:5432/postgres
      TEST_REPLICATION_URL: postgres://ultimate:ultimate@localhost:5433/postgres
      TEST_NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # `wal_level = logical` is a server argument, and a service container takes none —
      # so the replication server is started by hand. Without it the logical-replication
      # feed's live tests skip, and a decoder nothing exercises is a decoder nobody trusts.
      - name: start a logical-replication postgres
        run: |
          docker run -d --name pg-logical \
            -e POSTGRES_USER=ultimate -e POSTGRES_PASSWORD=ultimate -e POSTGRES_DB=postgres \
            -p 5433:5432 postgres:17-alpine -c wal_level=logical
          for _ in $(seq 1 30); do
            docker exec pg-logical pg_isready -U ultimate && exit 0
            sleep 2
          done
          echo 'postgres with wal_level=logical never became ready' >&2 && exit 1
      # JetStream is a server argument too, and it is what presence is built on — the KV bucket,
      # its per-message TTL and its batch direct reads. Without a real one the bus client is only
      # ever proved against the in-memory server in nats-fake.ts, which is the thing being checked.
      - name: start a JetStream nats-server
        run: |
          docker run -d --name nats-js -p 4222:4222 nats:2.11-alpine -js
          for _ in $(seq 1 30); do
            docker logs nats-js 2>&1 | grep -q 'Server is ready' && exit 0
            sleep 2
          done
          echo 'nats-server never became ready' >&2 && exit 1
      - name: bun test
        # No opt-in exclusions: the framework's e2e/contract/live/job/eval suites all run, every
        # time. The reference app's suites are not here — they run in `reference-app-verify`,
        # against the app's own preload and fixtures.
        run: bun run test

  # The whole gate, exactly as `x verify` runs it. Green here means shippable.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [lint, typecheck, boundaries, test]
    # Same live Postgres as the `test` job — the gate's own unit step sweeps up the live-Postgres
    # tests too, and it should exercise them for real rather than silently skip.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ultimate
          POSTGRES_PASSWORD: ultimate
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ultimate"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_DATABASE_URL: postgres://ultimate:ultimate@localhost:5432/postgres
      TEST_REPLICATION_URL: postgres://ultimate:ultimate@localhost:5433/postgres
      TEST_NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # `wal_level = logical` is a server argument, and a service container takes none —
      # so the replication server is started by hand. Without it the logical-replication
      # feed's live tests skip, and a decoder nothing exercises is a decoder nobody trusts.
      - name: start a logical-replication postgres
        run: |
          docker run -d --name pg-logical \
            -e POSTGRES_USER=ultimate -e POSTGRES_PASSWORD=ultimate -e POSTGRES_DB=postgres \
            -p 5433:5432 postgres:17-alpine -c wal_level=logical
          for _ in $(seq 1 30); do
            docker exec pg-logical pg_isready -U ultimate && exit 0
            sleep 2
          done
          echo 'postgres with wal_level=logical never became ready' >&2 && exit 1
      # JetStream is a server argument too, and it is what presence is built on — the KV bucket,
      # its per-message TTL and its batch direct reads. Without a real one the bus client is only
      # ever proved against the in-memory server in nats-fake.ts, which is the thing being checked.
      - name: start a JetStream nats-server
        run: |
          docker run -d --name nats-js -p 4222:4222 nats:2.11-alpine -js
          for _ in $(seq 1 30); do
            docker logs nats-js 2>&1 | grep -q 'Server is ready' && exit 0
            sleep 2
          done
          echo 'nats-server never became ready' >&2 && exit 1
      - name: x verify
        run: bun run scripts/verify.ts --json

  # The reference app runs the same 17-step gate a generated app would, and this job BLOCKS on it.
  # Not in `verify`'s `needs`: the framework gate and the app gate are two different contracts,
  # checked independently — a red app doesn't hide a green framework or vice versa. That is also
  # why the app is absent from the `typecheck` and `test` jobs above: its typecheck and its suites
  # are steps 1 and 7-12 of the gate below, so running them twice only decides which job's redness
  # you notice first.
  #
  # Postly is not green yet, so blocking on a bare `x verify` would make red the resting state,
  # which is how a gate stops being read. `scripts/reference-app-gate.ts` blocks on the ratchet
  # instead: every step passing today must keep passing, every step pinned in its `EXPECTED_RED`
  # table must still be failing, and the moment `typecheck` comes off the pin the app has to join
  # the root `tsc -b` solution. The pin can only ever shrink, and when it empties the job is
  # asserting a plain 17 of 17. Human render, not `--json`: the whole step table, every failing
  # step and every fix line belong in the log for the person reading a red run.
  reference-app-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: x verify (examples/dummy), against the ratchet
        run: bun run scripts/reference-app-gate.ts

  # The end-to-end promise, proved for real: a stranger with nothing but `bun` runs `x new`,
  # `bun install`, `x verify` and gets a green gate. Distinct from scaffold-typecheck.ts (which
  # compiles every generated file set in-process, in the workspace, against source packages, and
  # tolerates a short list of pinned KNOWN_GAPS) — this job runs the real CLI-produced files
  # through a real, separate `bun install` and a real `x verify` subprocess, catching whatever
  # only shows up once an app is actually assembled and installed (a missing package-shape file,
  # a dependency range with no matching release, a preload path that only resolves inside this
  # workspace). It runs outside the checkout so nothing here can quietly depend on this repo's own
  # workspace linking.
  #
  # `@ultimat3/*` isn't published to npm this early in the pipeline (that happens on release, from
  # a tag — see PUBLISHING.md), so a plain `bun install` in the scaffolded app can't resolve it
  # from the registry. `scripts/scaffold-smoke-overrides.ts` rewrites those ranges to `file:`
  # overrides pointing at this repo's own `packages/*` first — the same source a release would
  # publish, installed the same way `bun install` installs anything. `--linker=hoisted`: Bun's
  # default isolated linker races on identical `file:` targets shared by many dependents (such as
  # `@ultimat3/core`) and intermittently fails to link a few — hoisted does not.
  scaffold-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, boundaries]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: x new demoapp
        run: bun run x -- new demoapp --dir "${{ runner.temp }}"
      - name: point demoapp's @ultimat3/* ranges at this repo's own packages
        run: bun run scripts/scaffold-smoke-overrides.ts "${{ runner.temp }}/demoapp"
      - name: bun install (demoapp)
        working-directory: ${{ runner.temp }}/demoapp
        # Retried once: the race above is intermittent, and a clean second install is always
        # idempotent — see the job comment for why the first can fail even on a good scaffold.
        run: bun install --linker=hoisted || bun install --linker=hoisted
      - name: x verify (demoapp)
        working-directory: ${{ runner.temp }}/demoapp
        # Advisory: `x new --example`'s entity.ts carries the same pinned TS18048 gap
        # scaffold-typecheck.ts's KNOWN_GAPS documents — `invariant()`'s generic key type falling
        # back to `string` — which needs a breaking change to a shipped primitive to close, so a
        # major version, not a fix this job can wait on. Everything else in the 17-step table is
        # real signal: a new red step here is not that gap and should be read as a regression.
        # (reference-app-verify above blocks on a per-step ratchet instead; a scaffolded app has
        # nowhere to keep one, since it is built fresh in a temp dir on every run.)
        continue-on-error: true
        run: bun run verify
