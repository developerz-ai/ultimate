name: ci

# The gate, run in parts and re-joined. Same steps a contributor runs locally with `bun run verify`
# — a check that lives only in CI is a check developers cannot run. Free GitHub-hosted runners only.
#
# One runner per UNIT, by the owner's instruction of 2026-10-01 (docs/history/ci-split.md): each
# tracked app, each scaffold, each slice of the packages and each part of the framework gate gets
# its own. Every job answers a question no other job answers: does the framework ship (`gate`, in
# parts, and `verify`, their one verdict), does each tracked app still gate
# (`reference-app-verify`), can a stranger scaffold an app that gates (`scaffold-smoke`), do the
# deployable artifacts BUILD and RENDER (`container`), does a rolling upgrade on the scaffolded
# chart drop a request (`deploy-proof`, main only), and is each package green and above its
# coverage bar in isolation (`packages`). The last three each carry their own argument, above the
# job.
#
# There is still no `lint`, `typecheck`, `boundaries` or `test` job BESIDE the gate — that is the
# second path axiom 1 forbids, and it once cost ~2.2 runner-minutes for checks the gate then ran
# again. The `gate` parts are the opposite of that: each is `x verify --only <steps>` for a slice of
# the ONE step list, no step runs twice, and `verify` folds the parts back with `x verify merge`,
# which is red for a step no part ran. The split cannot drop a step in silence either way:
# `scripts/ci-workflow-shape.test.ts` holds the parts to exactly the gate's step list before a push,
# and the merge holds the run to it after. A red lint still names itself on its own line, in its
# own part.
#
# What it buys, measured on the last six runs before the split (2026-10-01): the gate was one
# 307-362 s job, over this repo's own five-minute target, and hit its 12-minute timeout twice on a
# push to main (#589). Its slowest part is now ~2 minutes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a PULL REQUEST supersedes the in-flight run for that branch: CI is a signal, not
# an archive. A push to `main` never supersedes anything, and the group is keyed by SHA there so it
# cannot.
#
# It was `group: …-${{ github.ref }}` with `cancel-in-progress: true` unconditionally, and every
# push to main shares one ref. Merge two PRs ninety seconds apart and the FIRST commit's run was
# cancelled by the second's — so its `reference-app-verify` concluded `cancelled`, and
# `deploy-social-demo.yml`'s verdict check (correctly) fails closed on any conclusion that is not
# `success`. The image for the first commit never shipped, and the log read like a red gate on a
# commit whose gate never ran.
#
# Keying pushes by SHA rather than setting `cancel-in-progress: false` for them: a shared group with
# no cancellation SERIALISES, so the second merge would wait out the first's full run before
# starting. Per-SHA groups let both run, and neither can cancel the other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Deterministic tests: frozen clock, seeded RNG, sealed network (scripts/test-setup.ts).
  ULTIMATE_TEST_SEED: '20260101'
  # A browser IS present on `ubuntu-latest`, so an e2e suite that skips for want of one here is a
  # green step over nothing — which is exactly what the first run of
  # `packages/testing/e2e/cdp-browser.e2e.test.ts` was: 2,958ms on a step that takes 31s with a
  # browser. Set, the suite refuses by name (`X_CDP_BROWSER_MISSING`) instead of skipping, so the
  # day the runner image drops Chrome is a red job naming the paths it tried rather than silence.
  E2E_BROWSER_REQUIRED: '1'

jobs:
  # The framework gate, one part per runner. Every part is the same command a contributor runs —
  # `bun run verify --only <steps>` — over a slice of the one step list, and none of them is a
  # verdict: a narrowed run says NOT A GATE RUN on its own summary line. `verify`, below, is.
  #
  # THE PARTS, sized from the per-step wall times the gate printed on main (run 36899716351, a
  # 4-core runner):
  #
  #   unit-N   180 s over three shards   the one step worth splitting; `--shard i/n` is a pure
  #                                      function of the sorted file list, so 2/3 is the same files
  #                                      on every runner and reproduces locally with the same flags
  #   live     64 s, the static steps    every suite that needs a server. The six static steps run
  #            BESIDE it, at no wall     BESIDE the serial suites whenever `live` is in the list —
  #            time of their own         the runner's own rule, and how the whole gate has run them
  #                                      since 2026-09-23 — so they cost this part nothing: the
  #                                      slowest was 37 s inside a 64 s window. Two runners of
  #                                      their own cost 4 billed minutes to save none.
  #   e2e      8 s + 42 s                a browser, and the compiler: `tsc -b` writes, so it runs
  #                                      alone and first, on the part with a core to spare
  #
  # Fixed cost per part, measured on main: 7-11 s for checkout and setup (the install cache is a
  # 34 MB restore keyed on bun.lock and the install after it is under a second), plus the services
  # where a part starts any.
  #
  # The shape is the one wiki/CI-Parallel-Gate.md hands an app: a matrix of parts, each uploading
  # its `--json` document, and one job that merges them.
  #
  # `fail-fast: false`: a red part must not cancel the others. An agent fixing three things needs
  # all three findings from one run, which is the rule `x verify` itself runs every step under.
  #
  # SERVICES are started by `docker compose` from docker/docker-compose.test.yml, not declared as
  # `services:` here, for three reasons. A `services:` container takes no command, so `wal_level`
  # and JetStream had to be `docker run` by hand in a step anyway — two mechanisms for one job. A
  # part starts only what its steps read, and `services:` cannot be conditional on a matrix value.
  # And it is the file a laptop starts, so a suite cannot be green here against a server nobody
  # else can boot. Every server in it keeps its data on a tmpfs, runs without fsync and logs
  # nothing (the file says how); `--wait` returns when each healthcheck passes, so there is no
  # readiness loop here to get wrong.
  #
  # A part exports the `TEST_*_URL` of exactly the services it started — docker/test-services.env
  # is the one place the URLs are written. One it did not start stays unset and its suites skip; a
  # URL exported for a server that is not there would fail them instead, never pass them.
  gate:
    name: gate (${{ matrix.part }})
    runs-on: ubuntu-latest
    # A runaway kill-switch, not a budget: the slowest part is ~2 minutes.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: unit-1
            only: unit
            shard: 1/3
            services: postgres
            urls: TEST_DATABASE_URL
          - part: unit-2
            only: unit
            shard: 2/3
            services: postgres
            urls: TEST_DATABASE_URL
          - part: unit-3
            only: unit
            shard: 3/3
            services: postgres
            urls: TEST_DATABASE_URL
          - part: live
            only: lint,boundaries,filesize,package-shape,errors,contract,live,job,eval,drift,contract-diff,budgets,seo,i18n,policy,manifest,roadmap
            services: postgres postgres-logical redis nats s3
            urls: TEST_DATABASE_URL|TEST_REPLICATION_URL|TEST_REDIS_URL|TEST_NATS_URL|TEST_S3_URL
          - part: e2e
            only: typecheck,e2e
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # `scripts/budget-raises.ts` compares every route budget with origin/main's TIP, so one commit
      # at depth 1 is all it needs — never `fetch-depth: 0`. Skipped on a push to main, where HEAD
      # IS that tip: the rule then prints that it compared nothing, and there is nothing to raise.
      # In every part, because the rule is a test and a shard may be the one that holds it.
      - name: fetch origin/main's tip for budget-raises
        if: github.ref != 'refs/heads/main'
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - uses: ./.github/actions/setup
      # `time` prints what the services cost this part to start; it is the line to read when this
      # step is suspected of being the slow one.
      - name: test services, in RAM
        if: matrix.services
        env:
          SERVICES: ${{ matrix.services }}
          URLS: ${{ matrix.urls }}
        run: |
          # $SERVICES is a list of compose service names, split on purpose.
          # shellcheck disable=SC2086
          time docker compose -f docker/docker-compose.test.yml up -d --wait $SERVICES \
            || { docker compose -f docker/docker-compose.test.yml ps -a; exit 1; }
          grep -E "^(${URLS})=" docker/test-services.env >> "$GITHUB_ENV"
      # The part's `--json` document is the artifact `verify` merges, so it is written to a file
      # first and printed after — and the step table is rendered from it for the person reading a
      # red run, because a 60 kB JSON line is not something anyone scans for a failing step.
      #
      # Written under $RUNNER_TEMP, never in the checkout: the file is open and EMPTY while the
      # part's own steps run, and `lint` (biome walks the tree) failed the `live` part on it once.
      - name: x verify --only ${{ matrix.only }} ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
        env:
          PART: ${{ matrix.part }}
          ONLY: ${{ matrix.only }}
          SHARD: ${{ matrix.shard }}
        run: |
          parts="$RUNNER_TEMP/parts"
          mkdir -p "$parts"
          status=0
          bun run scripts/verify.ts --only "$ONLY" ${SHARD:+--shard "$SHARD"} --json \
            > "$parts/${PART}.json" || status=$?
          cat "$parts/${PART}.json"
          jq -r '
            (.steps // [])[]
            | "\(if .skipped then "-" elif .ok then "✓" else "✗" end) \(.name)  \(.durationMs)ms\(if .tests then "  \(.tests.ran) ran, \(.tests.skipped) skipped\(if .tests.errors then ", \(.tests.errors) errored" else "" end)" else "" end)",
              (.findings[]? | "    \(.code)\(if .at then " (\(.at))" else "" end)\n      cause: \(.cause)\n      fix:   \(.fix)"),
              (select(.ok | not) | .output // empty | "    output (last lines):\n\(split("\n")[-40:] | map("      " + .) | join("\n"))")
          ' "$parts/${PART}.json" || true
          exit "$status"
      # Uploaded when the part is RED too: the verdict is the merge's, and a part that failed
      # without a document would read there as a step nobody ran rather than a step that failed.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: verify-part-${{ matrix.part }}
          path: ${{ runner.temp }}/parts/${{ matrix.part }}.json
          if-no-files-found: error
          retention-days: 7

  # THE VERDICT. Green here means shippable, and this is the only job that says so: it folds every
  # part back into one gate result with `x verify merge`, which is green only when the parts are
  # provably the whole gate — every step of the list reported by exactly one part, a sharded step
  # by every shard of one split over one corpus, and the zero-tests floor applied to the shards'
  # SUMMED counts. A step no part ran is `X_VERIFY_MERGE_INCOMPLETE` on that step's own line, so a
  # part dropped from the matrix above, a part that died before writing its document and an
  # artifact that never uploaded are all red here rather than absent.
  #
  # `!cancelled()`, not the default `success()`: with a red part the default SKIPS this job, and a
  # skipped verdict reads as no verdict. It runs, merges what exists and fails with every finding
  # from every part in one document. A cancelled run leaves it skipped, which
  # `release.yml` refuses as it refuses anything but `success`.
  #
  # Job id unchanged from when it was the whole gate: `release.yml`'s `check` job reads this job's
  # conclusion, by this name, for the tagged commit.
  verify:
    needs: gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: verify-part-*
          path: ${{ runner.temp }}/parts
          merge-multiple: true
      # The human render, not `--json`: this is the one table a person reads to learn what the
      # gate said, with every finding from every part under the step that raised it.
      - name: x verify merge — every step, from exactly one part, green
        run: bun run scripts/verify.ts merge ${{ runner.temp }}/parts/*.json

  # Each tracked app — `examples/dummy` and the deployed `dummy/social-media-clone` — on its own
  # runner: BUILT (`x build --target static`, as a generated app's `bin/check` does, because
  # `budgets` weighs what the build writes) and then run through the same 20-step gate a generated
  # app would, and this job BLOCKS on it. Independent of `verify`:
  # the framework gate and the app gate are two different contracts, checked separately — a red app
  # doesn't hide a green framework or vice versa. One runner per app since 2026-10-01: the two ran
  # back to back in one job (the gate boots an embedded Postgres and binds the e2e port, so never
  # side by side on one box), and the second app waited out the first. The matrix below is the
  # gated-apps table, held to it by `scripts/ci-workflow-shape.test.ts` — an app added to the table
  # and not to this list is a red test, not an ungated app.
  #
  # Blocking on a bare `x verify` would make red the resting state whenever an app carries a known
  # red step, which is how a gate stops being read. `scripts/reference-app-gate.ts` blocks on the
  # ratchet instead: every step passing today must keep passing, every step pinned in that app's
  # `expectedRed` table (scripts/lib/gated-apps.ts) must still be failing, and the moment an app's
  # `typecheck` comes off the pin it has to join the root `tsc -b` solution. The pin can only ever
  # shrink, and when it empties the job is asserting a plain 20 of 20. Human render, not `--json`:
  # the whole step table, every failing step and every fix line belong in the log for the person
  # reading a red run.
  #
  # `deploy-social-demo.yml` reads the check `reference-app-verify (dummy/social-media-clone)` — the
  # gate of the app whose image it publishes — so the `name:` below is a contract with that file.
  reference-app-verify:
    name: reference-app-verify (${{ matrix.app }})
    runs-on: ubuntu-latest
    # A runaway kill-switch, not a budget: both apps together measured 106 s on main, 2026-10-01.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [examples/dummy, dummy/social-media-clone]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The scratch Postgres `x db gen` and the `drift` step replay migrations on is PGlite, and its
      # first boot in a checkout is an `initdb`: ~3.0 s, against ~0.75 s restored from the
      # post-`initdb` snapshot it leaves under the APP's `.x/cache` (measured 2026-10-01; 40 MB on
      # disk, 3.8 MB as the cache stores it). The file is named for the PGlite version and its own
      # format and read only through its checksum, so a stale entry is a miss, never a wrong
      # database — and the key moves with both, so a miss is also what refreshes it.
      - name: the PGlite version bun.lock pins
        id: pglite
        run: echo "version=$(grep -om1 '"@electric-sql/pglite@[0-9][^"]*"' bun.lock | tr -dc '0-9.')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ matrix.app }}/.x/cache/pglite-*.snapshot
          key: pglite-snapshot-${{ matrix.app }}-${{ steps.pglite.outputs.version }}-${{ hashFiles('packages/db/src/pglite-snapshot.ts') }}
      - name: x build + x verify, against the ratchet
        env:
          APP: ${{ matrix.app }}
        run: bun run scripts/reference-app-gate.ts --app "$APP"

  # The end-to-end promise, proved for real and proved as the PLATFORM consumes it: a dz-runner box
  # is an Ubuntu VM with bun and git, no docker and no services, and on a freshly scaffolded app it
  # runs the app's own `bin/setup && bin/check`. This job runs those two scripts — the ones `x new`
  # writes, spawned as a box spawns them — and holds the FIRST `bin/check` to green with no waiver
  # and no repair round. A GitHub `ubuntu-latest` runner with bun, git and network is the closest
  # thing in this repo to that VM; it is not the VM, and the timings the job prints say so.
  #
  # Distinct from scaffold-typecheck.ts (which compiles every generated file set in-process, in the
  # workspace, against source packages, and tolerates a short list of pinned KNOWN_GAPS) — this job
  # runs the real CLI-produced files through a real, separate `bun install` and a real gate
  # subprocess, catching whatever only shows up once an app is actually assembled and installed (a
  # missing package-shape file, a dependency range with no matching release, a preload path that
  # only resolves inside this workspace). It runs outside the checkout so nothing here can quietly
  # depend on this repo's own workspace linking.
  #
  # No `needs`: it was gated on lint/typecheck/boundaries to avoid scaffolding from a tree that
  # could not compile, but those jobs are gone and waiting on the whole gate would serialise a
  # 20-second job behind a two-minute one to save a runner-minute it usually does not save.
  #
  # THE TWO CI-ONLY LINES, and neither is doctoring the app under test:
  #
  #   * `@ultimat3/*` isn't published to npm this early in the pipeline (that happens on release,
  #     from a tag — see PUBLISHING.md), so a plain `bun install` in the scaffolded app can't
  #     resolve it from the registry. `scripts/scaffold-smoke-overrides.ts` rewrites those ranges to
  #     `file:` overrides pointing at this repo's own `packages/*` — the same source a release would
  #     publish, installed the same way `bun install` installs anything.
  #   * an `[install]` section APPENDED to that app's own `bunfig.toml` pins it to the hoisted
  #     linker, and it is the override's own tax (appended, never written over: `x new` writes that
  #     file for `[test]`, and replacing it drops the preload that seals the network and freezes the
  #     clock for the gate's own `unit` step): Bun's
  #     default isolated linker does not resolve a `file:` dependency's own `@ultimat3/*` imports
  #     (reproduced: `x db migrate` dies on `Cannot find module '@ultimat3/time'` from
  #     `node_modules/.bun/@ultimat3+jobs@file.../src/task.ts`), and it races on identical `file:`
  #     targets shared by many dependents. It is a bunfig rather than the `bun install
  #     --linker=hoisted` this job used to run itself, because `bin/setup` now performs the install
  #     and a second `bun install` in the other layout relays out the whole tree.
  #
  # TWO scaffolds, one runner each since 2026-10-01 — they share no state, and the second waited
  # out the first (44 s then 33 s on main). `scaffold-gate.ts` takes one directory per run by
  # design, so covering both shapes was already two invocations rather than a flag; the matrix is
  # those two. `--no-example` is an app with no islands and no example slice — some thirty files
  # fewer, a count `scripts/generator-counts.ts` derives and this comment does not restate — which
  # is precisely why it stayed green through a default scaffold whose fix chain was a loop: the
  # steps that read emitted island and feature files had nothing to read.
  #
  # Two gates per scaffold. 10 minutes is the kill-switch that covers it; this is the only job
  # that measures what a stranger's first ten minutes with the framework actually do.
  scaffold-smoke:
    name: scaffold-smoke (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: demoapp
            flags: ''
          - app: bareapp
            flags: --no-example
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: x new ${{ matrix.app }} ${{ matrix.flags }}
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          # $FLAGS is empty or one flag, split on purpose.
          # shellcheck disable=SC2086
          bun run x -- new "$APP" --dir "$RUNNER_TEMP" $FLAGS
      - name: point the app's @ultimat3/* ranges at this repo's own packages
        run: |
          bun run scripts/scaffold-smoke-overrides.ts "$RUNNER_TEMP/$APP"
          printf '\n[install]\nlinker = "hoisted"\n' >> "$RUNNER_TEMP/$APP/bunfig.toml"
      # The same snapshot `reference-app-verify` caches, for the scaffold's own `.x/cache` — AFTER
      # `x new`, which refuses a directory that already exists. Keyed on the version THIS repo
      # locks; the scaffold resolves its own `^` range, so the day npm serves a newer PGlite the
      # entry is a miss and the job pays the `initdb` it paid before this step existed.
      - name: the PGlite version bun.lock pins
        id: pglite
        run: echo "version=$(grep -om1 '"@electric-sql/pglite@[0-9][^"]*"' bun.lock | tr -dc '0-9.')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/${{ matrix.app }}/.x/cache/pglite-*.snapshot
          key: pglite-snapshot-${{ matrix.app }}-${{ steps.pglite.outputs.version }}-${{ hashFiles('packages/db/src/pglite-snapshot.ts') }}
      # THE CONTRACT, and the only step in this repo that runs it. `bin/setup` installs, generates
      # and applies the first migration, SEEDS and writes the manifest; `bin/check` builds and then
      # gates. Both are the scaffold's own scripts — no flag waives a step, and nothing runs a
      # printed `fix:` and tries again, because a box gets one pass.
      #
      # `budgets` is asserted GREEN here rather than allowed to stay red, which it was until this
      # change: `x verify` weighs `.x/build-stats.json` and the only writer is `x build --target
      # static`, which is `bin/check`'s first line. Running the real script is what closed the
      # waiver — not a change to the budgets step.
      #
      # It prints per-step wall time for both commands and for all 20 gate steps, so the run is its
      # own measurement rather than something a PR body claims.
      - name: bin/setup && bin/check, first pass, no waiver
        run: bun run scripts/scaffold-gate.ts "$RUNNER_TEMP/$APP"
      # The generator sweep, over an app whose first run has already happened. All thirteen exit 0
      # even when what they emit cannot resolve an import, so this step is not the catch: the gate
      # below is, over the files they wrote — `TS2307: Cannot find module '../repo'` was invisible
      # to every exit code in this job. The defect that bought it broke 4 generators of the 13,
      # found by a human scaffolding an app — so the list is projected from the CLI's own
      # `GENERATORS` and a fourteenth generator is covered the day it lands.
      - name: every generator
        run: bun run scripts/scaffold-first-run.ts "$RUNNER_TEMP/$APP"
      # The same two scripts again, and the second run is not a repeat: `bin/setup` applies the
      # migration the generators earned (which is also what makes its own documented "idempotent,
      # safe to re-run" a measurement), and `bin/check` gates 13 generators' output with the same
      # no-waiver rule.
      - name: bin/setup && bin/check, over every generator's output
        run: bun run scripts/scaffold-gate.ts "$RUNNER_TEMP/$APP"
      # The one step here that opens a socket. Everything above typechecks and gates the files
      # `x g resource` wrote; none of it would notice an admin that mounted nothing, or mounted for
      # everybody. This boots the app as its developer does (`x dev`, embedded Postgres), creates a
      # row through the admin's own form as the `admin` role, finds it in the list, edits it,
      # deletes it, and is refused the list and the write as `member`. Last, because the table it
      # writes to exists only once the `bin/setup` above has applied the generators' migration.
      # ~3 s, 2 s of it the boot (measured 2026-10-01, both scaffolds).
      - name: /admin serves the generated resource, to the admin role only
        run: bun run scripts/scaffold-admin.ts "$RUNNER_TEMP/$APP"

  # The deployable artifacts, BUILT and RENDERED — not merely present.
  #
  # The rule at the top of this file says a job beside the gate has to be argued. Here is the
  # argument: the ONLY thing in `x verify` that looks at `docker/` is the `roadmap` step, and it
  # asks whether `docker/Dockerfile`, `docker/docker-compose.prod.yml` and `docker/helm` EXIST
  # (scripts/roadmap.ts, REQUIRED_ARTIFACTS[11]). Existence is not function, and nothing anywhere
  # built the image or rendered the chart. That is why this set rotted unseen:
  #
  #   - the image's default command was "dev --once" — the DEV SERVER, which ignores ROLE and is
  #     documented "boot, report, exit" — so every service in a compose file booted it, exited 0 and
  #     was restarted forever, and "run --rm migrate" applied no migration and reported success;
  #   - the chart declared serviceAccount.create and serviceAccount.name and read neither, so an
  #     operator configuring IRSA got the chart's own account and pods with no cloud identity.
  #
  # Neither is visible to a path check, and both are caught below. Every step is a command a
  # developer can paste and run — the rule at the top of this file — which is also why the
  # assertions are shell over docker and helm rather than a script this job alone knows how to run.
  #
  # No ./.github/actions/setup, and that is deliberate rather than forgotten: nothing here runs
  # bun, so the composite's frozen install would be pure latency. docker, helm and jq all come from
  # the runner image, and the first step refuses if one is missing.
  #
  # Cost: measured 20s wall clock for the full image build on a warm daemon — bun install
  # --frozen-lockfile 1.1s, bun build --compile --minify 1.8s, because the framework has very few
  # external dependencies. A cold runner pays the two base image pulls on top. That is comfortably
  # inside the 5-minute target, so this builds the WHOLE image rather than a --target slice: the
  # runtime stage is where three of the four recorded build bugs lived (musl-vs-glibc, the Debian
  # skew, the missing --define), and a build stopping at "build" would have caught none of them.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: docker, helm and jq, from the runner image
        run: |
          set -euo pipefail
          for tool in docker helm jq; do
            command -v "$tool" >/dev/null || {
              echo "::error title=${tool} missing::The ubuntu-latest runner image no longer ships ${tool}, so this job cannot check docker/. fix: add a SHA-pinned setup action for ${tool} to this job — the pinning rule and its reason are in .github/actions/setup/action.yml — or install it inline in this step."
              exit 1
            }
          done
          docker version --format 'docker {{.Server.Version}}'
          helm version --short
          jq --version

      # Builds every stage, ending in the runtime stage's own RUN ["/app/x", "--version"]. That exec
      # is what turns a wrong libc, a Debian skew, a missing --define or a lost workspace manifest
      # into a red build instead of a red pod — all four have happened.
      - name: build the framework's CLI image
        run: docker build -f docker/Dockerfile -t ultimate-cli:ci .

      # The assertion the CMD defect needed. "x" with no arguments prints its catalogue and exits 0,
      # so a default command that boots ANYTHING fails here twice over: "x dev --once" in a container
      # with no app exits 1 with X_NOT_IN_APP and prints no catalogue. Verified against a mutant
      # image built FROM this one with the old CMD restored — exit 1, no catalogue.
      - name: the image is a CLI, and its default command is the catalogue
        run: |
          set -euo pipefail
          out="$(docker run --rm ultimate-cli:ci)"
          echo "$out"
          case "$out" in
            *"usage: x <command>"*) echo "ok: the default command is the CLI catalogue" ;;
            *)
              echo "::error title=Image default command is not the CLI catalogue::docker run ultimate-cli:ci with no arguments did not print the x command catalogue. This image contains /app/x and no app, so it can serve no ROLE; a CMD that boots something is an infinite restart loop under 'restart: unless-stopped', and a release phase that reports success having done nothing. fix: remove the CMD from docker/Dockerfile — an app image is what serves roles, and 'x new' writes one."
              exit 1
              ;;
          esac

      # The --define ULTIMATE_FRAMEWORK_VERSION chain, checked on the SHIPPED artifact and against
      # the source of truth rather than against itself. The runtime stage's RUN proves the binary
      # answers --version at build time; this proves the answer is the right number and that the
      # ENTRYPOINT wiring survived into the image config.
      - name: the version define survived, and matches @ultimat3/core
        run: |
          set -euo pipefail
          expected="$(jq -r .version packages/core/package.json)"
          actual="$(docker run --rm ultimate-cli:ci --version --json | jq -r .data.version)"
          echo "core=${expected} image=${actual}"
          [ "$expected" = "$actual" ] || {
            echo "::error title=Image version mismatch::The image answers --version '${actual}' but packages/core/package.json is '${expected}'. A single-file executable carries no package.json, so this number comes only from the --define in docker/Dockerfile's build stage. fix: check the VERSION_DEFINE line in docker/Dockerfile, then run 'bun run scripts/release.ts --check ${expected}' for a workspace that was not stamped."
            exit 1
          }

      # Both compose files, parsed by compose itself. .env.production is a secrets file that is never
      # committed and env_file: is required by design — a missing one must fail an operator loudly —
      # so an empty stand-in is created for the syntax check and removed again.
      - name: both compose files parse
        run: |
          set -euo pipefail
          touch .env.production
          trap 'rm -f .env.production' EXIT
          docker compose -f docker/docker-compose.dev.yml config -q
          # The prod file refuses an unset SYNC_URL (`${SYNC_URL:?…}`) — a page must dial the sync
          # role's own port — so the syntax check supplies the value an operator would.
          SYNC_URL=ws://localhost:3001/_x/sync docker compose -f docker/docker-compose.prod.yml config -q
          # And the refusal itself: supplying the value above proves only that the file parses, so
          # deleting the `:?` requirement would stay green without this negative case.
          if env -u SYNC_URL docker compose -f docker/docker-compose.prod.yml config -q 2>/dev/null; then
            echo "::error title=SYNC_URL not required::docker/docker-compose.prod.yml parsed with SYNC_URL unset, so a Compose deploy starts a web role whose pages dial nothing. fix: restore 'SYNC_URL: \${SYNC_URL:?set SYNC_URL=ws://<host>:3001/_x/sync, see wiki/Deployment.md}' under web.environment in docker/docker-compose.prod.yml"
            exit 1
          fi
          echo "ok: both compose files parse, and the prod file refuses an unset SYNC_URL"

      - name: helm lint
        run: helm lint docker/helm --strict

      # Defaults plus every branch the defaults leave dark. serviceMonitor, ingress and the
      # replicator role are all off by default, and scheduler/replicator carry no autoscaling block
      # at all — that last one is what made the whole chart fail to render once, so the no-HPA path
      # is rendered on purpose rather than left to a default that hides it.
      - name: the chart renders, on defaults and on every optional branch
        run: |
          set -euo pipefail
          helm template app docker/helm > /dev/null
          helm template app docker/helm \
            --set serviceMonitor.enabled=true \
            --set ingress.enabled=true \
            --set roles.replicator.enabled=true \
            --set roles.sync.enabled=true \
            --set nameOverride=demo > /dev/null
          helm template app docker/helm \
            --set roles.web.autoscaling.enabled=false \
            --set roles.sync.autoscaling.enabled=false \
            --set roles.worker.autoscaling.enabled=false > /dev/null
          helm template app docker/helm --set migrate.enabled=false > /dev/null
          echo "ok: every branch renders"

      # The assertion the dead-knob defect needed, and it cannot pass by accident: it reads the
      # rendered serviceAccountName off the workloads, which is the field an operator's IRSA
      # annotation has to land on. Before 2026-08 both branches rendered app-ultimate and the chart
      # emitted its own ServiceAccount either way.
      - name: serviceAccount.create and .name are honoured
        run: |
          set -euo pipefail
          refs_of() { grep 'serviceAccountName:' "$1" | awk '{print $2}' | sort -u | paste -sd, -; }
          count_sa() { grep -c '^kind: ServiceAccount$' "$1" || true; }

          # create: false + a name — the IRSA case. The chart must create nothing, and every
          # workload must name the operator's account.
          helm template app docker/helm \
            --set serviceAccount.create=false --set serviceAccount.name=app-irsa > /tmp/sa-off.yaml
          refs="$(refs_of /tmp/sa-off.yaml)"; made="$(count_sa /tmp/sa-off.yaml)"
          echo "create=false name=app-irsa -> refs=[${refs}] serviceAccounts=${made}"
          if [ "$refs" != "app-irsa" ] || [ "$made" != "0" ]; then
            echo "::error title=serviceAccount values not honoured::With serviceAccount.create=false and name=app-irsa the chart rendered serviceAccountName=[${refs}] and ${made} ServiceAccount object(s); it must render exactly [app-irsa] and 0. An operator configuring IRSA otherwise gets the chart's own account and pods with no cloud identity. fix: every workload must resolve the name through the 'ultimate.serviceAccountName' helper in docker/helm/templates/_helpers.tpl, and templates/service.yaml must gate the ServiceAccount on .Values.serviceAccount.create."
            exit 1
          fi

          # create: true + a name — the chart owns the account, under the name it was given. Read
          # off the Deployments and service.yaml alone: the migrate Job runs as its own hook-created
          # account (the next step), which is not the account an operator's name is for.
          helm template app docker/helm --set serviceAccount.name=my-sa \
            --show-only templates/deployments.yaml > /tmp/sa-on.yaml
          helm template app docker/helm --set serviceAccount.name=my-sa \
            --show-only templates/service.yaml > /tmp/sa-on-svc.yaml
          refs="$(refs_of /tmp/sa-on.yaml)"; made="$(count_sa /tmp/sa-on-svc.yaml)"
          echo "create=true name=my-sa -> refs=[${refs}] serviceAccounts=${made}"
          if [ "$refs" != "my-sa" ] || [ "$made" != "1" ]; then
            echo "::error title=serviceAccount.name not honoured on create::With serviceAccount.create=true and name=my-sa the chart rendered serviceAccountName=[${refs}] and ${made} ServiceAccount object(s); it must render exactly [my-sa] and 1. fix: see the 'ultimate.serviceAccountName' helper in docker/helm/templates/_helpers.tpl."
            exit 1
          fi

      # The rolling-restart contract, rendered. Each assertion names the defect it holds shut:
      #
      #   - the first install hung: the pre-install migrate Job named the chart's ServiceAccount,
      #     which Helm creates only AFTER pre-install hooks, so admission refused every pod
      #     (`serviceaccount "app-ultimate" not found`) until the timeout;
      #   - the worker HPA ran away: every pod publishes the one global `queue_depth`, and a
      #     `Pods` metric averaged it as each pod's own backlog;
      #   - a booting pod was restarted by liveness while it built its islands (no startupProbe);
      #   - the grace period must cover preStop + the framework's readiness grace + its drain
      #     deadline (5 + 5 + 25 = 35s), and the preStop sleep may only render where the API
      #     server knows the field (1.30+; the chart's floor is 1.27).
      - name: the chart drains, boots and scales the way a rolling restart needs
        run: |
          set -euo pipefail
          fail() { echo "::error title=$1::$2"; exit 1; }
          # One document per `---`, so a field is judged on the object that carries it.
          doc_with() { awk -v want="$2" 'BEGIN{RS="\n---\n"} index($0, want) {print; exit}' "$1"; }

          helm template app docker/helm --show-only templates/migrate-job.yaml > /tmp/migrate.yaml
          job_sa="$(doc_with /tmp/migrate.yaml 'kind: Job' | awk '/serviceAccountName:/ {print $2}')"
          sa_doc="$(doc_with /tmp/migrate.yaml 'kind: ServiceAccount')"
          echo "migrate Job runs as [${job_sa}]"
          case "$sa_doc" in *"name: ${job_sa}"*"helm.sh/hook: pre-install,pre-upgrade"*'helm.sh/hook-weight: "-10"'*) ;;
            *) fail "migrate hook account" "the migrate Job runs as '${job_sa}', and no pre-install hook of a lower weight creates it, so a first helm install waits on pods admission refuses. fix: keep the hook ServiceAccount in docker/helm/templates/migrate-job.yaml, weight -10, and point the Job's serviceAccountName at it." ;;
          esac

          helm template app docker/helm --show-only templates/hpa.yaml > /tmp/hpa.yaml
          case "$(doc_with /tmp/hpa.yaml 'name: app-ultimate-worker')" in *"- type: External"*) ;;
            *) fail "worker HPA metric type" "the worker HPA does not read queue_depth as an External metric, so each pod's copy of the one global backlog is averaged as its own. fix: roles.worker.autoscaling.type: External in docker/helm/values.yaml." ;;
          esac
          if helm template app docker/helm --set roles.web.autoscaling.type=Podz >/dev/null 2>&1; then
            fail "autoscaling.type not closed" "an autoscaling.type of 'Podz' rendered. fix: keep the (list \"Pods\" \"External\") check in docker/helm/templates/hpa.yaml."
          fi

          helm template app docker/helm --kube-version 1.30.0 --show-only templates/deployments.yaml > /tmp/deploy-130.yaml
          helm template app docker/helm --kube-version 1.29.0 --show-only templates/deployments.yaml > /tmp/deploy-129.yaml
          deployments="$(grep -c '^kind: Deployment$' /tmp/deploy-130.yaml)"
          startups="$(grep -c '^ *startupProbe:$' /tmp/deploy-130.yaml)"
          prestop_130="$(grep -c '^ *preStop:$' /tmp/deploy-130.yaml || true)"
          prestop_129="$(grep -c '^ *preStop:$' /tmp/deploy-129.yaml || true)"
          echo "deployments=${deployments} startupProbes=${startups} preStop@1.30=${prestop_130} preStop@1.29=${prestop_129}"
          [ "$startups" = "$deployments" ] || fail "startupProbe missing" "${startups} of ${deployments} Deployments carry a startupProbe. fix: every branch of the probes block in docker/helm/templates/_helpers.tpl declares one."
          # Only a role that serves HTTP has Endpoints to leave, so only web carries the sleep (sync too,
          # once enabled); worker and scheduler drain on SIGTERM alone. So the check names web rather
          # than counting, which a sleep lost from web but rendered elsewhere would still pass.
          case "$(doc_with /tmp/deploy-130.yaml 'name: app-ultimate-web')" in *"preStop:"*"sleep:"*) ;;
            *) fail "preStop missing on 1.30" "the web Deployment renders no preStop sleep on Kubernetes 1.30. fix: see the semverCompare block in docker/helm/templates/_helpers.tpl." ;;
          esac
          [ "$prestop_129" = 0 ] || fail "preStop below 1.30" "a preStop sleep rendered on Kubernetes 1.29, which has no lifecycle.preStop.sleep and rejects the object. fix: gate it on semverCompare \">=1.30-0\" .Capabilities.KubeVersion.Version."
          while read -r grace; do
            [ "$grace" -ge 35 ] || fail "grace period too short" "terminationGracePeriodSeconds is ${grace}, below preStop (5) + readiness grace (5) + drain deadline (25) = 35, so the kubelet SIGKILLs a pod that is still draining. fix: raise it in docker/helm/templates/deployments.yaml."
          done < <(awk '/terminationGracePeriodSeconds:/ {print $2}' /tmp/deploy-130.yaml)
          echo "ok: hook account, External worker metric, startup probes, gated preStop, grace >= 35s"

  # The rolling restart, PERFORMED — milestone 11's proof. `container` renders the chart; nothing
  # there can say whether an upgrade drops a request, because that is a property of a running
  # cluster: endpoint removal racing SIGTERM, the readiness grace, keep-alive connections held by
  # kube-proxy to a pod that is going away. This job scaffolds an app on THIS tree's packages,
  # builds its image twice (only BUILD_ID differs), installs it into kind with `x deploy --method
  # helm`, then upgrades it while a pod inside the cluster sends mixed GET and POST through the
  # Service, and fails on a single non-2xx. Every step is `docker/deploy-proof/run.sh`, which a
  # developer runs unchanged on a laptop.
  #
  # Main only, and only when a file that decides the answer moved: kind plus two image builds is
  # minutes, not seconds, and a PR that touches none of those paths cannot change the verdict.
  # Budget: <= 8 minutes; the timeout below is the ceiling, not the target.
  deploy-proof:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A `paths:` filter belongs to a whole workflow, never to one job, so the filter is a step.
      # `github.event.before` is the tip main held before this push; a new ref or a manual run has
      # none worth diffing against, and runs the proof.
      - name: did a file that decides the verdict move?
        id: paths
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            if ! git diff --name-only "$BEFORE" "$GITHUB_SHA" \
              | grep -Eq '^(\.github/workflows/ci\.yml|docker/|packages/cli/src/templates/scaffold-|packages/cli/src/(cmd-deploy|serve|role-|runtime-)|packages/core/src/lifecycle|packages/http/src/(server|stages)\.ts)'; then
              run=false
            fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "deploy proof runs: ${run}"
      - uses: ./.github/actions/setup
        if: steps.paths.outputs.run == 'true'
      - name: kind, helm, kubectl and jq, from the runner image
        if: steps.paths.outputs.run == 'true'
        run: |
          set -euo pipefail
          for tool in docker kind helm kubectl jq; do
            command -v "$tool" >/dev/null || {
              echo "::error title=${tool} missing::The ubuntu-latest runner image no longer ships ${tool}, so the deploy proof cannot run. fix: add a SHA-pinned setup action for ${tool} to this job — the pinning rule and its reason are in .github/actions/setup/action.yml."
              exit 1
            }
          done
          kind version; helm version --short; kubectl version --client | head -1
      - name: install, then upgrade under load — zero failed requests
        if: steps.paths.outputs.run == 'true'
        env:
          WORK: ${{ runner.temp }}/deploy-proof
        run: mkdir -p "$WORK" && bash docker/deploy-proof/run.sh


  # Every package's own tests and its own coverage bar, each in isolation. No lint — the gate's
  # `biome check .` is a strict superset of any per-package lint, and a second one cannot fail alone.
  #
  # This does NOT duplicate `verify`, and the rule at the top of this file is why it has to be
  # argued rather than assumed. `verify` answers "does the framework ship" over the whole tree at
  # once; this answers two questions it structurally cannot:
  #
  #   1. WHICH package is below bar. `x verify`'s `unit` step runs every suite in one process, so a
  #      coverage number over that run is a number for the monorepo, not for a package — and a
  #      package's own sources read 20-50% there purely because every package it imports is loaded
  #      and mostly unexercised (`@ultimat3/cache` read 35% while its own `src/` was at 98.8%).
  #   2. Whether a suite passes IN ISOLATION. Run together, a package whose tests only pass because
  #      another package's preload registered something first is invisible. Run alone, it is a
  #      failure — and `registerFrameworkCatalog`/`registerMailCatalog` were exactly that shape.
  #
  # A FEW shards, never a matrix of one per package, and isolation is not what was traded for it:
  # `coverage-gate.ts --all` spawns a separate `bun test` process per package, which is the
  # isolation, and runs as many at once as the runner has cores. The per-package matrix was 32 jobs
  # — a `package-list` job plus one per package — and GitHub bills each job rounded UP to a whole
  # minute, so ~9s of checkout-and-install plus a 5s suite cost a minute 32 times per run: 33 of
  # the ~40 runner-minutes one push to `main` cost, measured 2026-09-16, for about nine minutes of
  # actual work. One job was 138-183 s on main, 2026-10-01; `--shard i/n` halves the package list
  # per runner and keeps the script as the only thing that knows what the list is — no package
  # name is written here, and `--all` still reports every package's findings, never only the first
  # to break.
  #
  # No services, deliberately: `scripts/lib/coverage-pins.ts` explains that the pins are measured
  # with no Postgres, no Redis and no NATS so the number is identical on a laptop and on a runner.
  # The live paths are the gate's `live` step, which does have them.
  packages:
    name: packages (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: tests + coverage per package, each in its own process, all cores
        env:
          SHARD: ${{ matrix.shard }}
        run: bun run scripts/coverage-gate.ts --all --shard "$SHARD"
