name: deploy-social-demo

# Builds and publishes the social demo's image. It does NOT deploy: this repo holds no cluster
# credentials, and it never will. The handoff is an image digest — the cluster's image updater
# watches the registry, patches the live app, and the GitOps controller rolls the pods.
#
# The tag format is the contract. The updater matches `sha-<7>` and nothing else, so if this
# workflow stops emitting that tag, deployment freezes silently on the old digest and nothing
# reports an error. Do not "simplify" the tag list.

# Triggered by ci.yml FINISHING, never by the push both workflows used to start from. The publish
# used to poll for `reference-app-verify`'s verdict for up to 10 minutes while that job's own
# timeout is 15, so a slow green gate read as "no verdict" and the image was not published; and a
# separate workflow on the same push is not a dependency (the `main-protection` ruleset requires only `verify`). A
# `workflow_run` of ci.yml starts after the verdict exists, for exactly the commit it judged.
#
# No `paths:` filter — `workflow_run` has none, so every green ci.yml run on main starts this. It
# PUBLISHES only when a path the image ships changed since the last green run of this workflow
# (`scripts/lib/ci/deploy-due.ts`: everything ships but what the image's .dockerignore drops, prose
# and tooling — so a new directory ships, and the framework is never stale). The baseline is the
# commit named in that run's title (`run-name`, below); none, a compare that fails, a capped file
# list, a commit not ahead of it and every dispatch publish. A skipped publish skips `served` too.
run-name: deploy-social-demo ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  # Not the insecure shape: every job is gated on `workflow_run.event == 'push'`
  # from this repository, so no fork's pull request reaches it.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Serialize, and never cancel a publish mid-flight — a half-pushed manifest is worse than a queue.
concurrency:
  # Keyed on what triggered ci: a scheduled ci run, every job here skipped, must never replace a
  # push's deploy pending in the group.
  group: deploy-social-demo-${{ github.event.workflow_run.event || github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read
  # Read-only, and only so this workflow can read the app gate's verdict on the commit it is about
  # to publish. See the `build` job's first real step.
  checks: read

env:
  IMAGE: registry.digitalocean.com/developerz-ai/ultimate-social

jobs:
  # No `verify` job here, deliberately. `ci.yml` runs the gate on every push to main, so a second
  # run in this workflow is the duplicate path axiom 1 forbids — and it cost exactly what it
  # duplicated: it added ~70s to every publish and went red on a flake that the gate on the same
  # commit had already passed, holding back an image whose source was proven green.
  #
  # As of 2026-08 that gate covers THIS app: `ci.yml`'s `reference-app-verify` job runs
  # `x verify` in dummy/social-media-clone against the ratchet in scripts/lib/gated-apps.ts — on a
  # runner of its own since 2026-10-01, so the check this workflow reads is that app's and no other
  # app's. Until then the image published here was the only place the app was exercised at all.
  #
  # Covering the app is not the same as gating the image, and this workflow used to confuse the
  # two: a separate workflow is not a dependency, and `main`'s ruleset requires only `verify`
  # (`gh api repos/developerz-ai/ultimate/rulesets`, As of 2026-11-15). So the publish now starts from ci.yml's
  # completion and READS the gate's verdict for its own commit before it pushes anything — not a
  # second run of the gate, which is the duplicate path axiom 1 forbids, but the one bit that run
  # produced. Fails closed: no `success` verdict does not publish.
  #
  # What protects production past that is the tag contract: the image updater only rolls a
  # `sha-<7>` tag, and this workflow only pushes one for a commit that is already on main.
  build:
    # A completed ci.yml run on main that passed, from a push to THIS repository — never a fork's
    # pull_request run, whose head this job would otherwise check out with the registry secret in
    # scope. A dispatch has no workflow_run and is gated by the verdict step below alone.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # What `served` checks the live demo against: the tag pushed, and whether it is main's tip.
    outputs:
      short: ${{ steps.built.outputs.short }}
      latest: ${{ steps.tip.outputs.latest }}
      due: ${{ steps.due.outputs.due }}
    environment:
      name: social-demo
      url: https://social-media.ultimate.demo.developerz.ai
    steps:
      # The commit ci.yml judged, not the tip of main when this run started: two pushes in quick
      # succession would otherwise build the second under the first one's verdict. The image tag
      # below is `git rev-parse HEAD`, so it names exactly the commit CI passed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: resolve the built commit
        id: built
        run: |
          sha="$(git rev-parse HEAD)"
          {
            echo "sha=$sha"
            echo "short=sha-$(printf '%.7s' "$sha")"
          } >> "$GITHUB_OUTPUT"

      # Only a commit ON main publishes, and only main's TIP is `:latest`. A dispatch builds
      # whichever ref was selected, so a branch commit — even one ci.yml passed on its pull
      # request — reached the registry, `:latest` included; and a `workflow_run` for an older push
      # that finished after a newer one moved `:latest` backwards. `ahead_by` is the commits this
      # one has that main lacks: 0 is on main, and a failed call reads as not-on-main (fail closed).
      # A main that cannot be read only withholds `:latest`, never the `sha-<7>` tags.
      - name: on main, and whether it is main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.built.outputs.sha }}
        run: |
          set -euo pipefail
          main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha || true)"
          ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${SHA}" --jq .ahead_by || echo 1)"
          if [ "$ahead" != 0 ]; then
            echo "::error::${SHA} is not on main (${ahead} commit(s) main does not have) — not publishing. Dispatch this workflow from main, for a commit ci.yml passed there."
            exit 1
          fi
          latest=false
          [ "$main" = "$SHA" ] && latest=true
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "ok: ${SHA} is on main; main's tip: ${latest}"

      # The gate's verdict on THIS commit, read once, before a single layer is pushed. Under
      # `workflow_run` ci.yml has already concluded, so the answer is final and this is the check
      # that this app's `reference-app-verify` in particular passed; under a dispatch it is the
      # only gate, and a commit ci.yml never judged — an ungated ref — has no verdict and does not
      # publish. No polling: nothing here is waiting for a run that might still be going.
      #
      # CHECK is the `name:` ci.yml gives the matrix job for this app, spaces and parentheses
      # included, so the check runs are read once and matched by name in jq rather than in a query
      # string. `scripts/ci-workflow-shape.test.ts` holds the two spellings to each other.
      #
      # A push whose tree a green pull-request run already tested skips ci.yml's app jobs (plan
      # 101, 33-ops-ci): its `tested` job answered `x ci tested` true. A skipped app gate is accepted
      # ONLY then — REUSED_BY's check concluded success and every check under CHECK's job name
      # concluded skipped — because `tested` answering true is the one cause of a skip there
      # (`scripts/ci-workflow-shape-tested.test.ts` pins it). A skipped matrix job may carry its
      # unexpanded name, so the skip is read by the job-name prefix. The PR run that tested this
      # tree passed the same app gate; anything else — red, cancelled, absent, a mix — refuses.
      - name: require the app gate's verdict for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.built.outputs.sha }}
          CHECK: reference-app-verify (dummy/social-media-clone)
          REUSED_BY: tested
        run: |
          set -euo pipefail
          # `|| echo '[]'`: a transient API failure is "no verdict", which the check below refuses
          # by name rather than as a bare set -e exit — the pattern release.yml's gate uses.
          checks="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" -f per_page=100 \
            --jq '[.check_runs[] | select(.status == "completed") | {name, conclusion, completed_at}]' \
            || echo '[]')"
          verdict() {
            jq -r --arg name "$1" \
              '[.[] | select(.name == $name)] | sort_by(.completed_at) | last | .conclusion // ""' <<< "$checks"
          }
          conclusion="$(verdict "$CHECK")"
          if [ "$conclusion" = success ]; then
            echo "ok: ${CHECK} passed for ${SHA}"
            exit 0
          fi
          reused="$(verdict "$REUSED_BY")"
          under="$(jq -r --arg job "${CHECK%% (*}" \
            '[.[] | select(.name | startswith($job)) | .conclusion] | unique | join(",")' <<< "$checks")"
          if [ "$reused" = success ] && [ "$under" = "skipped" ]; then
            echo "ok: ${SHA}'s tree was tested green by its pull request; ${CHECK} was reused, not re-run"
            exit 0
          fi
          echo "::error::${CHECK} concluded '${conclusion:-no verdict}' for ${SHA} (${REUSED_BY}: '${reused:-no verdict}', ${CHECK%% (*}: '${under:-none}') — not publishing. Dispatch this only for a commit ci.yml has passed."
          exit 1

      # Bun alone, never the setup composite: `bun install` would run every dependency's install
      # script in the job that logs in to the registry below. `deploy-due.ts` imports nothing. No
      # cache either: nothing a cache restores reaches the job that pushes the image.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
          no-cache: true

      # Did anything the image ships change since the last green publish? Fail-open: every `gh`
      # failure is "no baseline" or "no comparison", and both publish.
      - name: does a shipped path differ from the last publish
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.built.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "a dispatch always publishes"; echo "due=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-social-demo.yml --branch main \
            --status success --limit 20 --json displayTitle \
            --jq '[.[].displayTitle | capture("(?<sha>[0-9a-f]{40})$").sha][0] // empty' || true)"
          compare="$RUNNER_TEMP/compare.json"
          if [ -n "$base" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/compare/${base}...${SHA}" \
              --jq '{status, files: [.files[]? | .filename, (.previous_filename // empty)]}' > "$compare" || rm -f "$compare"
          fi
          bun run scripts/lib/ci/deploy-due.ts --app social "$compare" > "$RUNNER_TEMP/due.json"
          echo "last publish: ${base:-none}; $(jq -r '.summary' "$RUNNER_TEMP/due.json")"
          jq -r '.data.shipped[:20][] | "  " + .' "$RUNNER_TEMP/due.json"
          echo "due=$(jq -r '.data.due' "$RUNNER_TEMP/due.json")" >> "$GITHUB_OUTPUT"

      # Third-party actions are SHA-pinned — the rule and its reason are in
      # .github/actions/setup/action.yml. This workflow holds a registry credential.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.due.outputs.due != 'false'

      # The DO API token is used as both username and password — that is what the registry expects.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.due.outputs.due != 'false'
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.due.outputs.due != 'false'
        with:
          # Root context: the demo imports the framework packages from this tree, not from npm.
          context: .
          file: dummy/social-media-clone/docker/Dockerfile.monorepo
          push: true
          build-args: |
            BUILD_ID=${{ steps.built.outputs.short }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.built.outputs.short }}
            ${{ env.IMAGE }}:${{ steps.built.outputs.sha }}
            ${{ steps.tip.outputs.latest == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha,scope=ultimate-social
          cache-to: type=gha,scope=ultimate-social,mode=max
          # Both off deliberately: the attestation manifests they add confuse the image updater's
          # tag resolution, and this image is not consumed by anything that verifies them.
          provenance: false
          sbom: false

      - name: prove the pushed tags resolve
        if: steps.due.outputs.due != 'false'
        env:
          SHORT: ${{ steps.built.outputs.short }}
          SHA: ${{ steps.built.outputs.sha }}
          LATEST: ${{ steps.tip.outputs.latest }}
        run: |
          refs=("${IMAGE}:${SHORT}" "${IMAGE}:${SHA}")
          if [ "$LATEST" = true ]; then refs+=("${IMAGE}:latest"); fi
          for ref in "${refs[@]}"; do
            docker buildx imagetools inspect "$ref" > /dev/null
            echo "ok $ref"
          done

  # The other half of the tag contract above: does the demo now SERVE what `build` published? A
  # frozen updater used to report nothing; this reds the run instead, named by
  # X_DEPLOY_BUILD_MISMATCH, and the daily `health` brief reads a red workflow. Only for main's tip:
  # the updater rolls the newest `sha-<7>`, so an older commit's build is never expected to answer.
  # `--timeout 10m` covers the updater's poll (about two minutes) and the roll behind it. No
  # DATABASE_URL here, so the queue grade is skipped and says so: HTTP alone. Not after a skipped
  # publish: no new tag exists, and the demo rightly still serves the last one.
  served:
    needs: build
    if: needs.build.outputs.latest == 'true' && needs.build.outputs.due != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: x deploy verify — the demo answers with the build just published
        working-directory: dummy/social-media-clone
        env:
          BUILD: ${{ needs.build.outputs.short }}
        run: bunx x deploy verify --url https://social-media.ultimate.demo.developerz.ai --build "$BUILD" --timeout 10m --json
