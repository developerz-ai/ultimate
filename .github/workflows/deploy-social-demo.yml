name: deploy-social-demo

# Builds and publishes the social demo's image. It does NOT deploy: this repo holds no cluster
# credentials, and it never will. The handoff is an image digest — the cluster's image updater
# watches the registry, patches the live app, and the GitOps controller rolls the pods.
#
# The tag format is the contract. The updater matches `sha-<7>` and nothing else, so if this
# workflow stops emitting that tag, deployment freezes silently on the old digest and nothing
# reports an error. Do not "simplify" the tag list.

# Triggered by ci.yml FINISHING, never by the push both workflows used to start from. The publish
# used to poll for `reference-app-verify`'s verdict for up to 10 minutes while that job's own
# timeout is 15, so a slow green gate read as "no verdict" and the image was not published; and a
# separate workflow on the same push is not a dependency (`main` carries no branch protection). A
# `workflow_run` of ci.yml starts after the verdict exists, for exactly the commit it judged.
#
# No `paths:` filter — `workflow_run` has none, so every green ci.yml run on main publishes. That
# trades a rebuild on a docs-only push (layer-cached) for never shipping a stale framework: the
# demo links every package through workspace symlinks, and the old filter had to list them all.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Serialize, and never cancel a publish mid-flight — a half-pushed manifest is worse than a queue.
concurrency:
  group: deploy-social-demo
  cancel-in-progress: false

permissions:
  contents: read
  # Read-only, and only so this workflow can read the app gate's verdict on the commit it is about
  # to publish. See the `build` job's first real step.
  checks: read

env:
  IMAGE: registry.digitalocean.com/developerz-ai/ultimate-social

jobs:
  # No `verify` job here, deliberately. `ci.yml` runs the gate on every push to main, so a second
  # run in this workflow is the duplicate path axiom 1 forbids — and it cost exactly what it
  # duplicated: it added ~70s to every publish and went red on a flake that the gate on the same
  # commit had already passed, holding back an image whose source was proven green.
  #
  # As of 2026-08 that gate covers THIS app: `ci.yml`'s `reference-app-verify` job runs
  # `x verify` in dummy/social-media-clone against the ratchet in scripts/lib/gated-apps.ts. Until
  # then the image published here was the only place the app was exercised at all.
  #
  # Covering the app is not the same as gating the image, and this workflow used to confuse the
  # two: a separate workflow is not a dependency, and `main` carries no branch protection (checked
  # 2026-08 — `branches/main/protection` is 404). So the publish now starts from ci.yml's
  # completion and READS the gate's verdict for its own commit before it pushes anything — not a
  # second run of the gate, which is the duplicate path axiom 1 forbids, but the one bit that run
  # produced. Fails closed: no `success` verdict does not publish.
  #
  # What protects production past that is the tag contract: the image updater only rolls a
  # `sha-<7>` tag, and this workflow only pushes one for a commit that is already on main.
  build:
    # A completed ci.yml run on main that passed, from a push to THIS repository — never a fork's
    # pull_request run, whose head this job would otherwise check out with the registry secret in
    # scope. A dispatch has no workflow_run and is gated by the verdict step below alone.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: social-demo
      url: https://social-media.ultimate.demo.developerz.ai
    steps:
      # The commit ci.yml judged, not the tip of main when this run started: two pushes in quick
      # succession would otherwise build the second under the first one's verdict. The image tag
      # below is `git rev-parse HEAD`, so it names exactly the commit CI passed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: resolve the built commit
        id: built
        run: |
          sha="$(git rev-parse HEAD)"
          {
            echo "sha=$sha"
            echo "short=sha-$(printf '%.7s' "$sha")"
          } >> "$GITHUB_OUTPUT"

      # The gate's verdict on THIS commit, read once, before a single layer is pushed. Under
      # `workflow_run` ci.yml has already concluded, so the answer is final and this is the check
      # that `reference-app-verify` in particular passed; under a dispatch it is the only gate, and
      # a commit ci.yml never judged — an ungated ref — has no verdict and does not publish. No
      # polling: nothing here is waiting for a run that might still be going.
      - name: require the app gate's verdict for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.built.outputs.sha }}
          CHECK: reference-app-verify
        run: |
          set -euo pipefail
          conclusion="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=${CHECK}" \
            --jq '[.check_runs[] | select(.status == "completed")]
                    | sort_by(.completed_at) | last | .conclusion // ""' || true)"
          # `|| true`: a transient API failure is "no verdict", which the check below refuses by
          # name rather than as a bare set -e exit — the pattern release.yml's gate uses.
          if [ "$conclusion" != success ]; then
            echo "::error::${CHECK} concluded '${conclusion:-no verdict}' for ${SHA} — not publishing. Dispatch this only for a commit ci.yml has passed."
            exit 1
          fi
          echo "ok: ${CHECK} passed for ${SHA}"

      # Third-party actions are SHA-pinned — the rule and its reason are in
      # .github/actions/setup/action.yml. This workflow holds a registry credential.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The DO API token is used as both username and password — that is what the registry expects.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Root context: the demo imports the framework packages from this tree, not from npm.
          context: .
          file: dummy/social-media-clone/docker/Dockerfile.monorepo
          push: true
          build-args: |
            BUILD_ID=${{ steps.built.outputs.short }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.built.outputs.short }}
            ${{ env.IMAGE }}:${{ steps.built.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=ultimate-social
          cache-to: type=gha,scope=ultimate-social,mode=max
          # Both off deliberately: the attestation manifests they add confuse the image updater's
          # tag resolution, and this image is not consumed by anything that verifies them.
          provenance: false
          sbom: false

      - name: prove the pushed tags resolve
        env:
          SHORT: ${{ steps.built.outputs.short }}
          SHA: ${{ steps.built.outputs.sha }}
        run: |
          for ref in "${IMAGE}:${SHORT}" "${IMAGE}:${SHA}" "${IMAGE}:latest"; do
            docker buildx imagetools inspect "$ref" > /dev/null
            echo "ok $ref"
          done
