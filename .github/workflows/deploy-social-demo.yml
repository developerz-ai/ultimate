name: deploy-social-demo

# Builds and publishes the social demo's image. It does NOT deploy: this repo holds no cluster
# credentials, and it never will. The handoff is an image digest — the cluster's image updater
# watches the registry, patches the live app, and the GitOps controller rolls the pods.
#
# The tag format is the contract. The updater matches `sha-<7>` and nothing else, so if this
# workflow stops emitting that tag, deployment freezes silently on the old digest and nothing
# reports an error. Do not "simplify" the tag list.

on:
  push:
    branches: [main]
    paths:
      # The demo links the framework through workspace symlinks, so a change to any package it
      # imports changes the image. Narrowing this to `dummy/**` would ship a stale framework.
      - 'dummy/social-media-clone/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-social-demo.yml'
  workflow_dispatch:

# Serialize, and never cancel a publish mid-flight — a half-pushed manifest is worse than a queue.
concurrency:
  group: deploy-social-demo
  cancel-in-progress: false

permissions:
  contents: read
  # Read-only, and only so this workflow can read the app gate's verdict on the commit it is about
  # to publish. See the `build` job's first real step.
  checks: read

env:
  IMAGE: registry.digitalocean.com/developerz-ai/ultimate-social

jobs:
  # No `verify` job here, deliberately. `ci.yml` runs the gate on every push to main, so a second
  # run in this workflow is the duplicate path axiom 1 forbids — and it cost exactly what it
  # duplicated: it added ~70s to every publish and went red on a flake that the gate on the same
  # commit had already passed, holding back an image whose source was proven green.
  #
  # As of 2026-08 that gate covers THIS app: `ci.yml`'s `reference-app-verify` job runs
  # `x verify` in dummy/social-media-clone against the ratchet in scripts/lib/gated-apps.ts. Until
  # then the image published here was the only place the app was exercised at all.
  #
  # Covering the app is not the same as gating the image, and this workflow used to confuse the
  # two: a separate workflow is not a dependency, `main` carries no branch protection (checked
  # 2026-08 — `branches/main/protection` is 404), and both workflows start from the same push. So
  # the publish now READS the gate's verdict for its own commit before it pushes anything — not a
  # second run of the gate, which is the duplicate path axiom 1 forbids, but the one bit that run
  # produced. Fails closed: no verdict inside the window does not publish.
  #
  # What protects production past that is the tag contract: the image updater only rolls a
  # `sha-<7>` tag, and this workflow only pushes one for a commit that is already on main.
  build:
    runs-on: ubuntu-latest
    # 20 for the build, plus the ≤10 the gate wait below can spend.
    timeout-minutes: 30
    environment:
      name: social-demo
      url: https://social-media.ultimate.demo.developerz.ai
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: resolve the built commit
        id: built
        run: |
          sha="$(git rev-parse HEAD)"
          {
            echo "sha=$sha"
            echo "short=sha-$(printf '%.7s' "$sha")"
          } >> "$GITHUB_OUTPUT"

      # The gate's verdict on THIS commit, before a single layer is pushed. `ci.yml` runs on the
      # same push, so the check usually appears within seconds and concludes in under a minute
      # (measured 24-53s); the window is 10 minutes so a queued runner is waited out rather than
      # published around. A conclusion that is not `success` — and a commit that never gets one,
      # which is what a `workflow_dispatch` off an ungated ref looks like — stops the publish.
      - name: require the app gate's verdict for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.built.outputs.sha }}
          CHECK: reference-app-verify
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            # `|| true`: a transient API failure is "no verdict yet", not a publish. Under
            # `set -e` the bare substitution would end the job on one 502 and read as a red gate.
            conclusion="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=${CHECK}" \
              --jq '[.check_runs[] | select(.status == "completed")]
                      | sort_by(.completed_at) | last | .conclusion // ""' || true)"
            case "$conclusion" in
              success)
                echo "ok: ${CHECK} passed for ${SHA}"
                exit 0
                ;;
              '')
                echo "attempt ${attempt}/40: ${CHECK} has no verdict yet for ${SHA}"
                sleep 15
                ;;
              *)
                echo "::error::${CHECK} concluded '${conclusion}' for ${SHA} — not publishing"
                exit 1
                ;;
            esac
          done
          echo "::error::${CHECK} reported no verdict for ${SHA} within 10 minutes — not publishing"
          exit 1

      - uses: docker/setup-buildx-action@v3

      # The DO API token is used as both username and password — that is what the registry expects.
      - uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Root context: the demo imports the framework packages from this tree, not from npm.
          context: .
          file: dummy/social-media-clone/docker/Dockerfile.monorepo
          push: true
          build-args: |
            BUILD_ID=${{ steps.built.outputs.short }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.built.outputs.short }}
            ${{ env.IMAGE }}:${{ steps.built.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=ultimate-social
          cache-to: type=gha,scope=ultimate-social,mode=max
          # Both off deliberately: the attestation manifests they add confuse the image updater's
          # tag resolution, and this image is not consumed by anything that verifies them.
          provenance: false
          sbom: false

      - name: prove the pushed tags resolve
        env:
          SHORT: ${{ steps.built.outputs.short }}
          SHA: ${{ steps.built.outputs.sha }}
        run: |
          for ref in "${IMAGE}:${SHORT}" "${IMAGE}:${SHA}" "${IMAGE}:latest"; do
            docker buildx imagetools inspect "$ref" > /dev/null
            echo "ok $ref"
          done
