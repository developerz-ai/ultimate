name: flake-hunt

# Which tests pass only in the order the gate happens to run them? Every night the `unit` and `live`
# suites run twice each, Bun shuffling file and test order from a recorded seed
# (`bun test --randomize --seed`), and each test that fails gets ONE `flake-hunt` issue — found
# again by its title, so a test red every night collects comments instead of duplicates — naming
# the seed and the command that replays its round in the same order (`scripts/flake-hunt.ts`).
#
# Its own workflow, never a `ci` job and never a gate: four rounds of the two slowest suites cost far
# more than `ci`'s five minutes, and a red night is a lead to read, not a merge to block. Its run
# conclusion is the `flake-hunt` row of `scripts/health.ts`. Free runners only.

on:
  schedule:
    # Nightly, clear of the daily registry audit (06:17) and the security-channel check (07:43).
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: replay one seed in every round (empty = a fresh seed per round)
        required: false
        default: ''

concurrency:
  group: flake-hunt
  cancel-in-progress: false

# Read-only by default; the one job that files issues widens it to `issues: write` for itself.
permissions:
  contents: read

jobs:
  round:
    name: round ${{ matrix.round }} (${{ matrix.suite }})
    runs-on: ubuntu-latest
    # A runaway kill-switch: one round of `unit` on one runner is the gate's three unit shards in
    # sequence, ~15 minutes; the script's own deadline (50 min) fires first.
    timeout-minutes: 60
    env:
      # The gate's own width rule: one test worker per core on a runner that is the job's alone.
      ULTIMATE_TEST_MEMORY_BUDGET: 5g
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, live]
        # Two rounds since 2026-11-27 (three were ~83 billed minutes a night, ~60 of them `unit`):
        # every round shuffles under a fresh seed, so the seven nights the `tests-deterministic` row
        # reads (scripts/finished-github.ts) are still fourteen orders per suite.
        round: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests that read origin/main's tip and the two newest release tags find them, as in the
      # gate's parts (`ci.yml`); a missing ref would be a red round that is no flake.
      - name: fetch origin/main's tip and the two newest release tags
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          refs=""
          for tag in $(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -2); do
            refs="$refs +refs/tags/$tag:refs/tags/$tag"
          done
          # shellcheck disable=SC2086
          [ -z "$refs" ] || git fetch --no-tags --depth=1 origin $refs
      - uses: ./.github/actions/setup
      # Every service, for both suites: `unit` reads the test Postgres and `live` reads them all.
      # The file a laptop starts; `--wait` returns once every healthcheck passed.
      - name: test services, in RAM
        run: |
          docker compose -f docker/docker-compose.test.yml up -d --wait
          grep -E '^TEST_[A-Z_]+=' docker/test-services.env >> "$GITHUB_ENV"
      - name: one shuffled round
        env:
          SUITE: ${{ matrix.suite }}
          ROUND: ${{ matrix.round }}
          SEED: ${{ inputs.seed }}
        # `pipefail`: without it `tee` decides the step's exit, a red round reads green, and the
        # run's conclusion — what the health row reads — lies.
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/rounds"
          bun run scripts/flake-hunt.ts run --suite "$SUITE" --round "$ROUND" ${SEED:+--seed "$SEED"} --json \
            | tee "$RUNNER_TEMP/rounds/$SUITE-$ROUND.json" | jq -r '.summary, (.findings[] | "  \(.cause)\n    fix: \(.fix)")'
      # Uploaded when the round is RED too: the red document is the one the filing job reads.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: flake-hunt-${{ matrix.suite }}-${{ matrix.round }}
          path: ${{ runner.temp }}/rounds/${{ matrix.suite }}-${{ matrix.round }}.json
          if-no-files-found: error
          retention-days: 14

  file:
    needs: round
    # After red rounds too — they are the ones with something to file.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # `persist-credentials: false`: the job's `issues: write` token would otherwise sit in
      # .git/config through `bun install`, readable by every dependency's install script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flake-hunt-*
          path: ${{ runner.temp }}/rounds
          merge-multiple: true
      - name: one issue per failing test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          rounds=("$RUNNER_TEMP"/rounds/*.json)
          if [ "${#rounds[@]}" -eq 0 ]; then echo "no round wrote a document: nothing to file"; exit 1; fi
          bun run scripts/flake-hunt.ts file "${rounds[@]}"
