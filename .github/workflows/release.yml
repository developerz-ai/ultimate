name: release

# Publishes every @ultimat3 package to npm using OIDC trusted publishing.
# npm mints a short-lived token from the GitHub Actions id-token and verifies it against the
# trusted publisher configured for each package on npmjs.com. Provenance is automatic.
#
# Prerequisites (one-time, per package, on npmjs.com — see PUBLISHING.md):
#   1. The package must already exist on the registry (bootstrap the first version by hand).
#   2. Package → Settings → Trusted Publisher → GitHub Actions:
#        Organization/user: developerz-ai
#        Repository:        ultimate
#        Workflow filename: release.yml
#        Environment:       npm-publish
#
# Two things must be TRUE outside this file for the gate below to be a gate, and both are named in
# PUBLISHING.md as human steps: the `npm-publish` environment must exist with its `v*` deployment
# tag rule (it carries NO required reviewers, by the owner's decision of 2026-09-05 — the `check`
# job below and ci.yml's `verify` are the gate), and every package in the derived list needs a
# trusted publisher plus its first manual publish. Trusted publishing cannot bootstrap a package that does not exist yet, so a
# package added AFTER a release run is unpublished until a human bootstraps it — and this run will
# reach it and abort with everything ahead of it already published irreversibly.
# `bun run scripts/registry-audit.ts` answers whether that is owed, before a release finds out.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.3.0. Must match every package.json in the tree.'
        required: true
        type: string

# ONE queue for every release, and a running one is never cancelled — npm publishes are
# irreversible. The group was per-ref (`release-<tag>`), which serialized nothing across versions:
# two Releases cut minutes apart published side by side, and `latest` on each package went to
# whichever finished last, so a lockstep set could end up split across two versions. Now a second
# release waits for the first to finish. GitHub keeps ONE waiting run per group, so a third cut
# while one runs and one waits replaces the waiting one: it shows as cancelled, never half-published
# (`check` runs before any publish), and `workflow_dispatch` with its version re-runs it — `publish`
# skips every package npm already holds.
concurrency:
  group: release
  cancel-in-progress: false

# Workflow-wide: read only. `id-token: write` IS the repository's npm publishing identity, so it is
# granted to the `publish` job alone — the `check` job runs `bun install`, and a dependency's code
# has no business holding a token that can mint an npm credential. `publish` installs too, with
# `--ignore-scripts`, so no dependency code runs beside the token there either.
permissions:
  contents: read

jobs:
  # Everything that can refuse a release for free, BEFORE the `npm-publish` deployment exists. It
  # used to be the first steps of `publish`, so a Release cut before the bump (developerz-ai[bot]
  # makes those, on a lightweight tag) requested the protected deployment first and failed
  # `--check` after: runs 35827049144 (v21.0.0) and 35789073198 (v20.2.2). No environment here,
  # and no `id-token`, so a refusal costs nothing and asks nobody.
  check:
    runs-on: ubuntu-latest
    # ≤20 of it is the wait for ci.yml's run below; the rest is install and `--check`.
    timeout-minutes: 30
    permissions:
      contents: read
      # Read ci.yml's runs and jobs for the tagged commit. Nothing else.
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      # First, before checkout: `workflow_dispatch` accepts any ref the Actions UI will list, and
      # `github.ref` is the only thing that says which one this is. A release published for a tag
      # runs at `refs/tags/<tag>`, which is the ONLY shape a publish may have — the version below is
      # read from that tag, and a branch has no version to read.
      - name: refuse to publish from anything that is not a release tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/v*) echo "ok: publishing from $REF" ;;
            *)
              echo "::error::refusing to publish from $REF — an npm publish cannot be undone, so it runs from a vX.Y.Z tag only. Tag the release commit with an ANNOTATED tag (git tag -a v<version> -m v<version> && git push origin v<version> — --follow-tags skips a lightweight one), then publish a GitHub Release for it, or dispatch this workflow with that tag selected."
              exit 1
              ;;
          esac

      # SHA-pinned, `actions/` included — the repo rule in .github/actions/setup/action.yml, and
      # this workflow is the one it matters most for: it ends in an irreversible publish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repo's own composite — Bun, the install cache, a frozen install — as every other job
      # starts. Acceptable HERE and only here: this job holds no `id-token`. The `publish` job below
      # keeps its own SHA-pinned steps and no cache, because it does.
      - uses: ./.github/actions/setup

      # ONE source for the version: the tag this run is checked out at. Both events supply it —
      # a published release runs at `refs/tags/<tag_name>`, and a dispatch runs at whichever ref was
      # selected, which step 1 has already narrowed to `refs/tags/v*`. The `version` input is a
      # confirmation, not a second source: a dispatcher who selects `v1.2.0` and types `1.3.0` has
      # two different releases in mind, and the run stops rather than picking one.
      - name: resolve the version being published
        id: release
        env:
          REF: ${{ github.ref }}
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REF#refs/tags/v}"
          if [ -n "${INPUT:-}" ] && [ "${INPUT#v}" != "$version" ]; then
            echo "::error::this run is checked out at $REF but the version input says ${INPUT} — select the tag you mean, or type the version that tag carries"
            exit 1
          fi
          echo "publishing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # `verify`'s lockstep rule compares the packages to EACH OTHER, so manifests all reading 1.2.0
      # pass it while the tag says v1.10.1 — and every publish then dies EPUBLISHCONFLICT on a
      # version already on the registry. `As of 2026-08` this tree was in that state. It is also
      # what refuses a Release cut before the bump, which is why it lives in this job.
      # Through `env:`, as every other value in this file: the version is the tag's text, and an
      # expression spliced into `run:` is shell source, not a string.
      - name: the repo is stamped at the version this tag claims
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bun run scripts/release.ts --check "$VERSION" --json

      # The gate's verdict on THIS commit, read — never re-run. This job used to run
      # `scripts/verify.ts` itself, on a runner with no Postgres, NATS or Redis and no
      # `E2E_BROWSER_REQUIRED`: the 21.0.0 run executed 10 of 342 live tests where ci.yml's
      # gate ran 278, and still called the tag verified. ci.yml runs on every push to main, so the
      # release commit already has the real answer.
      #
      # The RUN's conclusion, not the `verify` job's. `verify` is the framework gate alone; a tag
      # whose tracked apps, scaffolds, per-package coverage or container build were red on the same
      # run still published, because none of those jobs is the merge. The run concludes `success`
      # only when every job did — a `skipped` one (`deploy-proof` off main) counts as passing, as
      # GitHub reports it: run 37101705560 (a pull request) skipped it and concluded `success`.
      # Polled because a Release published the minute its commit lands races that run
      # (`deploy-proof`, the longest job on main, times out at 15 min; the window is 20). Fails
      # closed: no run, a run not yet `completed`, or any conclusion but `success` — `cancelled`
      # included — does not publish.
      - name: require ci.yml's run to have passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 40); do
            # `|| true`: a transient API failure is "no verdict yet", not a publish and not a red.
            read -r run_id status conclusion <<<"$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.id // "") \(.status // "") \(.conclusion // "")"' || true)"
            # A run still going reports a conclusion of null; one that has none yet is not a verdict.
            [ "$status" = completed ] || conclusion=""
            case "$conclusion" in
              success)
                echo "ok: ci.yml run ${run_id} passed for ${sha}"
                exit 0
                ;;
              '')
                echo "attempt ${attempt}/40: ci.yml has no completed run yet for ${sha}"
                sleep 30
                ;;
              *)
                echo "::error::ci.yml run ${run_id} concluded '${conclusion}' for ${sha} — not publishing. Re-run its failed jobs (gh run rerun ${run_id} --failed), then re-run this workflow."
                exit 1
                ;;
            esac
          done
          echo "::error::ci.yml reported no completed run for ${sha} within 20 minutes — not publishing. A tag on a commit that was never pushed to main has no ci.yml run at all."
          exit 1

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # REQUIRED for OIDC — lets npm mint a token from this run
    # The gate on the one irreversible job in the repo. This job holds `id-token: write`, which IS
    # the repository's npm publishing identity — so before it, anyone who could dispatch a workflow
    # could publish to @ultimat3 from an arbitrary branch, with provenance attesting that it came
    # from here. A deployment environment is the only GitHub control that can hold a job with that
    # permission; its protections (a deployment tag rule of `v*`, and reviewers if ever configured)
    # are repository settings, not YAML, and are listed in PUBLISHING.md. The `check` job is the
    # half that takes effect with no settings at all, and this job cannot start without it.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/org/ultimat3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `registry-url:` on purpose. It writes an .npmrc containing
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and with no NODE_AUTH_TOKEN in the environment that resolves to an empty
      # credential, which npm prefers over the OIDC exchange — publish then fails
      # ENEEDAUTH on a workflow that is otherwise configured correctly. Trusted
      # publishing needs no .npmrc at all.
      # Node must be >= 22.14.0 for trusted publishing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      # Pinned (not @latest): npm 11.6.x regressed the provenance path — a global install lands
      # without a resolvable `sigstore` module, so `npm publish` with provenance dies on
      # "Cannot find module 'sigstore'". 11.5.2 is the last release before that regression and
      # satisfies the trusted-publishing minimum. Revisit when a fixed latest ships.
      - name: upgrade npm
        run: npm install -g npm@11.5.2

      # SHA-pinned and exact-patch-pinned for the reasons in .github/actions/setup/action.yml, and this
      # is the job the rule exists for: it holds `id-token: write`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      # `--ignore-scripts`: this job holds `id-token: write`, and a dependency's install script
      # (lefthook's postinstall, which Bun trusts by default) has no business running beside it.
      # Publishing runs only this repo's scripts and `npm publish`; it needs no git hooks.
      - name: install
        run: bun install --frozen-lockfile --ignore-scripts

      # Published in dependency-tier order — a package must be on the registry before anything that
      # imports it — and the list is DERIVED, never kept by hand.
      #
      # It used to be seven hand-written steps of `-w` flags, and `@ultimat3/flags` was on none of
      # them, so the registry answered 404 for it while its siblings published: flags declares the
      # same `publishConfig`, every consumer resolves it through the workspace, and nothing in this
      # repo could notice. The missing entry was the symptom; a list that has to match a derived one
      # is the defect, and adding one line would have fixed that day and re-broken on the next
      # package somebody added — which is exactly what happened to `@ultimat3/scraping`, added after
      # the 2.0.0 run and 404 until it was bootstrapped by hand on 2026-08-19.
      #
      # `scripts/list-workspaces.ts` reads the real package.json files rather than the tier table,
      # so a package that exists on disk cannot be invisible here — and `create-ultimate` lands last
      # because it is tier 6, not because a step says so.
      #
      # RESUMABLE: a package npm already holds at this version is skipped and logged. Without it a
      # run that died half way — a registry 5xx, a runner lost mid-tier — could never be re-run: the
      # first package the failed attempt had published answered E403 and stopped everything after
      # it. A failed `npm view` is read as "not published", so the worst it can cost is that E403,
      # never a skipped package.
      - name: publish, tier by tier
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION:-}" ]; then
            echo "::error::the check job produced no version — it must succeed before this job can run"
            exit 1
          fi
          plan="$(bun run scripts/list-workspaces.ts --json | jq -r '
            .data
            | map(select(.publish == "public"))
            | group_by(.tier) | sort_by(.[0].tier)
            | .[] | "\(.[0].tier)\t\(map(.name) | join(" "))"')"
          if [ -z "$plan" ]; then
            echo "::error::no publishable workspaces — scripts/list-workspaces.ts returned an empty set, which means this checkout is not the repo it should be"
            exit 1
          fi
          while IFS="$(printf '\t')" read -r tier names; do
            [ -n "$tier" ] || continue
            # ONE `npm publish` per package, never `-w a -w b …` in one command. Each invocation
            # exchanges its own short-lived OIDC token: v22.4.0's tier-0 command published core,
            # then died `E401 … token is invalid` on schema 71 s later while the registry was slow
            # to stage — and every re-run lost the rest of its tier the same way.
            for name in $names; do
              held="$(npm view "${name}@${VERSION}" version 2>/dev/null || true)"
              if [ "$held" = "$VERSION" ]; then
                echo "::notice::skipping ${name}@${VERSION} — npm already holds it, published by an earlier attempt of this release"
                continue
              fi
              echo "::group::npm publish — tier $tier: $name"
              if ! out="$(npm publish -w "$name" 2>&1)"; then
                echo "$out"
                # npm STAGES a publish before `npm view` can see it, so an attempt that raced a
                # previous one meets its own staged copy. That version is already this release's.
                if printf '%s' "$out" | grep -q 'previously staged version'; then
                  echo "::notice::${name}@${VERSION} is staged by an earlier attempt — npm will publish it"
                  echo "::endgroup::"
                  continue
                fi
                exit 1
              fi
              echo "$out"
              echo "::endgroup::"
            done
          done <<< "$plan"

  # Is what npm SERVES a working app? CI's scaffold smoke builds against workspace links, so a
  # scaffold that imports an export the registry lacks passes every gate and fails `docker build` on
  # a user's machine (found by plan 101 sweep 10e; proven by hand for 25.0.0). This job is the same
  # walk against the just-published version, with no workspace on the path: wait until the registry
  # audit sees every package at this version, attested; `bunx create-ultimate@<version>`; install;
  # the scaffold's own setup and check; the production image. It holds no `id-token` — nothing here
  # can publish — and a red run means the release shipped broken and the next patch is owed.
  npm-scaffold:
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: install (for the registry audit only)
        run: bun install --frozen-lockfile --ignore-scripts

      # npm answers "may take a few minutes to become available" after a publish, and 25.0.0 took
      # several: the audit is polled, never read once.
      - name: wait for every package on npm at this version, attested
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if bun run scripts/registry-audit.ts --json > audit.json; then
              jq -r '.summary' audit.json
              exit 0
            fi
            echo "attempt ${attempt}: $(jq -r '.summary' audit.json)"
            sleep 30
          done
          jq -r '.findings[] | "\(.code) \(.cause)"' audit.json
          exit 1

      - name: scaffold, set up, check and build from npm
        env:
          VERSION: ${{ needs.check.outputs.version }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          bunx "create-ultimate@${VERSION}" npmapp
          cd npmapp
          grep -q "\"@ultimat3/cli\": \"^${VERSION}\"" package.json
          bun install
          bun run setup
          bun run check
          docker build -f docker/Dockerfile -t "npmapp:${VERSION}" .
