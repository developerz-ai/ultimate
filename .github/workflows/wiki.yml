name: wiki

# Mirrors wiki/ into the GitHub wiki on every push to main. The wiki is a projection of the repo,
# never the source: edits made in the wiki UI are overwritten, so the review path stays the PR.

on:
  push:
    branches: [main]
    paths: ['wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

concurrency:
  group: wiki
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # REFUSES, where it used to set `present=false` and let the push step skip.
      #
      # `rsync --delete` two steps down is what makes the wiki a projection rather than an archive:
      # a page deleted here is deleted there. An empty `wiki/` is the one input for which that
      # matters most — every page has been removed — and skipping the sync turned it into the one
      # input where nothing is deleted at all. The run reported ✅ and the GitHub wiki kept serving
      # every orphaned page, forever, with no error anywhere.
      #
      # An empty source directory is a signal to investigate, never a reason to skip. If the wiki is
      # genuinely being retired, that is a deletion of this workflow — a reviewable change — and not
      # a silent no-op discovered months later by a reader following a stale link.
      - name: require wiki sources
        run: |
          set -euo pipefail
          if [ ! -d wiki ] || [ -z "$(ls -A wiki 2>/dev/null)" ]; then
            echo "::error title=No wiki sources::wiki/ is missing or empty, so this run would have skipped the push and left the GitHub wiki serving pages this repository no longer has. fix: restore the directory with 'git checkout HEAD~1 -- wiki' (or 'git log --diff-filter=D -- wiki' to find what removed it); if the wiki is being retired, delete .github/workflows/wiki.yml in the same change."
            exit 1
          fi

      - name: push to the wiki
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A wiki has no git repository until its first page exists, and there is no REST API
          # that creates one — so a clone against a never-opened wiki fails "Repository not
          # found", which reads like a permissions problem and is not. Say what it is instead.
          if ! git clone "https://x-access-token:${GIT_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" .wiki 2>/dev/null; then
            echo "::error title=Wiki not initialised::${GITHUB_REPOSITORY}.wiki.git does not exist yet. GitHub creates the wiki repository on its first page, and only through the UI. fix: open https://github.com/${GITHUB_REPOSITORY}/wiki, click 'Create the first page', save anything — this workflow overwrites it on the next run."
            exit 1
          fi
          rsync -a --delete --exclude '.git' wiki/ .wiki/
          cd .wiki
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "wiki: sync from ${GITHUB_SHA::7}"
          git push
