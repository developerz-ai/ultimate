version: 2

# Weekly, grouped, and small. A dependency PR that nobody can review in one sitting gets merged
# without being read, which is worse than being a version behind.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    # Let a release sit for 14 days before we look at it. Most yanked versions and
    # supply-chain incidents are caught within that window, and the default is only 3.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-tooling:
        patterns: ['@biomejs/*', 'typescript', 'lefthook', '@types/*']
        update-types: [minor, patch]
      runtime:
        patterns: ['*']
        exclude-patterns: ['@biomejs/*', 'typescript', 'lefthook', '@types/*']
        update-types: [minor, patch]
    ignore:
      # Bun is pinned by `engines` and installed by the workflow, not by npm.
      - dependency-name: bun

  # `/` reaches `.github/workflows/` only; the composite in `.github/actions/setup/` pins actions by
  # SHA too, and a pin Dependabot cannot see is a pin that rots.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies, ci]
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']

  # Every base image is pinned by digest beside its tag; these are the directories that pin one.
  - package-ecosystem: docker
    directories: ['/docker', '/dummy/social-media-clone/docker', '/examples/dummy/docker']
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies, docker]
    commit-message:
      prefix: 'chore(docker)'
    ignore:
      # A Postgres MAJOR is a planned migration, never a weekly bump: 18 moves PGDATA and a dev
      # volume written by 17 needs pg_upgrade (#655, closed 2026-10-07). Minors still flow.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']

  # The `docker` ecosystem reads Dockerfiles only; the compose files pin their service images by
  # digest beside the tag too (scripts/test-services-shape.test.ts), and a pin nothing moves rots.
  - package-ecosystem: docker-compose
    directories: ['/docker']
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies, docker]
    commit-message:
      prefix: 'chore(docker)'
    ignore:
      # The same Postgres-major rule as the Dockerfile ecosystem above (#655).
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
